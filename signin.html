<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Bazaarin</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/samarkan" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <svg class="logo-icon-svg" width="32" height="32" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                                        <circle cx="50" cy="50" r="22" stroke="#F59E0B" stroke-width="6" fill="none"/>
                    <path d="M34 34 L 66 66 M 34 66 L 66 34" stroke="#F59E0B" stroke-width="6" stroke-linecap="round"/>
                    <circle cx="50" cy="20" r="6" fill="#F59E0B"/><circle cx="50" cy="80" r="6" fill="#F59E0B"/>
                    <circle cx="20" cy="50" r="6" fill="#F59E0B"/><circle cx="80" cy="50" r="6" fill="#F59E0B"/>
                </svg>
                <h1 class="logo-text">bazaar<span class="logo-in">in</span></h1>
            </a>
            <div class="nav-links">
                <a href="index.html" class="nav-link">Back to Home</a>
            </div>
        </div>
    </nav>

    <main class="container auth-page">
        <div class="auth-card">
            <h2>Sign in to Bazaarin</h2>
            <p id="introSubtitle" class="hero-subtitle">Are you here to buy or to sell?</p>

            <div id="roleOptions" class="auth-options">
                <button type="button" id="roleCustomerBtn" class="auth-provider-btn mobile-btn">
                    <span class="auth-provider-icon">B</span> I'm a Customer — I want to buy
                </button>
                <button type="button" id="roleSellerBtn" class="auth-provider-btn apple-btn">
                    <span class="auth-provider-icon">S</span> I'm a Seller — I want to list items
                </button>
            </div>

            <div id="authOptions" class="auth-options hidden">
                <button type="button" id="googleBtn" class="auth-provider-btn google-btn">
                    <span class="auth-provider-icon">G</span> Continue with Google
                </button>
                <button type="button" id="appleBtn" class="auth-provider-btn apple-btn">
                    <span class="auth-provider-icon">A</span> Continue with Apple
                </button>
                <button type="button" id="mobileBtn" class="auth-provider-btn mobile-btn">
                    <span class="auth-provider-icon">#</span> Continue with Mobile Number
                </button>
                <button type="button" class="auth-back-link" data-back-role>&larr; Back</button>
            </div>

            <div id="authConnecting" class="auth-connecting hidden">
                <p id="connectingText">Connecting…</p>
            </div>

            <form id="mobileForm" class="hidden">
                <div class="form-field">
                    <label for="mobileNumber">Mobile Number</label>
                    <input type="tel" id="mobileNumber" placeholder="e.g. 98765 43210" required>
                </div>
                <button type="submit" class="btn-primary large">Send OTP</button>
                <button type="button" class="auth-back-link" data-back>&larr; Use a different method</button>
            </form>

            <form id="otpForm" class="hidden">
                <div class="form-field">
                    <label for="otpCode">Enter OTP</label>
                    <input type="text" id="otpCode" placeholder="e.g. 1234" maxlength="6" required autocomplete="off">
                </div>
                <p class="form-hint">Demo mode — any code works, no OTP is actually sent.</p>
                <button type="submit" class="btn-primary large">Verify &amp; Continue</button>
                <button type="button" class="auth-back-link" data-back>&larr; Use a different method</button>
            </form>

            <form id="nameForm" class="hidden">
                <p id="nameFormNote" class="form-hint" style="margin-bottom:16px;"></p>
                <div class="form-field">
                    <label for="displayName">Display Name</label>
                    <input type="text" id="displayName" placeholder="e.g. Priya Sharma" required autocomplete="off">
                </div>
                <button type="submit" class="btn-primary large">Continue</button>
                <button type="button" class="auth-back-link" data-back>&larr; Use a different method</button>
            </form>

            <p class="form-hint" style="margin-top:24px;">This is a demo account system — no real Google or Apple sign-in happens, no OTP is sent, and no password is ever collected.</p>
        </div>
    </main>

    <script src="auth.js"></script>
    <script src="signin.js"></script>
</body>
</html>
