<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bazaarin | Premium Secondhand Electronics</title>
    <meta name="description" content="Buy and sell premium secondhand laptops, mobiles, and smartwatches.">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/samarkan" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <svg class="logo-icon-svg" width="32" height="32" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                                        <circle cx="50" cy="50" r="22" stroke="#F59E0B" stroke-width="6" fill="none"/>
                    <path d="M34 34 L 66 66 M 34 66 L 66 34" stroke="#F59E0B" stroke-width="6" stroke-linecap="round"/>
                    <circle cx="50" cy="20" r="6" fill="#F59E0B"/><circle cx="50" cy="80" r="6" fill="#F59E0B"/>
                    <circle cx="20" cy="50" r="6" fill="#F59E0B"/><circle cx="80" cy="50" r="6" fill="#F59E0B"/>
                </svg>
                <h1 class="logo-text">bazaar<span class="logo-in">in</span></h1>
            </div>
            <div class="nav-links">
                <div class="dropdown">
                    <button class="kebab-menu" onclick="toggleMenu()" aria-label="Menu" aria-haspopup="true">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
                    </button>
                    <div class="dropdown-content" id="myDropdown">
                        <a href="signin.html" id="signInBtn">Sign In</a>
                        <a href="shop.html">Browse Devices</a>
                        <a href="sell.html">List an Item</a>
                        <a href="compare.html">Compare</a>
                        <a href="seller.html" id="dashboardLink" class="hidden">Seller Dashboard</a>
                        <a href="#">Customer Service</a>
                        <a href="#" id="logoutLink">Logout</a>
                    </div>
                </div>
            </div>
</div>
    </nav>

    <!-- Landing: a split partition. The white panel holds the sign-in choice
         (injected by home.js, since it differs for a signed-in buyer), the
         violet panel is a drift field of line-art laptops and phones. The two
         device types run diagonally opposite paths — laptops south-east,
         phones north-west — so the field reads as two streams crossing. -->
    <div class="landing-split">
        <div class="landing-left">
            <div class="hero-content" id="heroContent">
                <!-- Injected by home.js: the sign-in choice when signed out, a
                     buyer's category chooser when signed in. -->
            </div>
            <p class="landing-tagline">Build for India.</p>
        </div>
        <!-- Filled by home.js, which also measures the panel to set the
             drift distance. -->
        <div class="landing-right" id="driftPanel" aria-hidden="true"></div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-content">
            <div class="logo">
                <svg class="logo-icon-svg" width="24" height="24" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                                        <circle cx="50" cy="50" r="22" stroke="#F59E0B" stroke-width="6" fill="none"/>
                    <path d="M34 34 L 66 66 M 34 66 L 66 34" stroke="#F59E0B" stroke-width="6" stroke-linecap="round"/>
                    <circle cx="50" cy="20" r="6" fill="#F59E0B"/><circle cx="50" cy="80" r="6" fill="#F59E0B"/>
                    <circle cx="20" cy="50" r="6" fill="#F59E0B"/><circle cx="80" cy="50" r="6" fill="#F59E0B"/>
                </svg>
                <h2 class="logo-text" style="font-size: 1.8rem;">bazaar<span class="logo-in">in</span></h2>
            </div>
            <p>&copy; 2026 bazaarin. Build for India.</p>
        </div>
    </footer>

    <script src="data.js"></script>
    <script src="autocomplete.js"></script>
    <script src="auth.js"></script>
    <script src="home.js"></script>
</body>
</html>
