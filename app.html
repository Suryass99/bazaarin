            introSubtitle.textContent = role === 'seller'
                ? "Signing in as a Seller — choose how you'd like to continue."
                : "Signing in as a Customer — choose how you'd like to continue.";
            showOnly(authOptions);
        }

        document.getElementById('roleCustomerBtn').addEventListener('click', () => chooseRole('customer'));
        document.getElementById('roleSellerBtn').addEventListener('click', () => chooseRole('seller'));

        const presetRole = params.get('role');
        if (presetRole === 'seller' || presetRole === 'customer') {
            chooseRole(presetRole);
        }

        function goToNameStep(note) {
            nameFormNote.textContent = note;
            showOnly(nameForm);
        }

        document.getElementById('googleBtn').addEventListener('click', () => {
            connectingText.textContent = 'Connecting to Google…';
            showOnly(authConnecting);
            setTimeout(() => {
                goToNameStep("This demo can't pull a real Google profile — just confirm a display name to finish.");
            }, 1000);
        });

        document.getElementById('appleBtn').addEventListener('click', () => {
            connectingText.textContent = 'Connecting to Apple…';
            showOnly(authConnecting);
            setTimeout(() => {
                goToNameStep("This demo can't pull a real Apple profile — just confirm a display name to finish.");
            }, 1000);
        });

        document.getElementById('mobileBtn').addEventListener('click', () => {
            showOnly(mobileForm);
        });

        mobileForm.addEventListener('submit', (e) => {
            e.preventDefault();
            showOnly(otpForm);
        });

        otpForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const phone = document.getElementById('mobileNumber').value.trim();
            goToNameStep(`Verified ${phone} — enter a display name to finish.`);
        });

        nameForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('displayName').value.trim();
            if (!name) return;
            login(name, selectedRole);
            const redirect = params.get('redirect');
            location.hash = '#/' + (redirect || (selectedRole === 'seller' ? 'seller' : ''));
        });

        document.querySelectorAll('[data-back]').forEach(btn => {
            btn.addEventListener('click', () => showOnly(authOptions));
        });
        document.querySelectorAll('[data-back-role]').forEach(btn => {
            btn.addEventListener('click', () => showOnly(roleOptions));
        });
    }

    // ===================================================================
    // PAGE: staff login (from admin-login.html + admin-login.js)
    // ===================================================================
    function renderAdminLoginRoute(root) {
        root.innerHTML = `
            <div class="auth-card">
                <h2>Bazaarin Staff Login</h2>
                <p id="introSubtitle" class="hero-subtitle">Select your department to continue.</p>

                <div id="deptOptions" class="auth-options">
                    <button type="button" id="deptStatsBtn" class="auth-provider-btn mobile-btn">
                        <span class="auth-provider-icon">📊</span> Stats & Analytics
                    </button>
                    <button type="button" id="deptSupportBtn" class="auth-provider-btn google-btn">
                        <span class="auth-provider-icon">🎧</span> Tech Support
                    </button>
                    <button type="button" id="deptFinanceBtn" class="auth-provider-btn apple-btn">
                        <span class="auth-provider-icon">💰</span> Finance Department
                    </button>
                </div>

                <form id="nameForm" class="hidden">
                    <p id="nameFormNote" class="form-hint" style="margin-bottom:16px;"></p>
                    <div class="form-field">
                        <label for="displayName">Staff Name</label>
                        <input type="text" id="displayName" placeholder="e.g. Anita Rao" required autocomplete="off">
                    </div>
                    <button type="submit" class="btn-primary large">Continue</button>
                    <button type="button" class="auth-back-link" id="backBtn">&larr; Back</button>
                </form>

                <p class="form-hint" style="margin-top:24px;">This is a demo account system — no real credential is collected.</p>
            </div>
        `;

        const deptOptions = document.getElementById('deptOptions');
        const nameForm = document.getElementById('nameForm');
        const nameFormNote = document.getElementById('nameFormNote');

        let selectedDept = null;

        function chooseDept(dept) {
            selectedDept = dept;
            nameFormNote.textContent = `Signing in to ${deptLabels[dept]} — confirm a staff name to finish.`;
            deptOptions.classList.add('hidden');
            nameForm.classList.remove('hidden');
        }

        document.getElementById('deptStatsBtn').addEventListener('click', () => chooseDept('stats'));
        document.getElementById('deptSupportBtn').addEventListener('click', () => chooseDept('techsupport'));
        document.getElementById('deptFinanceBtn').addEventListener('click', () => chooseDept('finance'));

        document.getElementById('backBtn').addEventListener('click', () => {
            nameForm.classList.add('hidden');
            deptOptions.classList.remove('hidden');
        });

        nameForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('displayName').value.trim();
            if (!name) return;
            login(name, 'admin', selectedDept);
            location.hash = '#/admin';
        });
    }

    // ===================================================================
    // PAGE: admin dashboard (from admin.html + admin.js)
    // ===================================================================
    const DEMO_TOTAL_USERS = 8624;

    function distinctSellerCount() {
        return new Set(products.map(p => p.sellerName)).size;
    }

    function renderAdminRoute(root) {
        const user = getCurrentUser();
        if (!user) {
            root.innerHTML = `
                <div class="sell-gate">
                    <h2>Staff Sign In Required</h2>
                    <p class="hero-subtitle">The Admin area is only available to Bazaarin staff accounts.</p>
                    <a href="#/admin-login" class="btn-primary large" style="display:inline-block; margin-top:16px;">Staff Sign In</a>
                </div>
            `;
            return;
        }
        if (user.accountType !== 'admin') {
            const accountLabel = user.accountType === 'seller' ? 'Seller' : 'Customer';
            root.innerHTML = `
                <div class="sell-gate">
                    <h2>This is a staff-only area</h2>
                    <p class="hero-subtitle">You're signed in as ${user.name} (${accountLabel} account). Sign in with a staff account to continue.</p>
                    <button type="button" id="switchToStaffBtn" class="btn-primary large" style="margin-top:16px;">Switch to Staff Account</button>
                </div>
            `;
            document.getElementById('switchToStaffBtn').addEventListener('click', () => {
                logout();
                location.hash = '#/admin-login';
            });
            return;
        }

        if (user.department === 'techsupport') renderTechSupport(root, user);
        else if (user.department === 'finance') renderFinance(root, user);
        else renderStats(root, user);
    }

    function renderStats(root, user) {
        const totalFeedback = getQueries().length;
        root.innerHTML = `
            <span class="admin-dept-badge">${deptLabels[user.department]}</span>
            <h2 class="section-title">Platform Stats</h2>
            <p class="hero-subtitle" style="margin-bottom:24px;">Signed in as ${user.name}.</p>
            <div class="admin-stats-grid">
                <div class="stat-card">
                    <span class="stat-value">${DEMO_TOTAL_USERS.toLocaleString('en-IN')}</span>
                    <span class="stat-label">Registered Users</span>
                </div>
                <div class="stat-card">
                    <span class="stat-value">${distinctSellerCount()}</span>
                    <span class="stat-label">Active Sellers</span>
                </div>
                <div class="stat-card">
                    <span class="stat-value">${products.length}</span>
                    <span class="stat-label">Listed Products</span>
                </div>
                <div class="stat-card">
                    <span class="stat-value">${totalFeedback}</span>
                    <span class="stat-label">Buyer Feedback / Queries</span>
                </div>
            </div>
            <p class="form-hint">Registered Users is a simulated platform-wide figure — this demo has no real backend or user registry. Sellers, Products, and Feedback are computed live from this session's catalog and query data.</p>
        `;
    }

    function renderTechSupport(root, user) {
        const allQueries = getQueries().slice().sort((a, b) => b.timestamp - a.timestamp);
        root.innerHTML = `
            <span class="admin-dept-badge">${deptLabels[user.department]}</span>
            <h2 class="section-title">Tech Support Queue</h2>
            <p class="hero-subtitle" style="margin-bottom:24px;">Signed in as ${user.name}.</p>
            <div class="sell-section">
                <h3>All Buyer Queries (${allQueries.length})</h3>
                ${allQueries.length === 0 ? `
                    <p class="no-results" style="padding:24px 0;">No queries yet.</p>
                ` : `
                    <div id="queriesList">
                        ${allQueries.map(q => `
                            <div class="query-item">
                                <div class="query-meta">
                                    <strong>${q.buyerName}</strong> asked <strong>${q.sellerName}</strong> about <a href="#/product?id=${q.productId}">${q.productTitle}</a>
                                    <span class="form-hint">${formatRelativeTime(q.timestamp)}</span>
                                </div>
                                <p class="query-message">"${q.message}"</p>
                                ${q.answered
                                    ? '<span class="query-answered">✓ Resolved</span>'
                                    : `<button type="button" class="btn-secondary query-reply-btn" data-query-id="${q.id}">Mark Resolved</button>`
                                }
                            </div>
                        `).join('')}
                    </div>
                `}
            </div>
        `;
        document.querySelectorAll('.query-reply-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                markQueryReplied(btn.dataset.queryId);
                renderTechSupport(root, user);
            });
        });
    }

    function renderFinance(root, user) {
        const laptops = products.filter(p => p.category === 'Laptops');
        const mobiles = products.filter(p => p.category === 'Mobiles');
        const totalValue = products.reduce((sum, p) => sum + p.price, 0);
        const laptopValue = laptops.reduce((sum, p) => sum + p.price, 0);
        const mobileValue = mobiles.reduce((sum, p) => sum + p.price, 0);
        const emiEligible = products.filter(p => p.price >= 20000);
        const avgEmi1yr = emiEligible.length
            ? Math.round(emiEligible.reduce((sum, p) => sum + calculateEMI(p.price, 6, 12), 0) / emiEligible.length)
            : 0;

        root.innerHTML = `
            <span class="admin-dept-badge">${deptLabels[user.department]}</span>
            <h2 class="section-title">Finance Overview</h2>
            <p class="hero-subtitle" style="margin-bottom:24px;">Signed in as ${user.name}.</p>
            <div class="admin-stats-grid">
                <div class="stat-card">
                    <span class="stat-value">₹${totalValue.toLocaleString('en-IN')}</span>
                    <span class="stat-label">Total Catalog Value</span>
                </div>
                <div class="stat-card">
                    <span class="stat-value">₹${laptopValue.toLocaleString('en-IN')}</span>
                    <span class="stat-label">Laptop Value (${laptops.length})</span>
                </div>
                <div class="stat-card">
                    <span class="stat-value">₹${mobileValue.toLocaleString('en-IN')}</span>
                    <span class="stat-label">Mobile Value (${mobiles.length})</span>
                </div>
                <div class="stat-card">
                    <span class="stat-value">${emiEligible.length}</span>
                    <span class="stat-label">EMI-Eligible Listings (&ge;₹20k)</span>
                </div>
                <div class="stat-card">
                    <span class="stat-value">₹${avgEmi1yr.toLocaleString('en-IN')}/mo</span>
                    <span class="stat-label">Avg. 1-Year EMI (6% p.a.)</span>
                </div>
            </div>
            <p class="form-hint">Figures are computed live from this session's product catalog.</p>
        `;
    }

    // ===================================================================
    // PAGE: access portal (from portal.html) — deliberately not linked
    // from anywhere in the app's nav or footer.
    // ===================================================================
    function renderPortalRoute(root) {
        root.innerHTML = `
            <div class="portal-card">
                <span class="badge">Access Portal</span>
                <h2 class="hero-title">Continue as&hellip;</h2>
                <p class="hero-subtitle">Pick how you'd like to use Bazaarin.</p>

                <div class="portal-options">
                    <a href="#/signin?role=customer" class="portal-option buyer">
                        <span class="portal-option-icon" aria-hidden="true">🛍️</span>
                        <span class="portal-option-text">
                            <strong>I'm a Buyer</strong>
                            <small>Browse and buy certified refurbished electronics</small>
                        </span>
                    </a>
                    <a href="#/signin?role=seller" class="portal-option seller">
                        <span class="portal-option-icon" aria-hidden="true">🏷️</span>
                        <span class="portal-option-text">
                            <strong>I'm a Seller</strong>
                            <small>List items and manage your Seller Dashboard</small>
                        </span>
                    </a>
                    <a href="#/admin-login" class="portal-option staff">
                        <span class="portal-option-icon" aria-hidden="true">🔐</span>
                        <span class="portal-option-text">
                            <strong>Staff Login</strong>
                            <small>Tech Support, Finance, or Stats &amp; Analytics</small>
                        </span>
                    </a>
                </div>

                <p class="form-hint portal-note">This page is intentionally not linked from Bazaarin's public site. Real marketplaces (OLX included) don't put staff/admin sign-in on the customer-facing landing page either — it lives at a separate URL that only staff are given, so it never shows up for an ordinary visitor. Bookmark this page if you're on the Bazaarin team.</p>
            </div>
        `;
    }

    // ===================================================================
    // INIT
    // ===================================================================
    window.addEventListener('hashchange', navigate);
    document.addEventListener('DOMContentLoaded', navigate);
    </script>
</body>
</html>
