<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bazaarin | Premium Secondhand Electronics</title>
    <meta name="description" content="Buy and sell premium secondhand laptops, mobiles, and smartwatches.">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/samarkan" rel="stylesheet">
    <style>
/* --- Design System & Tokens --- */
:root {
    /* Surfaces. The page carries a faint violet-grey tint so that white
       cards read as cards sitting on it; --color-bg stays pure white for
       anything that should sit flush. --color-sunken is for the recessed
       panels behind product photography and table headers. */
    --color-page: #f4f5fb;
    --color-bg: #ffffff;
    --color-surface: #ffffff;
    --color-surface-hover: #f4f5fb;
    --color-sunken: #e8eafa;

    --color-primary: #10b981;
    --color-primary-glow: rgba(16, 185, 129, 0.3);
    --color-secondary: #8b5cf6;
    --color-text-main: #0f172a;
    --color-text-muted: #475569;
    --color-border: #e6e8f2;
    --color-success: #059669;

    /* Brand accents, plus the pale tints used for badges and soft fills.
       These are the same green/violet/orange the site has always used. */
    --color-violet: #6d28d9;
    --color-violet-soft: #ede9fe;
    --color-green-deep: #054636;
    --color-green-soft: #d6f5e6;
    --color-orange: #f59e0b;
    --color-orange-soft: #fef3c7;

    --font-main: 'Outfit', sans-serif;

    /* Soft-cornered shape language, taken from the reference screens. To go
       back to the previous fully square look, set all four to 0. */
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-full: 9999px;

    /* Light-theme shadows: these used to be near-black and far too heavy
       for a white page. */
    --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06), 0 1px 3px rgba(15, 23, 42, 0.08);
    --shadow-md: 0 12px 32px rgba(15, 23, 42, 0.10);
    --shadow-card: 0 1px 3px rgba(15, 23, 42, 0.06);
    --shadow-glow: 0 8px 22px rgba(5, 150, 105, 0.28);

    --transition-fast: 0.2s ease;
    --transition-smooth: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

/* --- Reset & Global --- */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: var(--font-main);
    background-color: var(--color-page);
    color: var(--color-text-main);
    line-height: 1.5;
    overflow-x: hidden;
}

a {
    text-decoration: none;
    color: inherit;
}

button {
    font-family: inherit;
    border: none;
    cursor: pointer;
    background: none;
}

/* --- Typography --- */
h1, h2, h3, h4 {
    font-weight: 700;
    line-height: 1.2;
}

.text-gradient {
    background: linear-gradient(135deg, var(--color-primary), var(--color-secondary));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

/* --- Layout --- */
.container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 24px;
}

/* --- Navbar --- */
.navbar {
    position: fixed;
    top: 0;
    width: 100%;
    z-index: 100;
    background: linear-gradient(100deg, #054636 0%, #0d7a53 30%, #5b21b6 72%, #3b0764 100%);
    border-bottom: 1px solid rgba(139, 92, 246, 0.4);
    transition: var(--transition-smooth);
}

.nav-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
}

/* Back arrow, pinned to the far top-left ahead of the logo. Replaces the
   old "Back to Shop" / "Back to Home" text links. */
.nav-back {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    flex-shrink: 0;
    margin-left: -6px;
    border-radius: var(--radius-full);
    color: #ffffff;
    transition: var(--transition-fast);
}
.nav-back:hover {
    background: rgba(255, 255, 255, 0.16);
}
.nav-back:active {
    transform: scale(0.94);
}

.logo {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: -0.5px;
    min-width: 0;
    flex-shrink: 1;
}

.logo-icon-svg {
    filter: drop-shadow(0 2px 4px rgba(245, 158, 11, 0.4));
    animation: logoSpin 14s linear infinite;
    transform-origin: 50% 50%;
}
@keyframes logoSpin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}
@media (prefers-reduced-motion: reduce) {
    .logo-icon-svg {
        animation: none;
    }
}
.logo-text {
    font-family: 'Samarkan', 'Dancing Script', cursive;
    font-size: 2.8rem;
    margin-left: 4px;
    font-weight: normal;
    color: var(--color-text-main);
    line-height: 1;
}

/* Indian tricolor applied only to the "in" of "bazaarin", blended as a
   smooth gradient rather than hard stripes. */
.logo-in {
    background: linear-gradient(90deg, #FF9933 0%, #FFFFFF 50%, #138808 100%);
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
}

.navbar .logo-text {
    color: #ffffff;
}

.search-bar {
    flex: 1 1 280px;
    max-width: 560px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
}

.search-bar input {
    min-width: 0;
    padding: 12px 20px;
    border-radius: var(--radius-full);
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    color: var(--color-text-main);
    font-size: 1rem;
    transition: var(--transition-fast);
}

/* 70/30 split: product search gets the lion's share, location is the narrow
   second field. Both carry a min-width and a pixel flex-basis so they wrap
   onto their own line instead of shrinking down to an unusable sliver. */
.search-input-product {
    flex: 7 1 200px;
    min-width: 160px;
}

.search-input-location {
    flex: 3 1 120px;
    min-width: 110px;
}

.search-bar input:focus {
    outline: none;
    border-color: var(--color-primary);
    box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.25);
}

.autocomplete-wrapper {
    position: relative;
    min-width: 0;
}

.autocomplete-input {
    width: 100%;
}

.autocomplete-list {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    right: 0;
    background: var(--color-bg);
    border: 1px solid var(--color-border);
    box-shadow: var(--shadow-md);
    z-index: 300;
    max-height: 240px;
    overflow-y: auto;
    text-align: left;
}

.autocomplete-item {
    padding: 10px 16px;
    cursor: pointer;
    font-size: 0.95rem;
    color: var(--color-text-main);
}

.autocomplete-item:hover {
    background: var(--color-surface-hover);
    color: var(--color-primary);
}

.search-btn {
    flex: 0 0 auto;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255, 255, 255, 0.8);
    transition: var(--transition-fast);
}

.search-btn:hover {
    color: #ffffff;
    background: rgba(255, 255, 255, 0.12);
}

.nav-links {
    display: flex;
    align-items: center;
    gap: 24px;
}

.nav-link {
    font-weight: 500;
    color: rgba(255, 255, 255, 0.75);
    transition: var(--transition-fast);
}

.nav-link:hover {
    color: #ffffff;
}

/* --- Buttons --- */
.btn-primary {
    background: var(--color-primary);
    color: white;
    padding: 10px 24px;
    border-radius: var(--radius-full);
    font-weight: 600;
    transition: var(--transition-fast);
    box-shadow: var(--shadow-sm);
}

.btn-primary:hover {
    box-shadow: var(--shadow-glow);
    transform: translateY(-2px);
}

.btn-secondary {
    background: var(--color-surface);
    color: var(--color-text-main);
    padding: 10px 24px;
    border-radius: var(--radius-full);
    border: 1px solid var(--color-border);
    font-weight: 600;
    transition: var(--transition-fast);
}

.btn-secondary:hover {
    background: var(--color-surface-hover);
    transform: translateY(-2px);
}

.large {
    padding: 16px 36px;
    font-size: 1.1rem;
}

/* The filled/outlined green pair — the primary action and the quieter one
   sitting beneath it, as on the product page's Buy Now / Compare. */
.btn-dark-green {
    background: var(--color-green-deep);
    color: white;
    padding: 12px 26px;
    border-radius: var(--radius-full);
    font-weight: 600;
    box-shadow: var(--shadow-sm);
    transition: var(--transition-fast);
}

.btn-dark-green:hover {
    background: #0a5c46;
    box-shadow: var(--shadow-glow);
    transform: translateY(-2px);
}

.btn-pale-green {
    background: var(--color-bg);
    color: var(--color-green-deep);
    padding: 12px 26px;
    border-radius: var(--radius-full);
    border: 1.5px solid var(--color-green-deep);
    font-weight: 600;
    transition: var(--transition-fast);
}

.btn-pale-green:hover {
    background: var(--color-green-soft);
    transform: translateY(-2px);
}

/* Violet pill — the secondary accent action, e.g. "Use My Location". */
.btn-violet {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--color-violet);
    color: #ffffff;
    padding: 11px 22px;
    border-radius: var(--radius-full);
    font-weight: 600;
    font-size: 0.9rem;
    letter-spacing: 0.3px;
    box-shadow: var(--shadow-sm);
    transition: var(--transition-fast);
}

.btn-violet:hover {
    background: #5b21b6;
    transform: translateY(-2px);
    box-shadow: 0 8px 22px rgba(109, 40, 217, 0.3);
}

/* Circular icon button — the arrow that sits in the corner of the landing
   choice cards and anywhere else a bare directional control is needed. */
.btn-circle {
    width: 52px;
    height: 52px;
    border-radius: var(--radius-full);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    color: #ffffff;
    transition: var(--transition-fast);
}

/* --- Hero Section --- */
.hero {
    position: relative;
    padding: 180px 24px 100px;
    text-align: center;
    overflow: hidden;
    background: var(--color-bg);
}

.hero-curve {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    opacity: 0.4;
    pointer-events: none;
    will-change: transform;
}

/* Idle drift so the wave always feels like moving water, even before the
   page scrolls — scroll adds a parallax offset via JS on top of this. */
.hero-curve .wave-main {
    animation: waterDriftMain 9s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: center;
}
.hero-curve .wave-blob {
    animation: waterDriftBlob 6.5s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: center;
}
@keyframes waterDriftMain {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-14px, 8px) scale(1.015); }
}
@keyframes waterDriftBlob {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(10px, -10px); }
}
@media (prefers-reduced-motion: reduce) {
    .hero-curve .wave-main,
    .hero-curve .wave-blob {
        animation: none;
    }
}

/* Large faint logo mark slowly spinning behind the hero copy. */
.hero-logo-spin {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 1;
    opacity: 0.08;
    pointer-events: none;
    animation: heroLogoSpin 40s linear infinite;
}
@keyframes heroLogoSpin {
    from { transform: translate(-50%, -50%) rotate(0deg); }
    to { transform: translate(-50%, -50%) rotate(360deg); }
}
@media (prefers-reduced-motion: reduce) {
    .hero-logo-spin {
        animation: none;
    }
}

.hero-content {
    position: relative;
    z-index: 10;
    max-width: 800px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
}

.badge {
    background: rgba(16, 185, 129, 0.1);
    color: var(--color-success);
    padding: 6px 16px;
    border-radius: var(--radius-full);
    font-size: 0.875rem;
    font-weight: 600;
    border: 1px solid rgba(16, 185, 129, 0.2);
}

.hero-title {
    font-size: 4rem;
    letter-spacing: -1px;
}

.hero-subtitle {
    font-size: 1.25rem;
    color: var(--color-text-muted);
    max-width: 600px;
}

.hero-actions {
    display: flex;
    gap: 16px;
    margin-top: 16px;
}

/* --- Categories --- */
.categories {
    margin-bottom: 64px;
}

.section-title {
    font-size: 1.75rem;
    margin-bottom: 24px;
}

.category-grid {
    display: flex;
    gap: 16px;
    overflow-x: auto;
    padding-bottom: 8px;
    scrollbar-width: none; /* Firefox */
}
.category-grid::-webkit-scrollbar {
    display: none; /* Chrome */
}

/* Filter chips. The selected one fills with a pale green wash and deep
   green text rather than a saturated block, so a row of them stays quiet. */
.category-card {
    flex: 0 0 auto;
    padding: 11px 24px;
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-full);
    color: var(--color-text-main);
    font-size: 0.95rem;
    font-weight: 600;
    transition: var(--transition-fast);
}

.category-card:hover {
    background: var(--color-surface-hover);
    border-color: #cdd2e8;
}

.category-card.active {
    background: var(--color-green-soft);
    border-color: rgba(5, 70, 54, 0.35);
    color: var(--color-green-deep);
}

/* --- Products --- */
.products-section {
    margin-bottom: 100px;
}

.section-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 32px;
    flex-wrap: wrap;
    gap: 16px;
}

.section-subtitle {
    margin-top: 4px;
    color: var(--color-text-muted);
    font-size: 1rem;
}

.section-header-controls {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
}

.proximity-status {
    margin-top: -16px;
    margin-bottom: 24px;
    color: var(--color-success);
    font-size: 0.9rem;
    font-weight: 600;
}

.sort-dropdown select {
    background: var(--color-surface);
    color: var(--color-text-main);
    border: 1px solid var(--color-border);
    padding: 11px 18px;
    border-radius: var(--radius-md);
    font-family: var(--font-main);
    font-weight: 500;
    cursor: pointer;
    outline: none;
    transition: var(--transition-fast);
}

.sort-dropdown select:hover {
    border-color: #cdd2e8;
}

.product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 32px;
}

.product-card {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-lg);
    overflow: hidden;
    transition: var(--transition-smooth);
    display: flex;
    flex-direction: column;
    box-shadow: var(--shadow-card);
}

.product-card:hover {
    transform: translateY(-6px);
    box-shadow: var(--shadow-md);
    border-color: rgba(109, 40, 217, 0.35);
}

/* The photo sits on a recessed tinted panel rather than being cropped edge
   to edge, so devices of different shapes all sit consistently. */
.product-image-wrap {
    background: var(--color-sunken);
    padding: 28px 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 210px;
}

.product-image {
    width: 100%;
    max-height: 170px;
    object-fit: contain;
}

.product-details {
    padding: 20px 22px 22px;
    display: flex;
    flex-direction: column;
    flex-grow: 1;
}

.product-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
}
.product-condition {
    background: var(--color-violet-soft);
    color: var(--color-violet);
    padding: 4px 10px;
    border-radius: var(--radius-sm);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    font-weight: 700;
    white-space: nowrap;
}
.product-location {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    color: var(--color-text-muted);
    font-size: 0.8rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.product-distance {
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--color-success);
    margin-bottom: 8px;
}

.product-title {
    font-size: 1.15rem;
    line-height: 1.3;
    margin-bottom: 6px;
}

.product-spec {
    font-size: 0.875rem;
    color: var(--color-text-muted);
    margin-bottom: 18px;
}

.product-footer {
    margin-top: auto;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
}

.price-container {
    display: flex;
    flex-direction: column;
}

.original-price {
    font-size: 0.875rem;
    color: var(--color-text-muted);
    text-decoration: line-through;
}

.current-price {
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--color-green-deep);
}

.add-btn {
    width: 38px;
    height: 38px;
    background: var(--color-surface-hover);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-full);
    color: var(--color-text-main);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: var(--transition-fast);
}

.product-card:hover .add-btn {
    background: var(--color-violet);
    border-color: var(--color-violet);
    color: #ffffff;
}

.no-results {
    text-align: center;
    padding: 64px 0;
    color: var(--color-text-muted);
    font-size: 1.25rem;
}

.hidden {
    display: none !important;
}

/* --- Footer --- */
.footer {
    border-top: 1px solid var(--color-border);
    background: var(--color-surface);
    padding: 48px 24px;
    text-align: center;
}

.footer-content {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
}

.footer .logo {
    font-size: 1.25rem;
}

.footer p {
    color: var(--color-text-muted);
}

/* --- Product Page --- */
/* --nav-h is published by auth.js from the navbar's measured height; the
   fallback covers the moment before the first measurement lands. */
.product-page-container {
    padding-top: calc(var(--nav-h, 70px) + 28px);
    padding-bottom: 60px;
}
.product-layout {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 32px;
}
/* Grid items default to min-width:auto, so a non-wrapping child (the
   thumbnail strip, a table) pushes the track wider than the viewport and
   the whole page scrolls sideways on a phone. */
.product-layout > * {
    min-width: 0;
}
.product-image-large {
    position: relative;
    background: var(--color-sunken);
    border-radius: var(--radius-lg);
    overflow: hidden;
    margin-bottom: 16px;
    border: 1px solid var(--color-border);
    padding: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
}
.product-image-large img {
    width: 100%;
    height: auto;
    max-height: 420px;
    object-fit: contain;
    display: block;
}
.verified-badge {
    position: absolute;
    top: 16px;
    left: 16px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--color-green-soft);
    color: var(--color-green-deep);
    padding: 7px 14px;
    border-radius: var(--radius-full);
    font-size: 0.78rem;
    font-weight: 700;
}
.product-thumbnails {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 24px;
}
.product-thumbnail {
    width: 80px;
    height: 80px;
    padding: 0;
    border-radius: var(--radius-md);
    overflow: hidden;
    border: 2px solid var(--color-border);
    background: var(--color-surface);
    cursor: pointer;
    transition: var(--transition-fast);
}
.product-thumbnail img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}
.product-thumbnail img {
    object-fit: contain;
    padding: 6px;
    background: var(--color-sunken);
}
.product-thumbnail:hover {
    border-color: rgba(5, 70, 54, 0.4);
}
.product-thumbnail.active {
    border-color: var(--color-green-deep);
}
.product-info-card {
    background: var(--color-surface);
    padding: 32px;
    border-radius: var(--radius-lg);
    border: 1px solid var(--color-border);
    box-shadow: var(--shadow-card);
}
.product-eyebrow {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 10px;
    color: var(--color-text-muted);
    font-size: 0.9rem;
}
.product-meta.large {
    font-size: 1rem;
    margin-top: 14px;
    margin-bottom: 22px;
    justify-content: flex-start;
    align-items: center;
    gap: 14px;
}
.product-meta.large .product-spec {
    margin-bottom: 0;
}
.large-price {
    flex-direction: row;
    align-items: baseline;
    gap: 14px;
    flex-wrap: wrap;
}
.large-price .current-price {
    font-size: 2.5rem;
}
.price-compare {
    display: inline-flex;
    align-items: center;
    gap: 10px;
}
.save-chip {
    background: var(--color-green-soft);

/* --- Landing Split (home route) ----------------------------------------
   The landing is a partition: a plain white panel carrying the sign-in
   choice, and a violet panel alongside it where line-art laptops and phones
   drift across the frame. The two device types travel in diagonally opposite
   directions — laptops south-east, phones north-west — so the field reads as
   two streams passing through each other rather than one sheet sliding.
   renderHomeRoute injects the left panel's copy and fills the right panel. ------ */
.landing-split {
    display: flex;
    min-height: 100vh;
    padding-top: var(--nav-h, 96px);
}
.landing-left {
    flex: 1 1 58%;
    /* Without this a long headline sets the flex base and pushes the violet
       panel off the side rather than wrapping. */
    min-width: 0;
    background: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 60px 40px;
    text-align: center;
}
/* The hero type was sized for a full-width page; in a 58% column it has to
   come down or it breaks mid-word. */
.landing-left .hero-title {
    font-size: clamp(2rem, 4.4vw, 3.4rem);
}
.landing-left .hero-subtitle {
    font-size: 1.05rem;
}
.landing-tagline {
    color: var(--color-text-muted);
    font-size: 0.85rem;
    letter-spacing: 3px;
    text-transform: uppercase;
}
.landing-right {
    position: relative;
    flex: 1 1 42%;
    min-width: 0;
    overflow: hidden;
    background: linear-gradient(160deg, #5b21b6 0%, #3b0764 100%);
}

/* Drift field. Each icon runs a straight diagonal line and loops; --dx/--dy
   are the half-travel in px, published by the home route on the panel from its
   measured size and inherited by every drifter, so one write rescales the
   whole field on resize. They are px rather than percentages because a
   percentage translate resolves against the icon's own box, not the panel's.
   Only transform and opacity animate, so each drifter stays on the
   compositor — and each layer is icon-sized, not panel-sized. */
.landing-right {
    --dx: 160px;
    --dy: 260px;
}
.drift {
    position: absolute;
    left: var(--drift-x, 50%);
    top: var(--drift-y, 50%);
    color: #ffffff;
    pointer-events: none;
    opacity: 0;
    will-change: transform, opacity;
    animation:
        driftSouthEast var(--drift-dur, 26s) linear infinite,
        driftFade var(--drift-dur, 26s) linear infinite;
    animation-delay: var(--drift-delay, 0s);
}
/* Phones run the opposite diagonal. */
.drift.drift-up {
    animation-name: driftNorthWest, driftFade;
}
.drift svg {
    display: block;
}
@keyframes driftSouthEast {
    from { transform: translate3d(calc(var(--dx) * -1), calc(var(--dy) * -1), 0); }
    to { transform: translate3d(var(--dx), var(--dy), 0); }
}
@keyframes driftNorthWest {
    from { transform: translate3d(var(--dx), var(--dy), 0); }
    to { transform: translate3d(calc(var(--dx) * -1), calc(var(--dy) * -1), 0); }
}
/* Fades at both ends of the run, so a drifter never pops in or out mid-panel
   and the loop point is invisible. */
@keyframes driftFade {
    0%, 100% { opacity: 0; }
    18%, 82% { opacity: 0.55; }
}
@media (prefers-reduced-motion: reduce) {
    .drift {
        animation: none;
        opacity: 0.45;
    }
}

@media (max-width: 900px) {
    /* Stacked: the violet panel becomes a band under the sign-in choice. */
    .landing-split {
        flex-direction: column;
        min-height: 0;
    }
    .landing-left {
        padding: 48px 24px;
    }
    .landing-right {
        flex: 0 0 auto;
        min-height: 240px;
    }
}
@media (max-width: 480px) {
    .landing-left {
        padding: 36px 18px;
        gap: 20px;
    }
    .landing-right {
        min-height: 180px;
    }
}

    let seed = 20260814;
    function seededRandom() {
        seed |= 0; seed = (seed + 0x6D2B79F5) | 0;

        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;

            [arr[i], arr[j]] = [arr[j], arr[i]];

    function formatDuration(months) {
        const m = Math.max(0, Math.round(months));
        if (m <= 11) return `${m} Month${m === 1 ? '' : 's'}`;
        const years = Math.floor(m / 12);
        const rem = m % 12;
        let label = `${years} Year${years === 1 ? '' : 's'}`;
        if (rem > 0) label += ` ${rem} Month${rem === 1 ? '' : 's'}`;
        return label;
    }

    // Condition grade shown on product cards and the product page. Derived
    // from age alone — there's no inspection data behind it, it's just a
    // friendlier reading than a raw month count.
    function conditionGrade(months) {
        const m = Math.max(0, Math.round(months));
        if (m <= 6) return 'Like New';
        if (m <= 14) return 'Excellent';
        if (m <= 26) return 'Good';
        return 'Fair';

    function hashText(str) {
        let h = 2166136261;
        for (let i = 0; i < str.length; i++) {
            h ^= str.charCodeAt(i);
            h = Math.imul(h, 16777619);
        }
        return Math.abs(h >>> 0);
    }

    function pickDeterministic(text, options) {
        if (!options || options.length === 0) return '';
        return options[hashText(text) % options.length];

    function formatRelativeTime(timestamp) {
        const mins = Math.floor((Date.now() - timestamp) / 60000);
        if (mins < 1) return 'just now';
        if (mins < 60) return `${mins} minute${mins === 1 ? '' : 's'} ago`;
        const hours = Math.floor(mins / 60);
        if (hours < 24) return `${hours} hour${hours === 1 ? '' : 's'} ago`;
        const days = Math.floor(hours / 24);
        return `${days} day${days === 1 ? '' : 's'} ago`;
    }

    function isUsableToken(t) {
        if (/^[0-9]+$/.test(t)) return t.length >= 3;

    function matchOptionFromText(text, options) {
        const lower = (text || '').toLowerCase();
        if (!lower) return null;
        const tokenSets = options.map(opt => new Set((opt.toLowerCase().match(/[a-z0-9]+/g) || []).filter(isUsableToken)));
        const tokenCounts = {};
        tokenSets.forEach(set => set.forEach(t => { tokenCounts[t] = (tokenCounts[t] || 0) + 1; }));
        for (let i = 0; i < options.length; i++) {
            const uniqueTokens = Array.from(tokenSets[i]).filter(t => tokenCounts[t] === 1);
            if (uniqueTokens.some(t => lower.includes(t))) return options[i];
        }
        return null;
    }

    const emiFinanciers = [
        { name: 'Bajaj Finserv', rate: 4 },

        { name: 'ZestMoney', rate: 7 },

    ];
    const emiTenures = [6, 12, 24];

    function calculateEMI(principal, annualRatePercent, months) {
        const r = annualRatePercent / 12 / 100;
        const emi = principal * r * Math.pow(1 + r, months) / (Math.pow(1 + r, months) - 1);
        return Math.round(emi);

    function coordsForLocation(location) {
        const city = location.split(',')[0].trim();

    function haversineKm(lat1, lng1, lat2, lng2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLng = (lng2 - lng1) * Math.PI / 180;
        const a = Math.sin(dLat / 2) ** 2 +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLng / 2) ** 2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    // ===================================================================
    let getProductImages, getProductThumbnail;
    (function () {
        function mulberry32(seed) {
            let a = seed >>> 0;
            return function () {
                a |= 0; a = (a + 0x6D2B79F5) | 0;
                let t = Math.imul(a ^ (a >>> 15), 1 | a);
                t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
        }

        function hashSeed(str) {
            let h = 2166136261;
            for (let i = 0; i < str.length; i++) {
                h ^= str.charCodeAt(i);
                h = Math.imul(h, 16777619);
            }
            return h >>> 0;
        }

        function angleOffset(angle) {
            const map = { open: 1, closed: 2, keyboard: 3, front: 11, back: 12, held: 13 };
            return (map[angle] || 0) * 7919;
        }

        function luminance(hex) {
            const n = parseInt(hex.slice(1), 16);
            const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
            return (0.299 * r + 0.587 * g + 0.114 * b) / 255;
        }

        function wordmarkColor(bodyHex) {
            return luminance(bodyHex) > 0.55 ? 'rgba(15,23,42,0.45)' : 'rgba(255,255,255,0.55)';
        }

        function svgToDataUri(svg) {
            return 'data:image/svg+xml,' + encodeURIComponent(svg);
        }

        function wrapSvg(w, h, inner) {
            return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">${inner}</svg>`;
        }

        function scratches(rand, count, w, h) {
            let s = '';
            for (let i = 0; i < count; i++) {
                const x1 = rand() * w, y1 = rand() * h;
                const len = 20 + rand() * 60;
                const ang = rand() * Math.PI;
                const x2 = x1 + Math.cos(ang) * len, y2 = y1 + Math.sin(ang) * len;
                s += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="white" stroke-opacity="${(0.05 + rand() * 0.1).toFixed(2)}" stroke-width="${(1 + rand()).toFixed(1)}" stroke-linecap="round"/>`;
            }
            return s;
        }

        function screenContent(rand, x, y, w, h, palette, rId) {
            let icons = '';
            const cols = 4, rows = 2;
            const pad = w * 0.08;
            const cellW = (w - pad * 2) / cols;
            const cellH = (h * 0.42) / rows;
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (rand() > 0.25) {
                        const ix = x + pad + c * cellW + cellW * 0.2;
                        const iy = y + h * 0.5 + r * cellH + cellH * 0.15;
                        const size = Math.min(cellW, cellH) * 0.55;
                        icons += `<rect x="${ix.toFixed(1)}" y="${iy.toFixed(1)}" width="${size.toFixed(1)}" height="${size.toFixed(1)}" rx="${(size * 0.28).toFixed(1)}" fill="rgba(255,255,255,${(0.5 + rand() * 0.4).toFixed(2)})"/>`;
                    }
                }
            }
            return `
                <defs><linearGradient id="scr${rId}" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="${palette.screenA}"/>
                    <stop offset="1" stop-color="${palette.screenB}"/>
                </linearGradient></defs>
                <rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#scr${rId})"/>
                <rect x="${x}" y="${y}" width="${w}" height="${(h * 0.12).toFixed(1)}" fill="rgba(0,0,0,0.15)"/>
                ${icons}
            `;
        }

        function keyboardGrid(rand, x, y, w, h) {
            let out = '';
            const cols = 12, rows = 4;
            const gap = 4;
            const cw = (w - gap * (cols - 1)) / cols;
            const ch = (h - gap * (rows - 1)) / rows;
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const kx = x + c * (cw + gap);
                    const ky = y + r * (ch + gap);
                    out += `<rect x="${kx.toFixed(1)}" y="${ky.toFixed(1)}" width="${cw.toFixed(1)}" height="${ch.toFixed(1)}" rx="3" fill="#000" opacity="${(0.35 + rand() * 0.15).toFixed(2)}"/>`;
                }
            }
            return out;
        }

        function laptopSVG(seed, palette, angle, brand) {
            const rand = mulberry32(seed + angleOffset(angle));
            const W = 480, H = 480;
            const deskTone = `hsl(${Math.floor(rand() * 360)},12%,${88 + rand() * 6}%)`;
            let body;

            if (angle === 'open') {
                const baseY = 300, baseH = 60, baseW = 340, baseX = (W - baseW) / 2;
                const screenW = 320, screenH = 200, screenX = (W - screenW) / 2, screenY = baseY - screenH + 14;

                    <rect x="${screenX + 8}" y="${screenY + 8}" width="${screenW - 16}" height="${screenH - 16}" rx="4" fill="#000"/>
                    ${screenContent(rand, screenX + 8, screenY + 8, screenW - 16, screenH - 16, palette, 1)}
                    <rect x="${baseX}" y="${baseY}" width="${baseW}" height="${baseH}" rx="8" fill="${palette.body}"/>
                    <rect x="${baseX + baseW / 2 - 45}" y="${baseY + 10}" width="90" height="34" rx="6" fill="${palette.dark}" opacity="0.5"/>
                    ${scratches(rand, 5, W, H)}
                `;
            } else if (angle === 'closed') {
                const lidW = 300, lidH = 210, lidX = (W - lidW) / 2, lidY = (H - lidH) / 2;
                body = `
                    <rect x="0" y="0" width="${W}" height="${H}" fill="${deskTone}"/>

                    <rect x="${lidX}" y="${lidY}" width="${lidW}" height="${lidH}" rx="14" fill="white" opacity="0.06"/>
                    <text x="${W / 2}" y="${lidY + lidH / 2}" font-family="Arial, sans-serif" font-size="20" fill="${wordmarkColor(palette.body)}" text-anchor="middle">${brand}</text>

            } else {
                body = `
                    <rect x="0" y="0" width="${W}" height="${H}" fill="${deskTone}"/>
                    <rect x="20" y="40" width="440" height="300" rx="16" fill="${palette.body}"/>
                    ${keyboardGrid(rand, 50, 70, 380, 160)}
                    <rect x="${W / 2 - 70}" y="260" width="140" height="90" rx="14" fill="${palette.dark}" opacity="0.35"/>
                    <circle cx="130" cy="415" r="30" fill="#fff" opacity="0.7"/>
                    <rect x="115" y="405" width="30" height="42" rx="4" fill="#8b5e34" opacity="0.6"/>
                    ${scratches(rand, 8, W, H)}
                `;
            }
            return wrapSvg(W, H, body);
        }

        function heldPhoneSVG(rand, palette) {
            const W = 480, H = 480;
            const bgHue = Math.floor(rand() * 360);
            let bokeh = '';
            for (let i = 0; i < 6; i++) {
                const cx = rand() * W, cy = rand() * H * 0.6, r = 40 + rand() * 70;
                bokeh += `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${r.toFixed(1)}" fill="hsl(${(bgHue + rand() * 60).toFixed(0)},60%,${(55 + rand() * 20).toFixed(0)}%)" opacity="${(0.15 + rand() * 0.15).toFixed(2)}"/>`;
            }
            const pw = 150, ph = 300;
            const cx = W / 2 - 10, cy = H / 2 + 6;
            const rot = (-8 + rand() * 16).toFixed(1);

                <rect x="0" y="0" width="${W}" height="${H}" fill="hsl(${bgHue},25%,80%)"/>

                    <path d="M ${-pw / 2 + 14} ${ph / 2 - 74} q -42 -8 -52 32 q -8 30 32 44 q 60 14 88 -18 z" fill="${skin}"/>

        function mobileSVG(seed, palette, angle, brand) {
            const rand = mulberry32(seed + angleOffset(angle));

            let body;

            if (angle === 'front') {
                const pw = 200, ph = 400, px = (W - pw) / 2, py = (H - ph) / 2;

                    <rect x="0" y="0" width="${W}" height="${H}" fill="hsl(${Math.floor(rand() * 360)},10%,90%)"/>
                    <ellipse cx="${W / 2}" cy="${py + ph + 14}" rx="110" ry="14" fill="black" opacity="0.12"/>
                    <rect x="${px - 8}" y="${py - 8}" width="${pw + 16}" height="${ph + 16}" rx="34" fill="${palette.body}"/>

            } else if (angle === 'back') {
                const pw = 200, ph = 400, px = (W - pw) / 2, py = (H - ph) / 2;
                body = `
                    <rect x="0" y="0" width="${W}" height="${H}" fill="hsl(${Math.floor(rand() * 360)},10%,90%)"/>
                    <ellipse cx="${W / 2}" cy="${py + ph + 14}" rx="110" ry="14" fill="black" opacity="0.12"/>
                    <rect x="${px - 8}" y="${py - 8}" width="${pw + 16}" height="${ph + 16}" rx="34" fill="${palette.body}"/>
                    <rect x="${px - 8}" y="${py - 8}" width="${pw + 16}" height="${ph + 16}" rx="34" fill="white" opacity="0.05"/>
                    <rect x="${px + 18}" y="${py + 24}" width="60" height="60" rx="16" fill="${palette.dark}" opacity="0.6"/>
                    <circle cx="${px + 38}" cy="${py + 44}" r="12" fill="#111"/>
                    <circle cx="${px + 66}" cy="${py + 44}" r="12" fill="#111"/>
                    <circle cx="${px + 38}" cy="${py + 70}" r="12" fill="#111"/>
                    <circle cx="${px + 52}" cy="${py + 34}" r="4" fill="#fbbf24"/>
                    <text x="${px + pw / 2}" y="${py + ph - 30}" font-family="Arial, sans-serif" font-size="13" fill="${wordmarkColor(palette.body)}" text-anchor="middle">${brand}</text>
                    ${scratches(rand, 5, W, H)}

            } else {
                body = heldPhoneSVG(rand, palette);

            return wrapSvg(W, H, body);
        }

        function paletteFor(product) {
            const table = product.category === 'Laptops' ? LAPTOP_PALETTES : MOBILE_PALETTES;
            return table[product.brand] || { body: '#333', dark: '#111', screenA: '#333', screenB: '#666' };
        }

        getProductImages = function (product) {
            if (product.userImage) {
                return [{ label: 'Seller photo', src: product.userImage }];
            }
            const seed = hashSeed(product.id + '|' + product.title);
            const palette = paletteFor(product);
            if (product.category === 'Laptops') {
                return [
                    { label: 'Open — front view', src: svgToDataUri(laptopSVG(seed, palette, 'open', product.brand)) },
                    { label: 'Closed lid', src: svgToDataUri(laptopSVG(seed, palette, 'closed', product.brand)) },
                    { label: 'Keyboard close-up', src: svgToDataUri(laptopSVG(seed, palette, 'keyboard', product.brand)) }
                ];
            }
            return [
                { label: 'Screen on', src: svgToDataUri(mobileSVG(seed, palette, 'front', product.brand)) },
                { label: 'Back panel', src: svgToDataUri(mobileSVG(seed, palette, 'back', product.brand)) },
                { label: 'Held in hand', src: svgToDataUri(mobileSVG(seed, palette, 'held', product.brand)) }
            ];
        };

        getProductThumbnail = function (product) {
            if (product.userImage) return product.userImage;
            const images = getProductImages(product);
            if (product.category === 'Mobiles' && product.id % 2 === 0) {
                return images[2].src;
            }
            return images[0].src;
        };
    })();

    // AUTOCOMPLETE (from autocomplete.js)
    // ===================================================================
    function attachAutocomplete(input, getSuggestions, onSelect) {
        const wrapper = document.createElement('div');
        wrapper.className = 'autocomplete-wrapper ' + input.className;
        input.parentNode.insertBefore(wrapper, input);
        wrapper.appendChild(input);
        input.className = 'autocomplete-input';
        input.setAttribute('autocomplete', 'off');

        const list = document.createElement('div');
        list.className = 'autocomplete-list hidden';
        wrapper.appendChild(list);

        function hide() { list.classList.add('hidden'); list.innerHTML = ''; }

        function render(items) {
            list.innerHTML = '';
            if (items.length === 0) { hide(); return; }
            items.slice(0, 6).forEach(item => {
                const opt = document.createElement('div');
                opt.className = 'autocomplete-item';
                opt.textContent = item;
                opt.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    input.value = item;
                    hide();
                    onSelect(item);
                });
                list.appendChild(opt);
            });
            list.classList.remove('hidden');
        }

        input.addEventListener('input', () => {
            const q = input.value.trim().toLowerCase();
            if (!q) { hide(); return; }
            render(getSuggestions(q));
        });
        input.addEventListener('focus', () => {
            const q = input.value.trim().toLowerCase();
            if (q) render(getSuggestions(q));
        });
        input.addEventListener('blur', () => setTimeout(hide, 120));
    }

    function locationSuggestions(query) {
        return cities.filter(c => c.toLowerCase().includes(query));
    }

    function productSuggestions(query) {
        const brands = products.map(p => p.brand);
        const titles = products.map(p => p.title);
        const pool = Array.from(new Set([...brands, ...titles]));
        return pool
            .filter(t => t.toLowerCase().includes(query))
            .sort((a, b) => a.length - b.length);
    }

    function getSupportReply(message) {
        const m = message.toLowerCase();
        const rules = [
            { keys: ['refund', 'return', 'money back'], reply: "Refunds are available within 7 days of delivery if the device doesn't match the listed condition — open a dispute from your Orders page and our team steps in." },
            { keys: ['deliver', 'shipping', 'ship', 'when will i get', 'arrive'], reply: "Most orders are delivered within 3-5 business days. You'll get a tracking link by SMS and email once the seller ships it." },
            { keys: ['payment', 'cod', 'cash on delivery', 'upi', 'pay', 'emi'], reply: "We support UPI, cards, and Cash on Delivery for orders under ₹50,000. Payment is only released to the seller after you confirm the device works." },
            { keys: ['warranty', 'guarantee'], reply: "Every listing marked 'Verified Refurbished' comes with a 6-month Bazaarin warranty covering hardware defects." },
            { keys: ['seller', 'trust', 'genuine', 'fake', 'scam', 'verified'], reply: "All sellers are ID-verified and rated by past buyers — check the seller card on this page for their sale history before you buy." },
            { keys: ['negotiate', 'price', 'discount', 'lower', 'cheap'], reply: "You're welcome to negotiate directly with the seller in the 'Chat with Seller' tab — most sellers do accept reasonable offers." },
            { keys: ['cancel'], reply: "You can cancel an order for free before it ships, from the Orders page. After that it falls under our return policy." },
            { keys: ['damage', 'broken', 'not working', 'defect'], reply: "Sorry to hear that. If a device arrives damaged or not as described, open a dispute within 48 hours of delivery and we'll arrange a replacement or refund." },
            { keys: ['not replying', "hasn't replied", 'no reply', 'no response', 'ignoring'], reply: "Sorry about the wait — if a seller goes quiet for more than a day, we can step in directly. Share the product name and we'll follow up with them on your behalf." },
            { keys: ['listing', 'my product', 'my item', 'edit my'], reply: "You can manage your listings and see buyer messages from your Seller Dashboard — the link's in the menu once you're signed in as a seller." },
            { keys: ['hi', 'hello', 'hey'], reply: "Hi there! I'm the Bazaarin Support assistant. Ask me about returns, payments, delivery, or seller verification." },
            { keys: ['human', 'agent', 'person', 'talk to someone'], reply: "I can loop in a human teammate — drop your email or phone number and someone from our team will reach out within a few hours." }
        ];
        const hit = rules.find(rule => rule.keys.some(k => m.includes(k)));
        if (hit) return hit.reply;
        return "Thanks for reaching out! I've noted your message — for anything I can't answer here, our human support team will follow up by email shortly.";

    function saveQueries(list) {
        localStorage.setItem(QUERIES_KEY, JSON.stringify(list));
    }

    function recordBuyerMessage(product, buyerName, message) {
        const list = getQueries();
        list.push({
            id: Date.now() + '-' + Math.random().toString(36).slice(2, 8),
            productId: product.id,
            productTitle: product.title,
            sellerName: product.sellerName,
            buyerName: buyerName || 'A buyer (not signed in)',
            message,
            timestamp: Date.now(),
            answered: false
        });
        saveQueries(list);
    }

    function markQueryReplied(queryId) {
        const list = getQueries();
        const q = list.find(q => q.id === queryId);
        if (q) {
            q.answered = true;
            saveQueries(list);
        }
    }

    function queriesForSeller(sellerName) {
        return getQueries()
            .filter(q => q.sellerName === sellerName)
            .sort((a, b) => b.timestamp - a.timestamp);
    }

    function hasStaleUnansweredQuery(productId, hoursThreshold) {
        const pending = getQueries().filter(q => q.productId === productId && !q.answered);
        if (pending.length === 0) return false;
        const oldest = Math.min(...pending.map(q => q.timestamp));
        return (Date.now() - oldest) / (1000 * 60 * 60) >= hoursThreshold;
    }

        const ids = getCompareIds();

    // ===================================================================
    // PAGE: home (from index.html + home.js)
    // ===================================================================
    // The home route is the login gate, laid out as a split: a white panel
    // carrying the sign-in choice, and a violet panel where line-art laptops
    // and phones drift across the frame. The two device types run diagonally
    // opposite paths — laptops south-east, phones north-west — so the field
    // reads as two streams passing through each other. Each drifter is one
    // element running two composited animations (transform + opacity); the
    // keyframes translate by +/- --dx/--dy, published on the panel below.
    const DRIFT_PER_TYPE = 11;
    const DRIFT_LAPTOP = `<svg width="42" height="31" viewBox="0 0 24 18" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="1" width="20" height="12" rx="1.5"/><path d="M1 16h22l-1.6 2.4a1 1 0 0 1-.9.6H3.5a1 1 0 0 1-.9-.6L1 16z"/></svg>`;
    const DRIFT_MOBILE = `<svg width="23" height="34" viewBox="0 0 16 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="1" width="12" height="22" rx="2.5"/><line x1="6.5" y1="19.5" x2="9.5" y2="19.5"/></svg>`;

    function driftHtml() {
        let html = '';
        for (let i = 0; i < DRIFT_PER_TYPE * 2; i++) {
            const laptop = i % 2 === 0;
            const n = i >> 1;
            // A golden-ratio walk spreads the icons over the panel without
            // the clumps a random scatter leaves and without landing on a
            // grid.
            const x = 6 + ((n * 0.6180339887 + (laptop ? 0.13 : 0.61)) % 1) * 78;
            const y = 6 + ((n * 0.7548776662 + (laptop ? 0.37 : 0.05)) % 1) * 78;
            const dur = 24 + (n % 5) * 4;
            // Delays spread across a full cycle, so the panel is never empty
            // and the end-of-run fades never pulse in unison.
            const delay = -(dur * n) / DRIFT_PER_TYPE - (laptop ? 0 : dur / 7);
            html += `<span class="drift${laptop ? '' : ' drift-up'}" style="` +
                `--drift-x:${x.toFixed(1)}%;--drift-y:${y.toFixed(1)}%;` +
                `--drift-dur:${dur}s;--drift-delay:${delay.toFixed(2)}s">` +
                `${laptop ? DRIFT_LAPTOP : DRIFT_MOBILE}</span>`;
        }
        return html;
    }

    // Travel is half the sweep in each axis. It lives on the panel rather
    // than on each drifter so one write rescales the whole field, and it has
    // to be in px: a percentage translate resolves against the icon's own
    // box, not the panel's.
    function sizeDrift() {
        const panel = document.getElementById('driftPanel');
        if (!panel || !panel.isConnected) return;
        const rect = panel.getBoundingClientRect();
        panel.style.setProperty('--dx', Math.round(rect.width * 0.34) + 'px');
        panel.style.setProperty('--dy', Math.round(rect.height * 0.42) + 'px');
    }

    // The panel is torn down and rebuilt on every navigation, so watch the
    // window rather than hold a ResizeObserver on an element that keeps being
    // replaced. sizeDrift no-ops when the home route isn't mounted.
    let driftResizeTimer = null;
    window.addEventListener('resize', () => {
        clearTimeout(driftResizeTimer);
        driftResizeTimer = setTimeout(sizeDrift, 150);
    });

            if (!originCoords) return null;

                            <div class="product-footer">
                                <div class="price-container"><span class="current-price">₹${product.price.toLocaleString('en-IN')}</span></div>
                                <span class="add-btn" aria-hidden="true">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                                </span>
                            </div>
                        </div>
                    `;
                    productGrid.appendChild(card);
                });
            }
        }

        searchInput.value = currentSearch;
        locationInput.value = currentLocation;
        categoryButtons.forEach(btn => btn.classList.toggle('active', btn.dataset.category === currentCategory));

        attachAutocomplete(searchInput, productSuggestions, (value) => { currentSearch = value; renderProducts(); });
        attachAutocomplete(locationInput, locationSuggestions, (value) => {
            currentLocation = value;
            const coords = coordsForLocation(value);
            if (coords) setOrigin(coords, value);
            renderProducts();
        });

        searchInput.addEventListener('input', (e) => { currentSearch = e.target.value; renderProducts(); });
        locationInput.addEventListener('input', (e) => { currentLocation = e.target.value; renderProducts(); });

        categoryButtons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                categoryButtons.forEach(b => b.classList.remove('active'));
                const target = e.currentTarget;
                target.classList.add('active');
                currentCategory = target.dataset.category;
                renderProducts();
            });
        });

        sortSelect.addEventListener('change', (e) => {
            currentSort = e.target.value;
            if (currentSort === 'nearest' && !originCoords) {
                proximityStatus.textContent = '📍 Pick "Use My Location" or type a city in Location to sort by proximity.';
                proximityStatus.classList.remove('hidden');
            }
            renderProducts();
        });

        nearMeBtn.addEventListener('click', () => {
            if (!navigator.geolocation) {
                proximityStatus.textContent = "Geolocation isn't supported by this browser — try picking a city in Location instead.";
                proximityStatus.classList.remove('hidden');
                return;
            }
            nearMeBtn.textContent = '📍 Locating…';
            nearMeBtn.disabled = true;
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    setOrigin({ lat: pos.coords.latitude, lng: pos.coords.longitude }, 'your current location');
                    currentSort = 'nearest';
                    sortSelect.value = 'nearest';
                    nearMeBtn.textContent = '📍 Use My Location';
                    nearMeBtn.disabled = false;
                    renderProducts();
                },
                () => {
                    proximityStatus.textContent = "Couldn't access your location — pick a city in Location to sort by proximity instead.";
                    proximityStatus.classList.remove('hidden');
                    nearMeBtn.textContent = '📍 Use My Location';
                    nearMeBtn.disabled = false;
                },
                { timeout: 8000 }
            );
        });

        renderProducts();
    }

        const sellerEscalation = document.getElementById('sellerEscalation');
        const escalateBtn = document.getElementById('escalateBtn');

        const sellerGreeting = { role: 'received', text: `Hi! I'm ${product.sellerName}. Feel free to ask me anything about the ${product.title}.` };
        const supportGreeting = { role: 'received support-msg', text: 'Hello! Bazaarin Support here. How can we help you with this transaction?' };
        let sellerThread = [sellerGreeting];
        let supportThread = [supportGreeting];
        let activeTab = 'seller';

        function renderChat() {
            const thread = activeTab === 'seller' ? sellerThread : supportThread;
            chatBody.innerHTML = thread.map(m => `<div class="chat-message ${m.role}">${m.text}</div>`).join('');
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        function updateEscalation() {
            if (activeTab === 'seller' && hasStaleUnansweredQuery(product.id, 24)) {
                sellerEscalation.classList.remove('hidden');
            } else {
                sellerEscalation.classList.add('hidden');
            }

        updateEscalation();

            activeTab = 'seller';
            tabSeller.classList.add('active');
            tabSupport.classList.remove('active');
            chatInput.value = '';
            renderChat();
            updateEscalation();
        });

        tabSupport.addEventListener('click', () => {
            activeTab = 'support';
            tabSupport.classList.add('active');
            tabSeller.classList.remove('active');
            chatInput.value = '';
            renderChat();
            updateEscalation();
        });

        escalateBtn.addEventListener('click', () => {
            tabSupport.click();
            chatInput.value = `I haven't heard back from the seller about the ${product.title} in over a day — can you help?`;
            chatInput.focus();
        });

        function sendMessage(text, options) {
            options = options || {};
            if (!text.trim()) return;
            const isSupport = activeTab === 'support';
            const thread = isSupport ? supportThread : sellerThread;
            thread.push({ role: 'sent', text });
            renderChat();

            if (!isSupport) {
                const buyer = getCurrentUser() ? getCurrentUser().name : null;
                recordBuyerMessage(product, buyer, text);
            }

            if (options.skipAutoReply) return;

            setTimeout(() => {
                const replyText = isSupport
                    ? getSupportReply(text)
                    : "Thanks for reaching out! We'll get back to you shortly.";
                thread.push({ role: isSupport ? 'received support-msg' : 'received', text: replyText });
                renderChat();
                updateEscalation();
            }, 1000);
        }

        sendBtn.addEventListener('click', () => {
            const text = chatInput.value;
            chatInput.value = '';
            sendMessage(text);
        });
        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const text = chatInput.value;
                chatInput.value = '';
                sendMessage(text);
            }
        });

        offerForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const min = parseInt(document.getElementById('offerMin').value) || 0;
            const max = parseInt(document.getElementById('offerMax').value) || 0;
            if (min <= 0 || max <= 0 || max < min) {
                alert('Enter a valid price range (max should be at least your min).');
                return;
            }

            offerForm.classList.add('hidden');
            buyBtn.textContent = '✅ Offer Sent';
            buyConfirmation.textContent = `Your offer of ₹${min}–₹${max} was sent to ${product.sellerName} — check "Chat with Seller" for their response. (This is a demo — no real order or payment is processed.)`;
            buyConfirmation.classList.remove('hidden');

            tabSeller.click();
            sendMessage(`Hi, I'd like to buy this — my budget is ₹${min} to ₹${max}. Could we settle on a price in that range?`, { skipAutoReply: true });

            const chosen = Math.max(min, Math.min(max, Math.round((min + (max - min) * 0.65) / 500) * 500));
            setTimeout(() => {
                sellerThread.push({ role: 'received', text: `Thanks for the offer! I can do ₹${chosen} for this — let's go ahead at that price.` });
                renderChat();
            }, 1600);
        });
    }

            const size = 480;
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            const side = Math.min(sw, sh);
            ctx.drawImage(source, (sw - side) / 2, (sh - side) / 2, side, side, 0, 0, size, size);

                startCameraBtn.classList.add('hidden');
                captureBtn.classList.remove('hidden');
            } catch (err) {
                cameraError.textContent = "Couldn't access your camera — use \"Upload a File Instead\" below.";
                cameraError.classList.remove('hidden');
            }
        });

        captureBtn.addEventListener('click', () => {
            showCaptured(squareDataUrlFromSource(video, video.videoWidth, video.videoHeight));
        });

        retakeBtn.addEventListener('click', () => {
            capturedImageData = null;
            capturedPreview.classList.add('hidden');
            retakeBtn.classList.add('hidden');
            startCameraBtn.classList.remove('hidden');
            fileInput.value = '';
        });

        fileInput.addEventListener('change', () => {
            const file = fileInput.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => showCaptured(squareDataUrlFromSource(img, img.width, img.height));
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });

        document.getElementById('sellForm').addEventListener('submit', (e) => {
            e.preventDefault();

            if (!selectedCategory) { alert('Please choose Laptop or Mobile.'); return; }
            if (!brandSelect.value) { alert('Please choose a brand.'); return; }
            if (!capturedImageData) { alert('Please add a photo of your device.'); return; }

            const specs = Object.assign({}, autoSpecs, {
                RAM: ramSelect.value,
                Storage: storageSelect.value
            });

            const monthsUsed = parseInt(monthsInput.value) || 0;
            const price = parseInt(document.getElementById('sellPrice').value) || 0;
            const model = document.getElementById('sellModel').value.trim();

            const listing = {
                title: `${brandSelect.value} ${model}`,
                brand: brandSelect.value,
                category: selectedCategory,
                monthsUsed,
                location: locationSelect.value,
                price,
                originalPrice: price,
                specs,
                reasonForSelling: document.getElementById('sellReason').value.trim(),
                sellerName: getCurrentUser().name,
                sellerHistory: 0,
                userImage: capturedImageData
            };

            const existingBefore = JSON.parse(localStorage.getItem('bazaarin_user_listings') || '[]');
            const baseCatalogCount = products.length - existingBefore.length;
            existingBefore.push(listing);
            localStorage.setItem('bazaarin_user_listings', JSON.stringify(existingBefore));

            const newId = baseCatalogCount + existingBefore.length;
            // The in-memory catalog is only built once at page load in this
            // single-page app (unlike the old multi-page site, where every
            // navigation re-ran data.js) — push the new listing in directly so
            // it's there the instant we jump to its product page below.
            products.push(Object.assign({}, listing, { id: newId }));
            location.hash = `#/product?id=${newId}`;
        });
    }

                            <small>List items and manage your Seller Dashboard</small>
                        </span>
                    </a>
                    <a href="#/admin-login" class="portal-option staff">
                        <span class="portal-option-icon" aria-hidden="true">🔐</span>
                        <span class="portal-option-text">
                            <strong>Staff Login</strong>
                            <small>Tech Support, Finance, or Stats &amp; Analytics</small>
                        </span>
                    </a>
                </div>

                <p class="form-hint portal-note">This page is intentionally not linked from Bazaarin's public site. Real marketplaces (OLX included) don't put staff/admin sign-in on the customer-facing landing page either — it lives at a separate URL that only staff are given, so it never shows up for an ordinary visitor. Bookmark this page if you're on the Bazaarin team.</p>
            </div>
        `;
    }

    // ===================================================================
    // INIT
    // ===================================================================
    window.addEventListener('hashchange', navigate);
    document.addEventListener('DOMContentLoaded', () => {
        navigate();
        const nav = document.querySelector('.navbar');
        if (nav && window.ResizeObserver) {
            new ResizeObserver(syncNavHeight).observe(nav);
        } else {
            window.addEventListener('resize', syncNavHeight);
        }
        if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(syncNavHeight);
        }
    });
    </script>
</body>
