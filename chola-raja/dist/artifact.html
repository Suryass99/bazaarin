    for (var i = 0; i < w; i += 4) {
      ctx.beginPath();
      ctx.moveTo(x + i, y);
      ctx.lineTo(x + i + 2, y - hgt);
      ctx.lineTo(x + i + 4, y);
      ctx.closePath();
      ctx.fill();
    }
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    for (var j = 0; j < w; j += 4) ctx.fillRect(x + j + 1.6, y - hgt, 0.7, hgt);
  }

  function drawHeart(ctx, x, y, s, col) {
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(x + s / 2, y + s);
    ctx.bezierCurveTo(x - s * 0.35, y + s * 0.45, x + s * 0.12, y - s * 0.28, x + s / 2, y + s * 0.22);
    ctx.bezierCurveTo(x + s * 0.88, y - s * 0.28, x + s * 1.35, y + s * 0.45, x + s / 2, y + s);
    ctx.fill();
  }
  World.drawHeart = drawHeart;

  CR.World = World;
})();
</script>
<script>/* ---- js/player.js ---- */
/* ============================================================
   player.js - Prince Rajaraja Chola himself.

   Everything the prince can do lives here: walking, running, jumping,
   crawling, running up walls, hanging off ledges, swinging on ropes,
   and swinging his blade.

   The movement is "physics driven": we never teleport him to a tile.
   We give him a speed, gravity pulls him down, and the world stops him
   when he bumps into something.
   ============================================================ */
(function () {

  // ---- the numbers that decide how the game feels ----
  var GRAVITY      = 640;     // pixels per second, per second
  var WALK_SPEED   = 62;
  var RUN_SPEED    = 112;
  var ACCEL_GROUND = 620;
  var ACCEL_AIR    = 340;
  var FRICTION     = 760;
  var JUMP_VEL     = -212;
  var MAX_FALL     = 340;
  var FATAL_FALL   = 322;     // land faster than this and it is over (about a 4-body drop)
  var COYOTE       = 0.10;    // grace period to still jump after leaving a ledge
  var JUMP_BUFFER  = 0.12;    // pressing jump slightly early still works

  var STAND_H = 28, CRAWL_H = 13, BODY_W = 12;

  var WEAPONS = {
    dagger: { reach: 13, dmg: 1, wind: 0.10, active: 0.13, recover: 0.16 },
    sword:  { reach: 21, dmg: 2, wind: 0.09, active: 0.15, recover: 0.14 }
  };

  function Player(x, y) {
    this.x = x; this.y = y;
    this.w = BODY_W; this.h = STAND_H;
    this.vx = 0; this.vy = 0;
    this.facing = 1;
    this.onGround = false;
    this.anim = 'idle';
    this.animT = 0;

    this.maxHearts = 4;
    this.hearts = 4;
    this.weapon = 'dagger';

    this.invuln = 0;
    this.hurtT = 0;
    this.dead = false;
    this.deadT = 0;

    this.coyote = 0;
    this.jumpBuf = 0;
    this.crawling = false;

    this.attackT = 0;         // counts up while a swing is happening
    this.attackDur = 0;
    this.attackHit = false;

    this.wallDir = 0;
    this.wallRunT = 0;
    this.wallRunUsed = false;

    this.hanging = false;
    this.hangY = 0;

    this.rope = null;
    this.ropeCooldown = 0;

    this.bark = null;         // little speech bubble above his head
    this.barkT = 0;
    this.stepT = 0;
    this.landVy = 0;
  }

  Player.prototype.say = function (text, secs) {
    this.bark = text;
    this.barkT = secs || 1.1;
  };

  Player.prototype.box = function () {
    return CR.rect(this.x, this.y, this.w, this.h);
  };

  Player.prototype.centerX = function () { return this.x + this.w / 2; };
  Player.prototype.centerY = function () { return this.y + this.h / 2; };

  /* ---------- the main per-frame update ---------- */
  Player.prototype.update = function (dt, game) {
    var In = CR.Input;
    var W = CR.World;

    this.animT += dt;
    if (this.barkT > 0) { this.barkT -= dt; if (this.barkT <= 0) this.bark = null; }
    if (this.invuln > 0) this.invuln -= dt;
    if (this.ropeCooldown > 0) this.ropeCooldown -= dt;

    if (this.dead) {
      this.deadT += dt;
      this.vy = Math.min(this.vy + GRAVITY * dt, MAX_FALL);
      W.moveBox(this, 0, this.vy * dt);
      this.anim = 'dead';
      return;
    }

    if (this.hurtT > 0) {
      // knocked back and unable to act for a moment
      this.hurtT -= dt;
      this.vy = Math.min(this.vy + GRAVITY * dt, MAX_FALL);
      var rh = W.moveBox(this, this.vx * dt, this.vy * dt);
      if (rh.hitX) this.vx = 0;
      if (rh.onGround) { this.vy = 0; this.onGround = true; this.vx *= 0.6; }
      this.anim = 'hurt';
      return;
    }

    /* ---------- rope swinging ---------- */
    if (this.rope) { this.updateRope(dt, game); return; }

    /* ---------- hanging from a ledge ---------- */
    if (this.hanging) {
      this.vx = 0; this.vy = 0;
      this.anim = 'hang';
      if (In.upPressed || In.jumpPressed) {
        // climb up onto the ledge
        this.hanging = false;
        this.y = this.hangY - this.h - 0.5;
        this.x += this.facing * 6;
        if (W.blocked(this.box())) { this.x -= this.facing * 6; this.y = this.hangY - this.h - 0.5; }
        this.vy = -40;
        this.onGround = false;
        CR.Audio.sfx.step();
      } else if (In.down) {
        this.hanging = false;
        this.vy = 20;
      }
      return;
    }

    /* ---------- decide how fast he wants to go ---------- */
    var wantDir = (In.right ? 1 : 0) - (In.left ? 1 : 0);
    var wantsRun = In.run;

    // crawling: hold down on the ground, or squeeze into a low gap
    var wantCrawl = In.down && this.onGround;
    if (this.crawling && !wantCrawl) {
      // only stand back up if there is room above
      var standBox = CR.rect(this.x, this.y + this.h - STAND_H, this.w, STAND_H);
      if (!W.blocked(standBox)) {
        this.y = this.y + this.h - STAND_H;
        this.h = STAND_H;
        this.crawling = false;
      }
    } else if (!this.crawling && wantCrawl) {
      this.y = this.y + this.h - CRAWL_H;
      this.h = CRAWL_H;
      this.crawling = true;
    }

    var topSpeed = this.crawling ? 34 : (wantsRun ? RUN_SPEED : WALK_SPEED);
    if (game.assist) topSpeed *= 1.0;   // difficulty assist never slows the player

    var accel = this.onGround ? ACCEL_GROUND : ACCEL_AIR;
    if (this.attackT > 0 && this.onGround) accel *= 0.25;   // planting your feet to swing

    if (wantDir !== 0) {
      this.vx = CR.approach(this.vx, wantDir * topSpeed, accel * dt);
      if (this.attackT <= 0) this.facing = wantDir;
    } else if (this.onGround) {
      this.vx = CR.approach(this.vx, 0, FRICTION * dt);
    } else {
      this.vx = CR.approach(this.vx, 0, 80 * dt);
    }

    /* ---------- jumping ---------- */
    if (In.jumpPressed) this.jumpBuf = JUMP_BUFFER;
    if (this.jumpBuf > 0) this.jumpBuf -= dt;
    if (this.coyote > 0) this.coyote -= dt;

    if (this.jumpBuf > 0 && (this.onGround || this.coyote > 0) && !this.crawling) {
      this.vy = JUMP_VEL;
      this.onGround = false;
      this.coyote = 0;
      this.jumpBuf = 0;
      this.wallRunUsed = false;
      CR.Audio.sfx.jump();
    }

    /* ---------- wall run and wall jump ----------
       Hold towards a wall in mid air and press jump: he runs a short way
       straight up it, exactly like the 3D Prince of Persia games. */
    var touchingWall = 0;
    if (!this.onGround && !this.crawling) {
      if (wantDir !== 0) {
        var probe = CR.rect(this.x + wantDir * 2, this.y + 3, this.w, this.h - 6);
        if (W.blocked(probe)) touchingWall = wantDir;
      }
    }
    this.wallDir = touchingWall;

    if (this.wallRunT > 0) {
      this.wallRunT -= dt;
      this.vy = -142;
      this.anim = 'wallrun';
      if (touchingWall === 0) this.wallRunT = 0;
      if (In.jumpPressed) {
        this.wallRunT = 0;
        this.vy = JUMP_VEL * 0.92;
        this.vx = -this.facing * 120;
        CR.Audio.sfx.jump();
      }
    } else if (touchingWall !== 0) {
      if (this.jumpBuf > 0 && !this.wallRunUsed && this.vy > -60) {
        this.wallRunT = 0.30;
        this.wallRunUsed = true;
        this.jumpBuf = 0;
        this.vy = -142;
        CR.Audio.sfx.step();
      } else if (this.vy > 30) {
        this.vy = Math.min(this.vy, 70);      // slide down the wall slowly
      }
    }

    /* ---------- grabbing a rope ---------- */
    if (this.ropeCooldown <= 0 && (In.up || In.jump)) {
      for (var i = 0; i < W.ropes.length; i++) {
        var rp = W.ropes[i];
        var ex = rp.x + Math.sin(rp.a) * rp.len;
        var ey = rp.y + Math.cos(rp.a) * rp.len;
        // his hands count as well as his middle - catching a rope should
        // feel generous, not like threading a needle
        if (CR.dist(this.centerX(), this.centerY(), ex, ey) < 24 ||
            CR.dist(this.centerX(), this.y + 5, ex, ey) < 24) {
          this.grabRope(rp);
          return;
        }
      }
    }

    /* ---------- swinging the blade ---------- */
    var wp = WEAPONS[this.weapon];
    if (this.attackT > 0) {
      this.attackT += dt;
      if (this.attackT >= this.attackDur) { this.attackT = 0; this.attackHit = false; }
    } else if (In.attackPressed && !this.crawling) {
      this.attackT = 0.0001;
      this.attackDur = wp.wind + wp.active + wp.recover;
      this.attackHit = false;
      CR.Audio.sfx.swing();
    }

    /* ---------- gravity and actually moving ---------- */
    if (this.wallRunT <= 0) {
      this.vy = Math.min(this.vy + GRAVITY * dt, MAX_FALL);
    }

    var wasAir = !this.onGround;
    var fallSpeed = this.vy;
    var res = W.moveBox(this, this.vx * dt, this.vy * dt);

    if (res.hitX) this.vx = 0;
    if (res.ceiling) this.vy = 0;

    if (res.onGround) {
      if (wasAir) {
        this.landVy = fallSpeed;
        if (fallSpeed >= FATAL_FALL && !game.assistNoFallDeath) {
          this.die(game, 'fall');
          return;
        }
        if (fallSpeed > 120) {
          CR.Audio.sfx.land();
          CR.World.puff(this.centerX(), this.y + this.h, 4, '#c8b48a', 50);
        }
      }
      this.vy = 0;
      this.onGround = true;
      this.coyote = COYOTE;
      this.wallRunUsed = false;
    } else {
      if (this.onGround) this.coyote = COYOTE;
      this.onGround = W.groundBelow(this, 2);
      if (this.onGround) this.vy = Math.max(this.vy, 0);
    }

    /* ---------- ledge grab ----------
       While falling, if his hands are level with the top of a wall he is
       facing, he catches it. This is the move that makes the platforming
       feel forgiving instead of cruel. */
    if (!this.onGround && this.vy > 20 && !this.crawling && this.wallRunT <= 0) {
      var handX = this.x + (this.facing > 0 ? this.w + 1 : -1);
      var probeTop = CR.rect(handX - 1, this.y + 2, 3, 4);
      var probeAbove = CR.rect(handX - 1, this.y - 8, 3, 9);
      var grabbed = W.solidOverlap(probeTop);
      if (grabbed && !W.solidOverlap(probeAbove) && Math.abs(grabbed.y - (this.y + 4)) < 6) {
        this.hanging = true;
        this.hangY = grabbed.y;
        this.y = grabbed.y - 4;
        this.vy = 0; this.vx = 0;
        CR.Audio.sfx.step();
      }
    }

    /* ---------- footstep ticks ---------- */
    if (this.onGround && Math.abs(this.vx) > 20) {
      this.stepT -= dt * Math.abs(this.vx) / 60;
      if (this.stepT <= 0) { this.stepT = 0.34; CR.Audio.sfx.step(); }
    }

    /* ---------- work out which animation to show ---------- */
    if (this.attackT > 0) this.anim = 'attack';
    else if (this.wallRunT > 0) this.anim = 'wallrun';
    else if (this.crawling) this.anim = (Math.abs(this.vx) > 4 ? 'crawl' : 'crawl');
    else if (!this.onGround) this.anim = this.vy < -20 ? 'jump' : 'fall';
    else if (Math.abs(this.vx) > WALK_SPEED + 12) this.anim = 'run';
    else if (Math.abs(this.vx) > 6) this.anim = 'walk';
    else this.anim = 'idle';

    /* ---------- fell off the bottom of the world ---------- */
    if (this.y > CR.World.h + 20) this.die(game, 'pit');

    this.checkHazards(game);
    this.checkPickups(game);
  };

  /* ---------- rope ---------- */
  Player.prototype.grabRope = function (rp) {
    this.rope = rp;
    rp.rider = this;
    // start the swing from wherever he was already moving
    rp.va = CR.clamp(this.vx / rp.len * 0.9, -3, 3);
    this.vy = 0;
    this.say('Aah!', 0.5);
    CR.Audio.sfx.step();
  };

  Player.prototype.updateRope = function (dt, game) {
    var In = CR.Input;
    var rp = this.rope;

    // a pendulum: gravity pulls the far end back towards straight down
    var pump = (In.right ? 1 : 0) - (In.left ? 1 : 0);
    rp.va += -Math.sin(rp.a) * 7.0 * dt;
    rp.va += pump * 2.4 * dt;
    rp.va *= 0.998;
    rp.a += rp.va * dt;
    rp.a = CR.clamp(rp.a, -1.5, 1.5);

    var ex = rp.x + Math.sin(rp.a) * rp.len;
    var ey = rp.y + Math.cos(rp.a) * rp.len;
    this.x = ex - this.w / 2;
    this.y = ey - 4;
    this.facing = rp.va > 0 ? 1 : -1;
    this.anim = 'swing';

    if (CR.Input.jumpPressed || CR.Input.down) {
      // let go: fling him along the direction the rope was travelling
      var tangential = rp.va * rp.len;
      this.vx = Math.cos(rp.a) * tangential;
      this.vy = -Math.sin(rp.a) * tangential - 90;
      rp.rider = null;
      this.rope = null;
      this.ropeCooldown = 0.45;
      this.onGround = false;
      CR.Audio.sfx.jump();
    }
    this.checkHazards(game);
  };

  /* ---------- spikes, traps, pits ---------- */
  Player.prototype.checkHazards = function (game) {
    if (this.dead || this.invuln > 0) return;
    var W = CR.World, b = this.box(), i;

    for (i = 0; i < W.spikes.length; i++) {
      var sp = W.spikes[i];
      if (CR.overlap(b, CR.rect(sp.x, sp.y - 7, sp.w, 8))) { this.die(game, 'spike'); return; }
    }
    for (i = 0; i < W.traps.length; i++) {
      var tr = W.traps[i];
      if (tr.out < 0.45) continue;
      if (CR.overlap(b, CR.rect(tr.x, tr.y - 8 * tr.out, 16, 8 * tr.out))) { this.die(game, 'spike'); return; }
    }
  };

  Player.prototype.checkPickups = function (game) {
    var W = CR.World, b = this.box();
    for (var i = 0; i < W.pickups.length; i++) {
      var pk = W.pickups[i];
      if (pk.taken) continue;
      if (!CR.overlap(b, CR.rect(pk.x - 2, pk.y - 4, 14, 18))) continue;
      pk.taken = true;
      if (pk.kind === 'sword') {
        this.weapon = 'sword';
        CR.Audio.sfx.pickup();
        game.banner('THE CAPTAIN’S SWORD IS YOURS — longer reach, twice the bite');
        this.say('Nandri!', 1.4);
      } else {
        this.hearts = Math.min(this.maxHearts, this.hearts + 1);
        CR.Audio.sfx.heart();
      }
    }
  };

  /* ---------- taking a hit ---------- */
  Player.prototype.hurt = function (game, fromX, amount) {
    if (this.invuln > 0 || this.dead) return false;
    this.hearts -= (amount || 1);
    this.invuln = 1.25;
    this.hurtT = 0.36;
    this.vx = (this.centerX() < fromX ? -1 : 1) * 110;
    this.vy = -105;
    this.onGround = false;
    CR.World.camera.shake = 0.8;

    if (this.hearts <= 0) { this.die(game, 'blade'); return true; }
    CR.Audio.sfx.hurt();
    this.say('Ayyo!', 0.9);
    return true;
  };

  Player.prototype.die = function (game, cause) {
    if (this.dead) return;
    this.dead = true;
    this.deadT = 0;
    this.hearts = 0;
    this.vy = -70;
    this.rope = null;
    this.hanging = false;
    CR.World.camera.shake = 1;
    CR.Audio.sfx.ayyo();
    game.onPlayerDied(cause);
  };

  /* ---------- the sword hitbox ----------
     Only live during the middle slice of the swing. */
  Player.prototype.attackBox = function () {
    if (this.attackT <= 0) return null;
    var wp = WEAPONS[this.weapon];
    if (this.attackT < wp.wind || this.attackT > wp.wind + wp.active) return null;
    var reach = wp.reach;
    var x = this.facing > 0 ? this.x + this.w - 2 : this.x - reach + 2;
    return CR.rect(x, this.y + 3, reach, this.h - 8);
  };

  Player.prototype.damage = function () { return WEAPONS[this.weapon].dmg; };

  Player.prototype.attackPhase = function () {
    if (this.attackT <= 0) return 0;
    return this.attackT / this.attackDur;
  };

  /* ---------- drawing ---------- */
  Player.prototype.draw = function (ctx, cam) {
    var sx = this.x + this.w / 2 - cam.x;
    var sy = this.y + this.h - cam.y;

    // blink while invulnerable so you can see the hit registered
    if (this.invuln > 0 && !this.dead && Math.floor(this.invuln * 18) % 2 === 0) return;

    // soft shadow on the ground
    if (!this.dead) {
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.beginPath();
      ctx.ellipse(sx, sy + 1, 7, 2.2, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    var pose = {
      x: sx, y: sy,
      height: 30,
      anim: this.anim,
      t: this.animT,
      facing: this.facing,
      weapon: this.weapon,
      colors: CR.Art.HERO,
      crown: true,
      attackP: this.attackPhase()
    };
    // a dark copy just behind him, so he never disappears into the scenery
    pose.tint = 'rgba(8,5,4,0.3)';
    pose.x = sx + 1.8; pose.y = sy + 0.6;
    CR.Art.drawPerson(ctx, pose);
    pose.tint = null;
    pose.x = sx; pose.y = sy;
    CR.Art.drawPerson(ctx, pose);

    if (this.bark) {
      CR.Art.text(ctx, this.bark, sx, sy - 36, { align: 'center', font: CR.Art.FONT_SMALL, color: '#ffe9a8' });
    }
  };

  CR.Player = Player;
})();
</script>
<script>/* ---- js/enemies.js ---- */
/* ============================================================
   enemies.js - the Pandya soldiers, their captain, and Vimal.

   Every soldier runs the same little brain:
     wait -> spot the prince -> shout -> close in -> wind up -> strike
   The wind-up is the important part. A guard always telegraphs his
   swing before it lands, so a death is always your fault, never a
   surprise. That is what makes a fight feel fair.
   ============================================================ */
(function () {

  var TYPES = {
    guard: {
      hp: 2, w: 12, h: 28, height: 29, speed: 46, sight: 132,
      reach: 17, wind: 0.55, active: 0.16, recover: 0.55,
      colors: 'GUARD', weapon: 'sword', helmet: true, shield: true, plume: false
    },
    spearman: {
      hp: 2, w: 12, h: 28, height: 29, speed: 38, sight: 150,
      reach: 26, wind: 0.68, active: 0.18, recover: 0.62,
      colors: 'GUARD', weapon: 'spear', helmet: true, shield: false, plume: false
    },
    captain: {
      hp: 5, w: 13, h: 29, height: 31, speed: 62, sight: 165,
      reach: 20, wind: 0.42, active: 0.16, recover: 0.40,
      colors: 'CAPTAIN', weapon: 'sword', helmet: true, shield: true, plume: true
    },
    boss: {
      hp: 20, w: 22, h: 44, height: 47, speed: 40, sight: 300,
      reach: 30, wind: 0.85, active: 0.22, recover: 0.85,
      colors: 'BOSS', weapon: 'club', helmet: false, shield: false, moustache: true
    }
  };

  function Enemy(x, y, type, opts) {
    var T = TYPES[type] || TYPES.guard;
    this.type = type;
    this.T = T;
    this.x = x; this.y = y - T.h;
    this.w = T.w; this.h = T.h;
    this.vx = 0; this.vy = 0;
    this.facing = -1;
    this.hp = T.hp;
    this.maxHp = T.hp;
    this.state = 'idle';       // idle | alert | chase | wind | strike | recover | hurt | dead
    this.timer = 0;
    this.animT = Math.random() * 3;
    this.onGround = false;
    this.homeX = x;
    this.patrol = opts && opts.patrol ? opts.patrol : 0;
    this.dropsSword = !!(opts && opts.dropsSword);
    this.bark = null; this.barkT = 0;
    this.hitFlash = 0;
    this.deadT = 0;
    this.engaged = false;
    this.shockwaves = [];
    this.slamCount = 0;
  }

  Enemy.prototype.box = function () { return CR.rect(this.x, this.y, this.w, this.h); };
  Enemy.prototype.centerX = function () { return this.x + this.w / 2; };
  Enemy.prototype.centerY = function () { return this.y + this.h / 2; };

  Enemy.prototype.say = function (t, s) { this.bark = t; this.barkT = s || 1.2; };

  Enemy.prototype.hitBox = function () {
    if (this.state !== 'strike') return null;
    var r = this.T.reach;
    var x = this.facing > 0 ? this.x + this.w - 3 : this.x - r + 3;
    return CR.rect(x, this.y + 4, r, this.h - 8);
  };

  Enemy.prototype.takeHit = function (dmg, fromX, game) {
    if (this.state === 'dead') return;
    this.hp -= dmg;
    this.hitFlash = 0.16;
    CR.World.camera.shake = 0.45;
    CR.World.puff(this.centerX(), this.centerY(), 5, '#a33', 70);

    if (this.hp <= 0) {
      this.state = 'dead';
      this.deadT = 0;
      this.vx = (this.centerX() < fromX ? -1 : 1) * 60;
      this.vy = -110;
      CR.Audio.sfx.guardDie();
      if (this.dropsSword) {
        CR.World.pickups.push({ x: this.centerX() - 5, y: this.y + this.h - 16, kind: 'sword', taken: false, bob: 0 });
      }
      game.onEnemyKilled(this);
    } else {
      this.state = 'hurt';
      this.timer = 0.28;
      this.vx = (this.centerX() < fromX ? -1 : 1) * 70;
      CR.Audio.sfx.hitFlesh();
    }
  };

  /* ---------- brain + body ---------- */
  Enemy.prototype.update = function (dt, game, player, slots) {
    var W = CR.World;
    this.animT += dt;
    if (this.barkT > 0) { this.barkT -= dt; if (this.barkT <= 0) this.bark = null; }
    if (this.hitFlash > 0) this.hitFlash -= dt;

    if (this.state === 'dead') {
      this.deadT += dt;
      this.vy = Math.min(this.vy + 640 * dt, 340);
      var rd = W.moveBox(this, this.vx * dt, this.vy * dt);
      if (rd.onGround) { this.vy = 0; this.vx *= 0.8; }
      return;
    }

    // how far away is the prince, and is he roughly on my level?
    var dx = player.centerX() - this.centerX();
    var dy = Math.abs(player.centerY() - this.centerY());
    var adx = Math.abs(dx);
    var canSee = adx < this.T.sight && dy < 44 && !player.dead;

    // the assist makes guards a little slower to swing if you keep dying
    var windMul = game.assist ? 1.35 : 1;
    var recoverMul = game.assist ? 1.3 : 1;

    switch (this.state) {
      case 'idle':
        this.vx = 0;
        if (this.patrol > 0) {
          // pace back and forth in front of your post
          var target = this.homeX + Math.sin(this.animT * 0.6) * this.patrol;
          this.vx = CR.clamp((target - this.x) * 2, -22, 22);
          if (Math.abs(this.vx) > 3) this.facing = CR.sign(this.vx);
        }
        if (canSee) {
          this.state = 'alert';
          this.timer = 0.45;
          this.facing = CR.sign(dx) || this.facing;
          this.say('Yaar angae?!', 1.3);
          CR.Audio.sfx.alert();
        }
        break;

      case 'alert':
        this.vx = 0;
        this.timer -= dt;
        if (this.timer <= 0) this.state = 'chase';
        break;

      case 'chase':
        // only a few soldiers crowd the prince at once - the rest hold back,
        // so a platform never turns into an unfair pile-on
        if (!this.engaged && slots.taken >= slots.max && adx > this.T.reach + 6) {
          this.vx = CR.approach(this.vx, 0, 300 * dt);
          break;
        }
        this.engaged = true;
        this.facing = CR.sign(dx) || this.facing;

        if (adx <= this.T.reach - 3 && dy < 30) {
          this.state = 'wind';
          this.timer = this.T.wind * windMul;
          this.vx = 0;
        } else {
          var sp = this.T.speed * (this.type === 'boss' ? 1 : 1);
          this.vx = CR.approach(this.vx, this.facing * sp, 400 * dt);
          // never walk off a cliff
          var ahead = CR.rect(this.x + this.facing * 8, this.y + this.h, 4, 6);
          if (this.onGround && !W.blocked(ahead)) this.vx = 0;
          if (!canSee && adx > this.T.sight * 1.4) { this.state = 'idle'; this.engaged = false; }
        }
        break;

      case 'wind':
        this.vx = CR.approach(this.vx, 0, 500 * dt);
        this.timer -= dt;
        if (this.timer <= 0) {
          this.state = 'strike';
          this.timer = this.T.active;
          this.hasHit = false;
          if (this.type === 'boss') { CR.Audio.sfx.slam(); this.spawnShockwave(); }
          else CR.Audio.sfx.swing();
        }
        break;

      case 'strike':
        this.timer -= dt;
        if (this.type === 'boss') this.vx = 0;
        else this.vx = this.facing * 40;
        var hb = this.hitBox();
        if (hb && !this.hasHit && CR.overlap(hb, player.box())) {
          this.hasHit = true;
          player.hurt(game, this.centerX(), this.type === 'boss' ? 2 : 1);
        }
        if (this.timer <= 0) { this.state = 'recover'; this.timer = this.T.recover * recoverMul; }
        break;

      case 'recover':
        this.vx = CR.approach(this.vx, 0, 400 * dt);
        this.timer -= dt;
        if (this.timer <= 0) this.state = canSee ? 'chase' : 'idle';
        break;

      case 'hurt':
        this.timer -= dt;
        this.vx = CR.approach(this.vx, 0, 260 * dt);
        if (this.timer <= 0) { this.state = 'chase'; this.engaged = true; }
        break;
    }

    // gravity and movement
    this.vy = Math.min(this.vy + 640 * dt, 340);
    var res = W.moveBox(this, this.vx * dt, this.vy * dt);
    if (res.hitX) this.vx = 0;
    if (res.onGround) { this.vy = 0; this.onGround = true; }
    else this.onGround = W.groundBelow(this, 2);

    // the boss sends a wave of force along the floor when he slams
    for (var i = this.shockwaves.length - 1; i >= 0; i--) {
      var s = this.shockwaves[i];
      s.x += s.dir * 150 * dt;
      s.life -= dt;
      if (!s.hit && CR.overlap(CR.rect(s.x - 7, s.y - 14, 14, 14), player.box())) {
        s.hit = true;
        if (!player.onGround) { /* jumping over it is the answer */ }
        else player.hurt(game, s.x, 1);
      }
      if (s.life <= 0) this.shockwaves.splice(i, 1);
    }
  };

  Enemy.prototype.spawnShockwave = function () {
    this.slamCount++;
    CR.World.camera.shake = 1.4;
    CR.World.puff(this.centerX(), this.y + this.h, 10, '#6a5030', 140);
    this.shockwaves.push({ x: this.centerX() - 10, y: this.y + this.h, dir: -1, life: 1.5, hit: false });
    this.shockwaves.push({ x: this.centerX() + 10, y: this.y + this.h, dir: 1, life: 1.5, hit: false });
  };

  /* ---------- drawing ---------- */
  Enemy.prototype.draw = function (ctx, cam) {
    var sx = this.centerX() - cam.x;
    var sy = this.y + this.h - cam.y;
    var T = this.T;
    var colors = CR.Art[T.colors];

    var anim = 'idle';
    if (this.state === 'dead') anim = 'dead';
    else if (this.state === 'hurt') anim = 'hurt';
    else if (this.state === 'wind') anim = 'attack';
    else if (this.state === 'strike' || this.state === 'recover') anim = 'attack';
    else if (Math.abs(this.vx) > 10) anim = Math.abs(this.vx) > 55 ? 'run' : 'walk';

    // during a wind-up the arm holds back; during the strike it sweeps through
    var p = 0;
    if (this.state === 'wind') p = 0.30 * (1 - this.timer / (T.wind || 0.5));
    else if (this.state === 'strike') p = 0.32 + 0.5 * (1 - this.timer / T.active);
    else if (this.state === 'recover') p = 0.86 + 0.14 * (1 - this.timer / T.recover);

    // shadow
    if (this.state !== 'dead') {
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.beginPath();
      ctx.ellipse(sx, sy + 1, this.w * 0.6, 2.2, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.save();
    if (this.state === 'dead') ctx.globalAlpha = Math.max(0, 1 - Math.max(0, this.deadT - 1.6) / 1.2);
    if (this.hitFlash > 0) {
      ctx.save();
      ctx.globalAlpha = 0.9;
    }

    var pose = {
      x: sx, y: sy,
      height: T.height,
      anim: anim, t: this.animT, facing: this.facing,
      weapon: T.weapon, colors: colors,
      helmet: T.helmet, shield: T.shield, plume: T.plume, moustache: T.moustache,
      attackP: p
    };
    pose.tint = 'rgba(8,5,4,0.3)';
    pose.x = sx + 1.8; pose.y = sy + 0.6;
    CR.Art.drawPerson(ctx, pose);
    pose.tint = null;
    pose.x = sx; pose.y = sy;
    // a white flash on the frame a hit lands, so you feel the contact
    if (this.hitFlash > 0.02) pose.tint = 'rgba(255,240,230,0.92)';
    CR.Art.drawPerson(ctx, pose);
    if (this.hitFlash > 0) ctx.restore();
    ctx.restore();

    // a red glint just before the blade lands - your cue to move
    if (this.state === 'wind') {
      var warn = 0.4 + Math.sin(this.animT * 30) * 0.3;
      ctx.fillStyle = 'rgba(255,80,60,' + warn + ')';
      ctx.beginPath();
      ctx.arc(sx + this.facing * (T.reach * 0.6), sy - this.h * 0.75, 2.6, 0, Math.PI * 2);
      ctx.fill();
    }

    // shockwaves
    for (var i = 0; i < this.shockwaves.length; i++) {
      var s = this.shockwaves[i];
      var wx = s.x - cam.x, wy = s.y - cam.y;
      ctx.strokeStyle = 'rgba(255,170,80,' + Math.max(0, s.life) + ')';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(wx, wy);
      ctx.lineTo(wx, wy - 12);
      ctx.stroke();
      ctx.fillStyle = 'rgba(255,200,120,0.5)';
      ctx.fillRect(wx - 2, wy - 3, 4, 3);
    }

    if (this.bark) {
      CR.Art.text(ctx, this.bark, sx, sy - T.height - 6, {
        align: 'center', font: CR.Art.FONT_SMALL, color: '#ffd0a0'
      });
    }

    // boss health bar, drawn above his head
    if (this.type === 'boss' && this.state !== 'dead') {
      var bw = 46;
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(sx - bw / 2 - 1, sy - T.height - 13, bw + 2, 5);
      ctx.fillStyle = '#a8323c';
      ctx.fillRect(sx - bw / 2, sy - T.height - 12, bw * (this.hp / this.maxHp), 3);
    }
  };

  Enemy.TYPES = TYPES;
  CR.Enemy = Enemy;
})();
</script>

<script>/* ---- js/story.js ---- */
/* ============================================================
   story.js - the comic book pages.

   The story is told as a page-turner: each page paints itself, holds
   for ten seconds, then turns on its own. Nobody has to click anything,
   which is what you asked for - but pressing a key skips ahead for
   anyone who has already read it.
   ============================================================ */
(function () {
  var S = {};
  // Comic pages are drawn in their own fixed 480x270 space, then scaled
  // into whatever room the panel has. That keeps the layouts stable.
  var PAGE_W = 480, PAGE_H = 270;


  var NIGHT = { sky1: '#0b1026', sky2: '#1d2140', stone: '#2a2c44', stoneLit: '#3b3d5c', warm: '#ffb347' };
  var DAY   = { sky1: '#3f6f8a', sky2: '#d8b06a', stone: '#6b5a44', stoneLit: '#8d795c', warm: '#ffd88a' };

  /* ---------- shared scene furniture ---------- */

  function sky(ctx, c1, c2) {
    var g = ctx.createLinearGradient(0, 0, 0, PAGE_H);
    g.addColorStop(0, c1); g.addColorStop(1, c2);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, PAGE_W, PAGE_H);
  }

  function moon(ctx, x, y, r) {
    var g = ctx.createRadialGradient(x, y, 1, x, y, r * 4);
    g.addColorStop(0, 'rgba(255,250,220,0.55)');
    g.addColorStop(1, 'rgba(255,250,220,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, r * 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fdf6d8';
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }

  function stars(ctx, seed) {
    var rnd = CR.rng(seed);
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    for (var i = 0; i < 40; i++) {
      ctx.fillRect(rnd() * PAGE_W, rnd() * 120, 1, 1);
    }
  }

  // The Chola palace: a long wall, a gopuram gate, lamps burning.
  function palace(ctx, col, baseY, t, lamps) {
    ctx.fillStyle = col.stone;
    ctx.fillRect(0, baseY - 60, PAGE_W, 60 + (PAGE_H - baseY));
    ctx.fillStyle = col.stoneLit;
    for (var i = 0; i < PAGE_W; i += 22) ctx.fillRect(i, baseY - 66, 13, 7);
    CR.Art.gopuram(ctx, 118, baseY - 60, 62, 108, col.stone, true);
    CR.Art.gopuram(ctx, 372, baseY - 60, 48, 82, col.stone, true);
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(228, baseY - 46, 34, 46);          // the gateway
    if (lamps) {
      for (var k = 0; k < 5; k++) CR.Art.torch(ctx, 30 + k * 108, baseY - 22, t);
    }
    CR.Art.inscription(ctx, 24, baseY - 34, 70, 3, 'rgba(255,255,255,0.14)', 11);
  }

  function ground(ctx, y, col) {
    ctx.fillStyle = col;
    ctx.fillRect(0, y, PAGE_W, PAGE_H - y);
  }

  // A Chola guard, upright and awake.
  function guard(ctx, x, y, t, face, anim, h) {
    CR.Art.drawPerson(ctx, {
      x: x, y: y, height: h || 46, anim: anim || 'idle', t: t, facing: face || 1,
      colors: CR.Art.CHOLA, weapon: 'spear', helmet: true
    });
  }

  // a sleeping guard, complete with the snoring letters
  function sleeper(ctx, x, y, t, face) {
    // the spear he has dropped
    ctx.save();
    ctx.translate(x, y);
    ctx.strokeStyle = '#8a6a40'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(face * 6, 0); ctx.lineTo(face * 26, -6); ctx.stroke();
    ctx.restore();
    CR.Art.drawPerson(ctx, {
      x: x, y: y, height: 46, anim: 'sleep', t: t, facing: face || 1,
      colors: CR.Art.CHOLA, weapon: 'none', helmet: true
    });
    var n = Math.floor(t * 1.2) % 3;
    for (var i = 0; i <= n; i++) {
      CR.Art.text(ctx, 'z', x + face * (10 + i * 7), y - 32 - i * 8,
        { font: CR.Art.FONT_UI, color: 'rgba(255,255,255,0.85)' });
    }
  }

  function horse(ctx, x, y, s, col, t, running) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, s);
    var dark = '#1a1210';
    ctx.fillStyle = col;
    // barrel of the body
    CR.Art.roundRect(ctx, -20, -30, 40, 17, 7); ctx.fill();
    // neck, rising forward
    ctx.save();
    ctx.translate(16, -28);
    ctx.rotate(-0.5);
    ctx.fillStyle = col;
    CR.Art.roundRect(ctx, -5, -16, 10, 20, 4); ctx.fill();
    ctx.restore();
    // head
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.ellipse(26, -44, 8, 4.6, -0.25, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = dark;
    ctx.beginPath(); ctx.moveTo(22, -49); ctx.lineTo(24, -54); ctx.lineTo(26, -48); ctx.fill();
    // mane and tail
    ctx.fillStyle = dark;
    ctx.beginPath(); ctx.moveTo(12, -44); ctx.lineTo(20, -46); ctx.lineTo(14, -28); ctx.lineTo(8, -30); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-20, -30); ctx.lineTo(-30, -22); ctx.lineTo(-20, -18); ctx.fill();
    // legs
    ctx.strokeStyle = col; ctx.lineWidth = 3.4; ctx.lineCap = 'round';
    var ph = running ? t * 13 : 0;
    for (var i = 0; i < 4; i++) {
      var lx = -14 + (i % 2) * 28;
      var a = running ? Math.sin(ph + i * 1.6) * 0.75 : (i % 2 ? 0.18 : -0.18);
      var kx = lx + Math.sin(a) * 8, ky = -14 + Math.cos(a) * 8;
      ctx.beginPath();
      ctx.moveTo(lx, -14);
      ctx.lineTo(kx, ky);
      ctx.lineTo(kx + Math.sin(a * 0.3) * 6, ky + Math.cos(a * 0.3) * 6);
      ctx.stroke();
    }
    ctx.restore();
  }

  // Vimal: heavy, loud, and not nearly as clever as he thinks
  function vimal(ctx, x, y, anim, t, facing, carrying, h) {
    h = h || 70;
    CR.Art.drawPerson(ctx, {
      x: x, y: y, height: h, anim: anim, t: t, facing: facing,
      colors: CR.Art.BOSS, weapon: carrying ? 'none' : 'club', moustache: true
    });
    if (carrying) {
      ctx.save();
      ctx.translate(x - facing * h * 0.13, y - h * 0.88);
      ctx.rotate(facing * 0.5);
      ctx.scale(h / 61, h / 61);
      CR.Art.drawPrincess(ctx, 0, 10, t, false);
      ctx.restore();
    }
  }

  function speech(ctx, x, y, text, flip) {
    ctx.font = CR.Art.FONT_SMALL;
    var w = ctx.measureText(text).width + 10;
    var h = 13;
    ctx.fillStyle = 'rgba(252,246,228,0.95)';
    CR.Art.roundRect(ctx, x - w / 2, y - h, w, h, 5); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x + (flip ? 5 : -5), y);
    ctx.lineTo(x + (flip ? -2 : 2), y + 6);
    ctx.lineTo(x + (flip ? -5 : 5), y);
    ctx.fill();
    CR.Art.text(ctx, text, x, y - 3.5, { align: 'center', font: CR.Art.FONT_SMALL, color: '#2a1c10', shadow: false });
  }

  /* ---------- the pages ---------- */

  S.INTRO = [
    {
      caption: 'Cholapuram, a thousand years ago. A warm night, a full moon, and every single guard fast asleep.',
      draw: function (ctx, t) {
        sky(ctx, NIGHT.sky1, NIGHT.sky2);
        stars(ctx, 3);
        moon(ctx, 398, 44, 13);
        palace(ctx, NIGHT, 210, t, true);
        ground(ctx, 236, '#141826');
        sleeper(ctx, 150, 236, t, 1);
        sleeper(ctx, 196, 236, t + 1.7, -1);
        sleeper(ctx, 300, 236, t + 0.8, 1);
      }
    },
    {
      caption: 'Over the wall came Vimal of the Pandya court - a very large man with a very quiet opinion of himself.',
      draw: function (ctx, t) {
        sky(ctx, NIGHT.sky1, NIGHT.sky2);
        stars(ctx, 9);
        moon(ctx, 60, 40, 11);
        palace(ctx, NIGHT, 220, t, true);
        ground(ctx, 246, '#141826');
        vimal(ctx, 232, 246, 'walk', t * 0.35, 1, false);
        speech(ctx, 300, 178, 'Tip... toe... tip...', false);
        sleeper(ctx, 96, 246, t, 1);
        sleeper(ctx, 400, 246, t + 1.1, -1);
      }
    },
    {
      caption: 'He took Princess Kundavai, sister of Prince Rajaraja, straight out of her own courtyard.',
      draw: function (ctx, t) {
        sky(ctx, NIGHT.sky1, NIGHT.sky2);
        stars(ctx, 21);
        palace(ctx, NIGHT, 214, t, true);
        ground(ctx, 240, '#141826');
        vimal(ctx, 170, 240, 'run', t, 1, true);
        speech(ctx, 118, 158, 'Ayyo! Somebody!', true);
        horse(ctx, 350, 240, 1.05, '#3b2c22', t, false);
        CR.Art.kolam(ctx, 60, 236, 12, 'rgba(255,255,255,0.2)');
      }
    },
    {
      caption: 'By the time anyone woke up, there was nothing left to see but dust and a very smug silhouette.',
      draw: function (ctx, t) {
        sky(ctx, NIGHT.sky1, NIGHT.sky2);
        stars(ctx, 33);
        moon(ctx, 404, 52, 12);
        palace(ctx, NIGHT, 208, t, true);
        ground(ctx, 234, '#141826');
        guard(ctx, 84, 234, t, 1, 'cheer', 50);
        guard(ctx, 132, 234, t + 1, 1, 'idle', 48);
        speech(ctx, 112, 172, 'She is GONE!', false);
        // Vimal, already small in the distance
        horse(ctx, 402, 226, 0.62, '#2c211a', t, true);
        vimal(ctx, 398, 202, 'idle', t, 1, true, 40);
        ctx.fillStyle = 'rgba(255,255,255,0.10)';
        for (var i = 0; i < 9; i++) ctx.fillRect(290 + i * 13, 226 - (i % 3), 9, 2);
      }
    },
    {
      caption: 'King Parantaka Chola was woken with the news. He did not take it calmly.',
      draw: function (ctx, t) {
        sky(ctx, '#20182c', '#3a2a30');
        // throne room
        ctx.fillStyle = '#2c2230';
        ctx.fillRect(0, 0, PAGE_W, PAGE_H);
        ctx.fillStyle = '#3a2c3c';
        for (var x = 20; x < PAGE_W; x += 96) ctx.fillRect(x, 40, 22, 180);
        ground(ctx, 220, '#241b26');
        for (var k = 0; k < 4; k++) CR.Art.torch(ctx, 46 + k * 128, 208, t);
        // throne
        ctx.fillStyle = '#6a4a1c';
        CR.Art.roundRect(ctx, 74, 140, 66, 82, 8); ctx.fill();
        ctx.fillStyle = '#d8b24e';
        ctx.fillRect(74, 134, 66, 8);
        CR.Art.kolam(ctx, 107, 176, 15, 'rgba(255,220,140,0.25)');
        // the king is on his feet, not on his throne
        CR.Art.drawPerson(ctx, { x: 190, y: 222, height: 64, anim: 'cheer', t: t, facing: 1, colors: CR.Art.CHOLA, weapon: 'none', crown: true, moustache: true });
        speech(ctx, 262, 118, 'You were ASLEEP?!', false);
        guard(ctx, 320, 222, t, -1, 'hurt', 52);
        guard(ctx, 372, 222, t + 1, -1, 'hurt', 50);
      }
    },
    {
      caption: 'Prince Rajaraja made one promise: "I will bring my sister home." Then he took a chariot south, alone.',
      draw: function (ctx, t) {
        sky(ctx, '#3a3050', '#c98a54');
        var sg = ctx.createRadialGradient(70, 150, 4, 70, 150, 90);
        sg.addColorStop(0, 'rgba(255,220,150,0.8)');
        sg.addColorStop(1, 'rgba(255,200,120,0)');
        ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(70, 150, 90, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#3d3245';
        ctx.beginPath();
        ctx.moveTo(0, 200);
        for (var x = 0; x <= PAGE_W; x += 20) ctx.lineTo(x, 176 + Math.sin(x * 0.02) * 16);
        ctx.lineTo(PAGE_W, PAGE_H); ctx.lineTo(0, PAGE_H); ctx.fill();
        CR.Art.gopuram(ctx, 400, 196, 40, 74, '#3d3245', false);
        ground(ctx, 224, '#6a4f34');
        horse(ctx, 130, 224, 1.35, '#2e2018', t, true);
        // chariot
        ctx.fillStyle = '#7a5230';
        CR.Art.roundRect(ctx, 196, 168, 62, 34, 5); ctx.fill();
        ctx.fillStyle = '#d8b24e';
        ctx.fillRect(196, 166, 62, 5);
        ctx.strokeStyle = '#4a3320'; ctx.lineWidth = 2.6;
        ctx.beginPath(); ctx.arc(226, 210, 14, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(196, 186); ctx.lineTo(150, 190); ctx.stroke();
        CR.Art.drawPerson(ctx, { x: 232, y: 170, height: 54, anim: 'idle', t: t, facing: -1, colors: CR.Art.HERO, weapon: 'dagger', crown: true });
        speech(ctx, 316, 116, 'I will bring her home.', true);
      }
    }
  ];

  S.ENDING = [
    {
      caption: 'Vimal went down like a sack of temple rice, and the lamps of the hall shook with him.',
      draw: function (ctx, t) {
        ctx.fillStyle = '#140e1c'; ctx.fillRect(0, 0, PAGE_W, PAGE_H);
        ctx.fillStyle = '#241a28';
        for (var x = 10; x < PAGE_W; x += 92) ctx.fillRect(x, 20, 24, 200);
        ground(ctx, 218, '#2a1f2e');
        for (var k = 0; k < 4; k++) CR.Art.torch(ctx, 54 + k * 122, 206, t);
        vimal(ctx, 330, 218, 'dead', t, -1, false);
        CR.Art.drawPerson(ctx, { x: 172, y: 218, height: 56, anim: 'idle', t: t, facing: 1, colors: CR.Art.HERO, weapon: 'sword', crown: true });
        speech(ctx, 140, 138, 'Kundavai!', true);
      }
    },
    {
      caption: 'The lock gave way. She had been waiting three days, and she had a great deal to say about it.',
      draw: function (ctx, t) {
        ctx.fillStyle = '#181022'; ctx.fillRect(0, 0, PAGE_W, PAGE_H);
        ground(ctx, 214, '#2a1f2e');
        for (var k = 0; k < 3; k++) CR.Art.torch(ctx, 70 + k * 160, 202, t);
        // the broken cage door, swung open
        ctx.strokeStyle = '#8e959e'; ctx.lineWidth = 2.4;
        for (var b = 0; b <= 44; b += 8.8) {
          ctx.beginPath(); ctx.moveTo(300 + b, 214); ctx.lineTo(318 + b, 118); ctx.stroke();
        }
        ctx.beginPath(); ctx.moveTo(300, 214); ctx.lineTo(344, 214); ctx.stroke();
        CR.Art.drawPrincess(ctx, 236, 214, t, true, 54);
        CR.Art.drawPerson(ctx, { x: 168, y: 214, height: 56, anim: 'idle', t: t, facing: 1, colors: CR.Art.HERO, weapon: 'sword', crown: true });
        speech(ctx, 268, 132, 'Took you long enough!', false);
      }
    },
    {
      caption: 'They rode home to Cholapuram at first light. The guards, it is said, never slept on duty again.',
      draw: function (ctx, t) {
        sky(ctx, DAY.sky1, DAY.sky2);
        var sg = ctx.createRadialGradient(410, 60, 4, 410, 60, 80);
        sg.addColorStop(0, 'rgba(255,240,180,0.9)');
        sg.addColorStop(1, 'rgba(255,220,140,0)');
        ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(410, 60, 80, 0, Math.PI * 2); ctx.fill();
        palace(ctx, DAY, 206, t, false);
        ground(ctx, 232, '#8a6a44');
        CR.Art.drawPerson(ctx, { x: 152, y: 232, height: 58, anim: 'cheer', t: t + 0.4, facing: 1, colors: CR.Art.HERO, weapon: 'sword', crown: true });
        CR.Art.drawPrincess(ctx, 206, 232, t, true, 54);
        CR.Art.drawPerson(ctx, { x: 262, y: 232, height: 60, anim: 'cheer', t: t, facing: -1, colors: CR.Art.CHOLA, weapon: 'none', crown: true, moustache: true });
        for (var i = 0; i < 4; i++) {
          CR.Art.drawPerson(ctx, {
            x: 318 + i * 42, y: 232, height: 46, anim: 'cheer', t: t + i * 0.6,
            facing: -1, colors: CR.Art.CHOLA, weapon: 'none', helmet: true
          });
        }
        // flower petals
        var rnd = CR.rng(77);
        for (var p = 0; p < 26; p++) {
          var px = rnd() * PAGE_W;
          var py = ((rnd() * 300) + t * 30) % 240;
          ctx.fillStyle = p % 2 ? 'rgba(255,180,200,0.85)' : 'rgba(255,225,140,0.85)';
          ctx.fillRect(px, py, 2, 2);
        }
        CR.Art.kolam(ctx, 90, 228, 14, 'rgba(255,255,255,0.35)');
      }
    }
  ];

  /* Draws one page: the picture, a hand-drawn frame, and the caption. */
  S.drawPage = function (ctx, page, t, progress) {
    var panelW = CR.VIEW_W - 16, panelH = CR.VIEW_H - 58;
    ctx.save();
    ctx.beginPath();
    ctx.rect(8, 8, panelW, panelH);
    ctx.clip();
    ctx.translate(8, 8);
    ctx.scale(panelW / PAGE_W, panelH / PAGE_H);
    page.draw(ctx, t);
    ctx.restore();

    // paper background behind the caption
    ctx.fillStyle = '#f2e4c2';
    ctx.fillRect(0, CR.VIEW_H - 50, CR.VIEW_W, 50);
    ctx.fillStyle = '#d8c69c';
    ctx.fillRect(0, CR.VIEW_H - 50, CR.VIEW_W, 1.5);

    // the frame around the picture
    ctx.strokeStyle = '#2a1c10';
    ctx.lineWidth = 2.5;
    ctx.strokeRect(8, 8, panelW, panelH);

    var lines = CR.Art.wrap(ctx, page.caption, CR.VIEW_W - 36, CR.Art.FONT_BODY);
    var ty = CR.VIEW_H - 34 - (lines.length - 1) * 6;
    for (var i = 0; i < lines.length; i++) {
      CR.Art.text(ctx, lines[i], CR.VIEW_W / 2, ty + i * 12, {
        align: 'center', font: CR.Art.FONT_BODY, color: '#3a2a18', shadow: false
      });
    }

    // the page-turn timer, drawn as a thin line filling up
    ctx.fillStyle = 'rgba(58,42,24,0.25)';
    ctx.fillRect(0, CR.VIEW_H - 3, CR.VIEW_W, 3);
    ctx.fillStyle = '#8c5a2a';
    ctx.fillRect(0, CR.VIEW_H - 3, CR.VIEW_W * progress, 3);
  };

  CR.Story = S;
})();
</script>
<script>/* ---- js/ui.js ---- */
/* ============================================================
   ui.js - everything drawn on top of the world: the hearts, the
   menus, the touch buttons, the level cards and the pause screen.
   ============================================================ */
(function () {
  var UI = {};

  var GOLD = '#e8c887', CREAM = '#f6ecd2', INK = '#1a1208';

  /* ---------- reusable bits ---------- */

  UI.panel = function (ctx, x, y, w, h, alpha) {
    ctx.fillStyle = 'rgba(18,12,8,' + (alpha === undefined ? 0.82 : alpha) + ')';
    CR.Art.roundRect(ctx, x, y, w, h, 5); ctx.fill();
    ctx.strokeStyle = 'rgba(232,200,135,0.5)';
    ctx.lineWidth = 1;
    CR.Art.roundRect(ctx, x + 1, y + 1, w - 2, h - 2, 4); ctx.stroke();
  };

  // A menu row. Returns its rectangle so the game can test clicks against it.
  UI.menuItem = function (ctx, label, y, selected, hint) {
    var w = 190, x = CR.VIEW_W / 2 - w / 2, h = 22;
    if (selected) {
      ctx.fillStyle = 'rgba(232,200,135,0.16)';
      CR.Art.roundRect(ctx, x, y, w, h, 4); ctx.fill();
      ctx.strokeStyle = GOLD; ctx.lineWidth = 1;
      CR.Art.roundRect(ctx, x + 0.5, y + 0.5, w - 1, h - 1, 4); ctx.stroke();
    }
    CR.Art.text(ctx, label, CR.VIEW_W / 2, y + 15, {
      align: 'center', font: CR.Art.FONT_SUB, color: selected ? '#fff4d8' : GOLD
    });
    if (hint) {
      CR.Art.text(ctx, hint, CR.VIEW_W / 2 + w / 2 + 8, y + 14, {
        align: 'left', font: CR.Art.FONT_SMALL, color: 'rgba(232,200,135,0.55)'
      });
    }
    return CR.rect(x, y, w, h);
  };

  /* ---------- title screen ---------- */
  UI.drawTitle = function (ctx, game, t) {
    // a slow-moving version of the level 1 backdrop, purely for looks
    CR.Art.drawBackdrop(ctx, game.titleBackdrop, t * 12, 0);
    ctx.fillStyle = 'rgba(10,8,14,0.30)';
    ctx.fillRect(0, 0, CR.VIEW_W, CR.VIEW_H);

    // the prince, standing at the left, waiting
    CR.Art.drawPerson(ctx, {
      x: 48, y: CR.VIEW_H - 14, height: 42, anim: 'idle', t: t, facing: 1,
      colors: CR.Art.HERO, weapon: 'sword', crown: true
    });

    ctx.save();
    ctx.textAlign = 'center';
    ctx.font = CR.Art.FONT_TITLE;
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillText('CHOLA RAJA', CR.VIEW_W / 2 + 2, 50);
    var g = ctx.createLinearGradient(0, 22, 0, 54);
    g.addColorStop(0, '#ffe9a8'); g.addColorStop(1, '#c98a2a');
    ctx.fillStyle = g;
    ctx.fillText('CHOLA RAJA', CR.VIEW_W / 2, 48);
    ctx.restore();

    CR.Art.text(ctx, 'The Rescue of Kundavai', CR.VIEW_W / 2, 64, {
      align: 'center', font: CR.Art.FONT_SUB, color: GOLD
    });
    CR.Art.kolam(ctx, CR.VIEW_W / 2, 76, 8, 'rgba(232,200,135,0.5)');

    var rects = [];
    var y = 92;
    for (var i = 0; i < game.menu.items.length; i++) {
      rects.push(UI.menuItem(ctx, game.menu.items[i].label, y, game.menu.index === i, game.menu.items[i].hint));
      y += 25;
    }

    CR.Art.text(ctx, CR.Input.mode === 'touch' ? 'Tap an option' : 'Arrow keys and SPACE  -  M mutes the music',
      CR.VIEW_W / 2, CR.VIEW_H - 8, { align: 'center', font: CR.Art.FONT_SMALL, color: 'rgba(246,236,210,0.6)' });

    return rects;
  };

  /* ---------- how to play ---------- */
  UI.drawControls = function (ctx, game) {
    ctx.fillStyle = 'rgba(10,8,14,0.9)';
    ctx.fillRect(0, 0, CR.VIEW_W, CR.VIEW_H);
    CR.Art.text(ctx, 'HOW TO PLAY', CR.VIEW_W / 2, 30, { align: 'center', font: CR.Art.FONT_SUB, color: GOLD });

    var keyRows = [
      ['ARROW KEYS', 'walk left and right'],
      ['SHIFT', 'run (hold it, you jump much further)'],
      ['SPACE', 'jump  -  press again at a wall to run up it'],
      ['Z  /  J  /  CTRL', 'swing your blade'],
      ['DOWN', 'crawl through low gaps'],
      ['UP', 'climb a ledge, catch a rope, pull a lever, open a door'],
      ['ESC  /  P', 'pause    -    M mute']
    ];
    var touchRows = [
      ['LEFT THUMB', 'the stick: left and right to move, push up to jump, pull down to crawl'],
      ['SWORD BUTTON', 'swing your blade'],
      ['JUMP BUTTON', 'jump  -  tap again at a wall to run up it'],
      ['UP ON THE STICK', 'also climbs ledges, catches ropes and opens doors']
    ];
    var rows = CR.Input.mode === 'touch' ? touchRows : keyRows;

    var y = 48;
    for (var i = 0; i < rows.length; i++) {
      CR.Art.text(ctx, rows[i][0], 128, y, { align: 'right', font: CR.Art.FONT_UI, color: '#fff0c8' });
      CR.Art.text(ctx, rows[i][1], 138, y, { align: 'left', font: CR.Art.FONT_SMALL, color: 'rgba(246,236,210,0.78)' });
      y += 15;
    }

    CR.Art.text(ctx, 'Guards raise their weapon before they strike. That is your moment.',
      CR.VIEW_W / 2, y + 10, { align: 'center', font: CR.Art.FONT_SMALL, color: GOLD });
    CR.Art.text(ctx, 'A long fall kills. Spikes kill. Everything else costs one heart.',
      CR.VIEW_W / 2, y + 22, { align: 'center', font: CR.Art.FONT_SMALL, color: 'rgba(246,236,210,0.7)' });

    CR.Art.text(ctx, 'press SPACE to go back', CR.VIEW_W / 2, CR.VIEW_H - 8,
      { align: 'center', font: CR.Art.FONT_SMALL, color: 'rgba(246,236,210,0.55)' });
  };

  /* ---------- the heads-up display ---------- */
  UI.drawHUD = function (ctx, game) {
    var p = game.player;

    // hearts
    for (var i = 0; i < p.maxHearts; i++) {
      var x = 8 + i * 12, y = 8;
      if (i < p.hearts) CR.World.drawHeart(ctx, x, y, 9, '#d94a4a');
      else {
        ctx.globalAlpha = 0.32;
        CR.World.drawHeart(ctx, x, y, 9, '#4a3038');
        ctx.globalAlpha = 1;
      }
    }

    // which blade you are carrying
    ctx.save();
    ctx.translate(CR.VIEW_W - 20, 26);
    ctx.scale(0.85, 0.85);
    ctx.rotate(0.4);
    CR.Art.drawWeapon(ctx, p.weapon, CR.Art.HERO);
    ctx.restore();

    CR.Art.text(ctx, game.level.subtitle.toUpperCase(), CR.VIEW_W - 34, 14,
      { align: 'right', font: CR.Art.FONT_SMALL, color: 'rgba(246,236,210,0.7)' });

    if (game.muted) {
      CR.Art.text(ctx, 'MUTED', 8, CR.VIEW_H - 8, { font: CR.Art.FONT_SMALL, color: 'rgba(246,236,210,0.45)' });
    }
  };

  /* ---------- a sign, a banner, a line of dialogue ---------- */
  UI.drawSign = function (ctx, text, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    var lines = CR.Art.wrap(ctx, text, 300, CR.Art.FONT_SMALL);
    var h = 12 + lines.length * 11;
    UI.panel(ctx, CR.VIEW_W / 2 - 168, 30, 336, h);
    for (var i = 0; i < lines.length; i++) {
      CR.Art.text(ctx, lines[i], CR.VIEW_W / 2, 45 + i * 11, {
        align: 'center', font: CR.Art.FONT_SMALL, color: CREAM
      });
    }
    ctx.restore();
  };

  UI.drawBanner = function (ctx, text, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    UI.panel(ctx, CR.VIEW_W / 2 - 160, CR.VIEW_H - 54, 320, 22);
    CR.Art.text(ctx, text, CR.VIEW_W / 2, CR.VIEW_H - 39, {
      align: 'center', font: CR.Art.FONT_SMALL, color: GOLD
    });
    ctx.restore();
  };

  UI.drawDialogue = function (ctx, line) {
    UI.panel(ctx, 20, CR.VIEW_H - 58, CR.VIEW_W - 40, 44, 0.9);
    CR.Art.text(ctx, line[0], 30, CR.VIEW_H - 44, { font: CR.Art.FONT_UI, color: GOLD });
    var lines = CR.Art.wrap(ctx, line[1], CR.VIEW_W - 64, CR.Art.FONT_BODY);
    for (var i = 0; i < lines.length; i++) {
      CR.Art.text(ctx, lines[i], 30, CR.VIEW_H - 31 + i * 11, { font: CR.Art.FONT_BODY, color: CREAM });
    }
    CR.Art.text(ctx, 'SPACE', CR.VIEW_W - 30, CR.VIEW_H - 20,
      { align: 'right', font: CR.Art.FONT_SMALL, color: 'rgba(246,236,210,0.5)' });
  };

  /* ---------- level card, shown for a moment at the start ---------- */
  UI.drawLevelCard = function (ctx, level, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = 'rgba(8,6,10,0.72)';
    ctx.fillRect(0, 0, CR.VIEW_W, CR.VIEW_H);
    CR.Art.text(ctx, level.subtitle.toUpperCase(), CR.VIEW_W / 2, CR.VIEW_H / 2 - 16,
      { align: 'center', font: CR.Art.FONT_SMALL, color: GOLD });
    CR.Art.text(ctx, level.name, CR.VIEW_W / 2, CR.VIEW_H / 2 + 8,
      { align: 'center', font: CR.Art.FONT_SUB, color: CREAM });
    CR.Art.kolam(ctx, CR.VIEW_W / 2, CR.VIEW_H / 2 + 26, 10, 'rgba(232,200,135,0.45)');
    ctx.restore();
  };

  /* ---------- pause ---------- */
  UI.drawPause = function (ctx, game) {
    ctx.fillStyle = 'rgba(8,6,10,0.75)';
    ctx.fillRect(0, 0, CR.VIEW_W, CR.VIEW_H);
    CR.Art.text(ctx, 'PAUSED', CR.VIEW_W / 2, 70, { align: 'center', font: CR.Art.FONT_SUB, color: GOLD });
    var rects = [];
    var y = 100;
    for (var i = 0; i < game.pauseMenu.items.length; i++) {
      rects.push(UI.menuItem(ctx, game.pauseMenu.items[i].label, y, game.pauseMenu.index === i));
      y += 26;
    }
    return rects;
  };

  /* ---------- death ---------- */
  UI.drawGameOver = function (ctx, game, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = 'rgba(30,4,6,0.62)';
    ctx.fillRect(0, 0, CR.VIEW_W, CR.VIEW_H);
    CR.Art.text(ctx, 'AYYO!', CR.VIEW_W / 2, CR.VIEW_H / 2 - 10,
      { align: 'center', font: CR.Art.FONT_SUB, color: '#ff9c8a' });
    CR.Art.text(ctx, game.deathMessage, CR.VIEW_W / 2, CR.VIEW_H / 2 + 10,
      { align: 'center', font: CR.Art.FONT_SMALL, color: CREAM });
    if (alpha > 0.85) {
      CR.Art.text(ctx, CR.Input.mode === 'touch' ? 'tap to try again' : 'SPACE to try again',
        CR.VIEW_W / 2, CR.VIEW_H / 2 + 32, { align: 'center', font: CR.Art.FONT_SMALL, color: 'rgba(246,236,210,0.7)' });
    }
    ctx.restore();
  };

  /* ---------- credits ---------- */
  UI.drawCredits = function (ctx, t) {
    ctx.fillStyle = '#0a0812';
    ctx.fillRect(0, 0, CR.VIEW_W, CR.VIEW_H);
    var dim = 'rgba(246,236,210,0.6)';
    var lines = [
      ['CHOLA RAJA', CR.Art.FONT_SUB, GOLD],
      ['The Rescue of Kundavai', CR.Art.FONT_SMALL, CREAM],
      ['', null, null],
      ['Prince Rajaraja Chola', CR.Art.FONT_SMALL, CREAM],
      ['Princess Kundavai, his sister', CR.Art.FONT_SMALL, CREAM],
      ['King Parantaka Chola, their father', CR.Art.FONT_SMALL, CREAM],
      ['Vimal, who should have known better', CR.Art.FONT_SMALL, CREAM],
      ['', null, null],
      ['Every drawing here is made of maths.', CR.Art.FONT_SMALL, dim],
      ['So is every note of the music.', CR.Art.FONT_SMALL, dim],
      ['Nothing was downloaded to make it.', CR.Art.FONT_SMALL, dim],
      ['', null, null],
      ['Vimal is invented. The Cholas were not.', CR.Art.FONT_SMALL, 'rgba(246,236,210,0.45)']
    ];
    var y = 26;
    for (var i = 0; i < lines.length; i++) {
      if (lines[i][0]) {
        CR.Art.text(ctx, lines[i][0], CR.VIEW_W / 2, y, { align: 'center', font: lines[i][1], color: lines[i][2] });
      }
      y += 12.5;
    }
    CR.Art.kolam(ctx, CR.VIEW_W / 2, y + 8, 11, 'rgba(232,200,135,0.4)');
    CR.Art.text(ctx, 'SPACE to return to the title', CR.VIEW_W / 2, CR.VIEW_H - 8,
      { align: 'center', font: CR.Art.FONT_SMALL, color: GOLD });
  };

  /* ---------- on-screen controls for phones ---------- */
  UI.drawTouch = function (ctx) {
    if (CR.Input.mode !== 'touch') return;
    var L = CR.Input.layout;
    ctx.save();
    ctx.globalAlpha = 0.24;

    // the stick
    ctx.strokeStyle = CREAM; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(L.stick.x, L.stick.y, L.stick.r, 0, Math.PI * 2); ctx.stroke();
    var knobX = L.stick.x, knobY = L.stick.y;
    if (CR.Input._stick) {
      var dx = CR.clamp(CR.Input._stick.x - L.stick.x, -L.stick.r, L.stick.r);
      var dy = CR.clamp(CR.Input._stick.y - L.stick.y, -L.stick.r, L.stick.r);
      knobX += dx; knobY += dy;
      ctx.globalAlpha = 0.42;
    }
    ctx.fillStyle = CREAM;
    ctx.beginPath(); ctx.arc(knobX, knobY, 10, 0, Math.PI * 2); ctx.fill();

    // buttons
    function btn(c, label, held, size) {
      ctx.globalAlpha = held ? 0.55 : 0.24;
      ctx.fillStyle = held ? GOLD : 'rgba(246,236,210,0.22)';
      ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = CREAM; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = held ? 0.95 : 0.7;
      CR.Art.text(ctx, label, c.x, c.y + 2.5, {
        align: 'center', font: size || CR.Art.FONT_SMALL, color: INK, shadow: false
      });
    }
    btn(L.jump, 'JUMP', CR.Input.jump);
    btn(L.attack, 'SWORD', CR.Input.attack);
    btn(L.run, 'RUN', CR.Input.run);
    ctx.restore();
  };

  CR.UI = UI;
})();
</script>
<script>/* ---- js/game.js ---- */
/* ============================================================
   game.js - the conductor.

   It owns the canvas, the main loop, and the "what screen are we on"
   question: title, comic, playing, paused, dead, finished.
   ============================================================ */
(function () {

  var canvas = document.getElementById('screen');
  var ctx = canvas.getContext('2d');

  var game = {
    state: 'title',           // title | controls | intro | card | play | dialogue | paused | dead | clear | ending | credits
    t: 0,
    levelIndex: 0,
    level: null,
    player: null,
    enemies: [],
    boss: null,
    deaths: {},
    assist: false,
    assistNoFallDeath: false,
    muted: false,
    checkpoint: null,
    fade: 0,
    quality: 2
  };

  /* ---------- fitting the game to the screen ----------
     The game is designed in a 480x270 box. We draw it into a canvas
     that is a whole number of times bigger, so it stays crisp on a
     laptop and still fits a phone held sideways. */
  var lastFitW = 0, lastFitH = 0;

  function resize() {
    var winW = window.innerWidth, winH = window.innerHeight;
    // A page that is still hidden can report a size of zero. Sizing the
    // canvas to that would leave it invisible for good, so wait it out -
    // the frame loop below calls us again as soon as there is a real size.
    if (winW < 2 || winH < 2) return;
    lastFitW = winW; lastFitH = winH;

    /* If someone opens this on a phone held upright - or with rotation
       locked - we do not nag them to turn it. We turn the game instead,
       sideways, so it fills the screen and can be played straight away.
       On a narrow desktop window we just letterbox: a keyboard does not
       care which way up the picture is. */
    var portrait = winH > winW;
    var turned = portrait && winW < 600 && CR.Input.isTouchDevice();

    var fitW = turned ? winH : winW;
    var fitH = turned ? winW : winH;

    var scale = Math.min(fitW / CR.VIEW_W, fitH / CR.VIEW_H);
    var cssW = Math.floor(CR.VIEW_W * scale);
    var cssH = Math.floor(CR.VIEW_H * scale);

    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var q = CR.clamp(Math.ceil(scale * dpr), 1, 3);
    game.quality = q;

    canvas.width = CR.VIEW_W * q;
    canvas.height = CR.VIEW_H * q;
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';

    // sit the picture in the middle of the window, turned if we need to be
    var left = Math.round((winW - cssW) / 2);
    var top = Math.round((winH - cssH) / 2);
    canvas.style.position = 'absolute';
    canvas.style.left = left + 'px';
    canvas.style.top = top + 'px';
    canvas.style.transform = turned ? 'rotate(90deg)' : 'none';

    // input.js needs to know all this to work out where a finger landed
    CR.display = {
      turned: turned,
      cssW: cssW, cssH: cssH,
      cx: left + cssW / 2,
      cy: top + cssH / 2
    };

    ctx.setTransform(q, 0, 0, q, 0, 0);
    ctx.imageSmoothingEnabled = true;
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 120); });

  /* ---------- menus ---------- */
  function buildTitleMenu() {
    var save = CR.loadSave();
    var items = [{ label: 'START A NEW GAME', action: 'new' }];
    if (save && save.level > 0) {
      items.push({ label: 'CONTINUE', action: 'continue', hint: 'level ' + (save.level + 1) });
    }
    items.push({ label: 'HOW TO PLAY', action: 'controls' });
    items.push({ label: game.muted ? 'SOUND: OFF' : 'SOUND: ON', action: 'sound' });
    game.menu = { items: items, index: 0, rects: [] };
  }

  game.pauseMenu = {
    index: 0,
    items: [
      { label: 'RESUME', action: 'resume' },
      { label: 'RESTART THIS LEVEL', action: 'restart' },
      { label: 'SOUND ON / OFF', action: 'sound' },
      { label: 'QUIT TO TITLE', action: 'quit' }
    ]
  };

  /* ---------- messages on screen ---------- */
  game.banner = function (text) { game.bannerText = text; game.bannerT = 3.2; };
  game.showSign = function (text) { game.signText = text; game.signT = 4.4; };

  /* ---------- starting and loading ---------- */
  game.startLevel = function (index, fromCheckpoint) {
    game.levelIndex = index;
    var def = CR.LEVELS[index];
    game.level = def;

    CR.World.reset(def);

    var spawn = fromCheckpoint && game.checkpoint ? game.checkpoint : def.spawn;
    game.player = new CR.Player(spawn[0], spawn[1] - 28);
    game.player.maxHearts = def.hearts;
    game.player.hearts = def.hearts;
    game.player.weapon = def.startWeapon;
    if (!fromCheckpoint) game.checkpoint = def.spawn.slice();
    game.player.invuln = 1.0;      // a breath of safety on landing, so you never respawn onto a spike

    // the guards
    game.enemies = [];
    for (var i = 0; i < (def.enemies || []).length; i++) {
      var e = def.enemies[i];
      game.enemies.push(new CR.Enemy(e[0], e[1], e[2], { patrol: e[3] || 0, dropsSword: e[4] || false }));
    }
    game.boss = null;
    if (def.boss) {
      game.boss = new CR.Enemy(def.boss[0], def.boss[1], 'boss', {});
      game.boss.state = 'idle';
      game.boss.asleep = true;      // he only wakes when you reach him
    }

    game.dialogues = (def.dialogue || []).map(function (d) { return { x: d[0], lines: d[1], done: false }; });
    game.activeDialogue = null;
    game.dialogueIndex = 0;
    game.dialogueT = 0;

    // difficulty assist: if this level has already beaten you a few times,
    // the guards get a little slower and you get an extra heart
    var d = game.deaths[def.id] || 0;
    game.assist = d >= 3;
    if (game.assist) {
      game.player.maxHearts = def.hearts + 1;
      game.player.hearts = def.hearts + 1;
    }

    CR.World.updateCamera(0, game.player, true);
    CR.Audio.playMusic(def.music);

    game.state = 'card';
    game.cardT = 2.2;
    game.bannerT = 0; game.signT = 0;
    game.fade = 1;

    CR.writeSave({ level: index, deaths: game.deaths });
  };

  game.onPlayerDied = function (cause) {
    var id = game.level.id;
    game.deaths[id] = (game.deaths[id] || 0) + 1;
    game.deathMessage =
      cause === 'fall' ? 'That was a long way down.' :
      cause === 'spike' ? 'The spikes do not miss.' :
      cause === 'pit' ? 'Gone into the dark.' :
      'The Pandya guard was faster.';
    game.state = 'dead';
    game.deadT = 0;
    CR.writeSave({ level: game.levelIndex, deaths: game.deaths });
  };

  game.onEnemyKilled = function (enemy) {
    if (enemy === game.boss) {
      CR.Audio.playMusic('victory');
      game.banner('VIMAL IS DOWN — free your sister');
      if (CR.World.cage) CR.World.cage.open = false;   // still locked, you must open it
    }
  };

  game.respawn = function () {
    var def = game.level;
    var d = game.deaths[def.id] || 0;
    game.assist = d >= 3;
    game.startLevel(game.levelIndex, true);
    if (game.assist) game.banner('The path softens a little. Take your time.');
  };

  game.nextLevel = function () {
    if (game.levelIndex + 1 < CR.LEVELS.length) {
      game.checkpoint = null;
      game.startLevel(game.levelIndex + 1, false);
    } else {
      game.state = 'ending';
      game.pageIndex = 0;
      game.pageT = 0;
      CR.Audio.playMusic('victory');
    }
  };

  /* ---------- the per-frame update ---------- */
  function update(dt) {
    game.t += dt;
    CR.Audio.update();

    if (game.bannerT > 0) game.bannerT -= dt;
    if (game.signT > 0) game.signT -= dt;
    if (game.fade > 0) game.fade = Math.max(0, game.fade - dt * 1.6);

    var In = CR.Input;

    if (In.mutePressed) toggleSound();

    switch (game.state) {
      case 'title':      updateTitle(dt); break;
      case 'controls':   if (In.confirmPressed || In.pointer.clicked) { game.state = 'title'; } break;
      case 'intro':      updatePages(dt, CR.Story.INTRO, function () { game.startLevel(0, false); }); break;
      case 'ending':     updatePages(dt, CR.Story.ENDING, function () { game.state = 'credits'; }); break;
      case 'credits':    if (In.confirmPressed || In.pointer.clicked) { CR.clearSave(); buildTitleMenu(); game.state = 'title'; CR.Audio.playMusic('menu'); } break;
      case 'card':
        game.cardT -= dt;
        updatePlay(dt, true);
        if (game.cardT <= 0) game.state = 'play';
        break;
      case 'play':       updatePlay(dt, false); break;
      case 'dialogue':   updateDialogue(dt); break;
      case 'paused':     updatePause(dt); break;
      case 'dead':
        game.deadT += dt;
        updatePlay(dt, true);
        if (game.deadT > 1.3 && (In.confirmPressed || In.pointer.clicked)) game.respawn();
        break;
      case 'clear':
        game.clearT -= dt;
        updatePlay(dt, true);
        if (game.clearT <= 0) game.nextLevel();
        break;
    }
  }

  function toggleSound() {
    game.muted = !game.muted;
    CR.Audio.setMuted(game.muted);
    var s = CR.loadSettings();
    s.muted = game.muted;
    CR.writeSettings(s);
    if (game.state === 'title') buildTitleMenu();
  }

  function updateTitle(dt) {
    var In = CR.Input, m = game.menu;

    if (In.upPressed) { m.index = (m.index + m.items.length - 1) % m.items.length; CR.Audio.sfx.menu(); }
    if (In.down && !game._downHeld) { m.index = (m.index + 1) % m.items.length; CR.Audio.sfx.menu(); }
    game._downHeld = In.down;

    var chosen = -1;
    if (In.confirmPressed) chosen = m.index;

    // tapping or clicking a row picks it directly
    if (In.pointer.clicked && m.rects) {
      for (var i = 0; i < m.rects.length; i++) {
        if (CR.pointIn(In.pointer.x, In.pointer.y, m.rects[i])) { chosen = i; m.index = i; }
      }
    }

    if (chosen >= 0) {
      CR.Audio.start();
      CR.Audio.setMuted(game.muted);
      var act = m.items[chosen].action;
      CR.Audio.sfx.menu();
      if (act === 'new') {
        CR.clearSave();
        game.deaths = {};
        game.checkpoint = null;
        game.state = 'intro';
        game.pageIndex = 0; game.pageT = 0;
        CR.Audio.playMusic('intro');
      } else if (act === 'continue') {
        var save = CR.loadSave();
        game.deaths = save.deaths || {};
        game.checkpoint = null;
        game.startLevel(CR.clamp(save.level, 0, CR.LEVELS.length - 1), false);
      } else if (act === 'controls') {
        game.state = 'controls';
      } else if (act === 'sound') {
        toggleSound();
      }
    }
  }

  // used by both the opening comic and the ending comic
  function updatePages(dt, pages, done) {
    game.pageT += dt;
    var In = CR.Input;
    if (game.pageT > 10 || In.confirmPressed || In.attackPressed || In.pointer.clicked) {
      game.pageIndex++;
      game.pageT = 0;
      CR.Audio.sfx.page();
      if (game.pageIndex >= pages.length) done();
    }
  }

  function updatePause(dt) {
    var In = CR.Input, m = game.pauseMenu;
    if (In.upPressed) { m.index = (m.index + m.items.length - 1) % m.items.length; CR.Audio.sfx.menu(); }
    if (In.down && !game._downHeld) { m.index = (m.index + 1) % m.items.length; CR.Audio.sfx.menu(); }
    game._downHeld = In.down;

    var chosen = -1;
    if (In.confirmPressed) chosen = m.index;
    if (In.pointer.clicked && game.pauseRects) {
      for (var i = 0; i < game.pauseRects.length; i++) {
        if (CR.pointIn(In.pointer.x, In.pointer.y, game.pauseRects[i])) { chosen = i; m.index = i; }
      }
    }
    if (In.pausePressed) { game.state = 'play'; return; }

    if (chosen >= 0) {
      var act = m.items[chosen].action;
      CR.Audio.sfx.menu();
      if (act === 'resume') game.state = 'play';
      else if (act === 'restart') { game.checkpoint = null; game.startLevel(game.levelIndex, false); }
      else if (act === 'sound') toggleSound();
      else if (act === 'quit') { buildTitleMenu(); game.state = 'title'; CR.Audio.playMusic('menu'); }
    }
  }

  function updateDialogue(dt) {
    game.dialogueT += dt;
    var In = CR.Input;
    if (game.dialogueT > 0.4 && (In.confirmPressed || In.attackPressed || In.pointer.clicked || game.dialogueT > 4.2)) {
      game.dialogueIndex++;
      game.dialogueT = 0;
      if (game.dialogueIndex >= game.activeDialogue.lines.length) {
        game.activeDialogue = null;
        game.state = 'play';
        if (game.boss) {
          game.boss.asleep = false;
          game.boss.say('VIMAL', 1.2);
          CR.Audio.sfx.roar();
          CR.Audio.playMusic(game.level.bossMusic || 'boss');
        }
      }
    }
    // keep the world breathing behind the text box
    CR.World.update(dt, game.player);
    CR.World.updateCamera(dt, game.player);
  }

  /* ---------- the actual game ---------- */
  function updatePlay(dt, frozen) {
    var In = CR.Input;
    var p = game.player;

    if (!frozen && In.pausePressed) {
      game.state = 'paused';
      game.pauseMenu.index = 0;
      return;
    }

    if (!frozen) p.update(dt, game);
    CR.World.update(dt, p);

    // --- guards ---
    var slots = { taken: 0, max: 3 };
    for (var i = 0; i < game.enemies.length; i++) {
      if (game.enemies[i].engaged && game.enemies[i].state !== 'dead') slots.taken++;
    }
    for (i = 0; i < game.enemies.length; i++) {
      var e = game.enemies[i];
      if (!frozen) e.update(dt, game, p, slots);
      // your blade
      if (!frozen) hitCheck(p, e);
    }
    if (game.boss && !game.boss.asleep) {
      if (!frozen) game.boss.update(dt, game, p, { taken: 0, max: 9 });
      if (!frozen) hitCheck(p, game.boss);
    }

    if (!frozen) {
      breakBarrels(p);
      checkSigns(p);
      checkDialogue(p);
      checkCheckpoints(p);
      checkInteractions(p);
    }

    CR.World.updateCamera(dt, p, false);
  }

  function hitCheck(p, e) {
    if (e.state === 'dead') return;
    var ab = p.attackBox();
    if (!ab || p.attackHit) return;
    if (CR.overlap(ab, e.box())) {
      p.attackHit = true;
      // a guard who is already swinging parries nothing - but one you catch
      // mid wind-up gets the full hit
      e.takeHit(p.damage(), p.centerX(), game);
      CR.Audio.sfx.clang();
    }
  }

  function breakBarrels(p) {
    var ab = p.attackBox();
    for (var i = 0; i < CR.World.barrels.length; i++) {
      var b = CR.World.barrels[i];
      if (b.broken) continue;
      var br = CR.rect(b.x, b.y, 14, 18);
      var smashed = (ab && CR.overlap(ab, br));
      // landing on top of one also does the job
      if (!smashed && p.vy > 180 && CR.overlap(CR.rect(p.x, p.y + p.h - 2, p.w, 6), br)) smashed = true;
      if (smashed) {
        b.broken = 1;
        CR.Audio.sfx.barrel();
        CR.World.puff(b.x + 7, b.y + 8, 12, '#7a5230', 130);
        p.attackHit = true;
      }
    }
  }

  function checkSigns(p) {
    for (var i = 0; i < CR.World.signs.length; i++) {
      var s = CR.World.signs[i];
      if (s.shown) continue;
      if (Math.abs(p.centerX() - s.x) < 46) { s.shown = true; game.showSign(s.text); }
    }
  }

  function checkDialogue(p) {
    for (var i = 0; i < game.dialogues.length; i++) {
      var d = game.dialogues[i];
      if (d.done) continue;
      if (p.centerX() > d.x) {
        d.done = true;
        game.activeDialogue = d;
        game.dialogueIndex = 0;
        game.dialogueT = 0;
        game.state = 'dialogue';
        return;
      }
    }
  }

  function checkCheckpoints(p) {
    for (var i = 0; i < CR.World.checkpoints.length; i++) {
      var c = CR.World.checkpoints[i];
      if (p.centerX() > c[0] && (!game.checkpoint || c[0] > game.checkpoint[0])) {
        game.checkpoint = [c[0], c[1]];
      }
    }
  }

  /* Pressing UP: pull a lever, open the door, unlock the cage. */
  function checkInteractions(p) {
    var W = CR.World;
    var i;

    for (i = 0; i < W.levers.length; i++) {
      var lv = W.levers[i];
      if (Math.abs(p.centerX() - lv.x) < 14 && Math.abs(p.centerY() - lv.y) < 24) {
        if (CR.Input.upPressed) {
          var g = W.gates[lv.gate];
          if (g) { g.timer = lv.secs; CR.Audio.sfx.lever(); CR.Audio.sfx.gate(); game.banner('The gate is up. GO.'); }
        }
      }
    }

    if (W.exit) {
      W.exit.open = true;
      if (Math.abs(p.centerX() - (W.exit.x + 11)) < 16 && Math.abs((p.y + p.h) - W.exit.y) < 22) {
        if (CR.Input.upPressed) {
          game.state = 'clear';
          game.clearT = 1.8;
          game.checkpoint = null;
          CR.Audio.sfx.gate();
          CR.writeSave({ level: Math.min(game.levelIndex + 1, CR.LEVELS.length - 1), deaths: game.deaths });
        }
      }
    }

    if (W.cage && game.boss && game.boss.state === 'dead' && !W.cage.open) {
      if (Math.abs(p.centerX() - (W.cage.x + 16)) < 22 && Math.abs((p.y + p.h) - W.cage.y) < 26) {
        if (CR.Input.upPressed) {
          W.cage.open = true;
          CR.Audio.sfx.pickup();
          CR.Audio.sfx.cheer();
          game.banner('KUNDAVAI IS FREE');
          game.state = 'clear';
          game.clearT = 2.6;
        }
      }
    }

    // the boss wakes up if you walk into his hall without the conversation
    if (game.boss && game.boss.asleep && p.centerX() > game.boss.centerX() - 150) {
      game.boss.asleep = false;
      CR.Audio.playMusic(game.level.bossMusic || 'boss');
    }
  }

  /* ---------- drawing ---------- */
  function draw() {
    ctx.clearRect(0, 0, CR.VIEW_W, CR.VIEW_H);

    if (game.state === 'title') {
      game.menu.rects = CR.UI.drawTitle(ctx, game, game.t);
      drawFade();
      return;
    }
    if (game.state === 'controls') { CR.UI.drawControls(ctx, game); return; }
    if (game.state === 'intro') {
      CR.Story.drawPage(ctx, CR.Story.INTRO[Math.min(game.pageIndex, CR.Story.INTRO.length - 1)], game.t, CR.clamp(game.pageT / 10, 0, 1));
      return;
    }
    if (game.state === 'ending') {
      CR.Story.drawPage(ctx, CR.Story.ENDING[Math.min(game.pageIndex, CR.Story.ENDING.length - 1)], game.t, CR.clamp(game.pageT / 10, 0, 1));
      return;
    }
    if (game.state === 'credits') { CR.UI.drawCredits(ctx, game.t); return; }

    // --- the world ---
    var cam = CR.World.camOffset();
    CR.World.drawBack(ctx, cam);
    CR.World.drawTerrain(ctx, cam);
    CR.World.drawProps(ctx, cam, game.t);

    for (var i = 0; i < game.enemies.length; i++) {
      var e = game.enemies[i];
      if (e.x + 40 < cam.x || e.x - 40 > cam.x + CR.VIEW_W) continue;
      e.draw(ctx, cam);
    }
    if (game.boss) game.boss.draw(ctx, cam);
    game.player.draw(ctx, cam);

    CR.World.drawAtmosphere(ctx, cam);

    // --- the layer on top ---
    CR.UI.drawHUD(ctx, game);
    CR.UI.drawTouch(ctx);

    if (game.signT > 0) CR.UI.drawSign(ctx, game.signText, CR.clamp(game.signT, 0, 1));
    if (game.bannerT > 0) CR.UI.drawBanner(ctx, game.bannerText, CR.clamp(game.bannerT, 0, 1));

    if (game.state === 'card') CR.UI.drawLevelCard(ctx, game.level, CR.clamp(game.cardT / 1.2, 0, 1));
    if (game.state === 'dialogue' && game.activeDialogue) {
      CR.UI.drawDialogue(ctx, game.activeDialogue.lines[Math.min(game.dialogueIndex, game.activeDialogue.lines.length - 1)]);
    }
    if (game.state === 'dead') CR.UI.drawGameOver(ctx, game, CR.clamp(game.deadT, 0, 1));
    if (game.state === 'paused') game.pauseRects = CR.UI.drawPause(ctx, game);
    if (game.state === 'clear') {
      ctx.fillStyle = 'rgba(6,5,10,' + CR.clamp(1 - game.clearT / 1.8, 0, 1) * 0.9 + ')';
      ctx.fillRect(0, 0, CR.VIEW_W, CR.VIEW_H);
      CR.Art.text(ctx, 'LEVEL CLEAR', CR.VIEW_W / 2, CR.VIEW_H / 2,
        { align: 'center', font: CR.Art.FONT_SUB, color: '#ffe9a8' });
    }
    drawFade();
  }

  function drawFade() {
    if (game.fade <= 0) return;
    ctx.fillStyle = 'rgba(0,0,0,' + game.fade + ')';
    ctx.fillRect(0, 0, CR.VIEW_W, CR.VIEW_H);
  }

  /* ---------- the loop ---------- */
  var last = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    if (!last) last = now;
    var dt = (now - last) / 1000;
    last = now;
    if (dt > 0.05) dt = 0.05;      // after a stall, take one small step, not one huge one

    // catch the window changing shape, including the very first moment the
    // page becomes visible and finally has a size to fit ourselves to
    if (window.innerWidth !== lastFitW || window.innerHeight !== lastFitH) resize();

    CR.Input.poll();
    update(dt);
    draw();
    CR.Input.endFrame();
  }

  /* ---------- boot ---------- */
  function boot() {
    var settings = CR.loadSettings();
    game.muted = settings.muted;

    CR.Input.init(canvas);
    resize();

    game.titleBackdrop = CR.Art.buildBackdrop('grove', 4242);
    buildTitleMenu();
    game.deathMessage = '';
    game.bannerText = ''; game.bannerT = 0;
    game.signText = ''; game.signT = 0;

    // the first click or key press is what lets the browser make sound
    function wake() {
      CR.Audio.start();
      CR.Audio.setMuted(game.muted);
      CR.Audio.playMusic('menu');
      window.removeEventListener('pointerdown', wake);
      window.removeEventListener('keydown', wake);
    }
    window.addEventListener('pointerdown', wake);
    window.addEventListener('keydown', wake);

    requestAnimationFrame(frame);
  }

  /* One frame, on demand. Only used while testing the game from the
     outside - the real game is driven by requestAnimationFrame above. */
  game.step = function (dt) {
    CR.Input.poll();
    update(dt || 1 / 60);
    draw();
    CR.Input.endFrame();
  };

  CR.game = game;
  boot();
})();
</script>
