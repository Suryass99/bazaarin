<title>Chola Raja - The Rescue of Kundavai</title>
<style>
/* The page itself is just a black frame. All the art happens on the canvas. */
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  background: #05070a;
  overflow: hidden;
  touch-action: none;          /* stop the phone scrolling while you play */
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

#stage {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

#screen {
  /* The art is drawn as shapes rather than pixels, so it stays sharp at
     any size and the browser is welcome to smooth it. game.js positions
     and sizes this, and turns it sideways on an upright phone. */
  display: block;
  background: #000;
  cursor: default;
  transform-origin: center center;
}
</style>

<div id="stage">
  <canvas id="screen" width="400" height="225"></canvas>
</div>

<script>/* ---- js/util.js ---- */
/* ============================================================
   util.js - small helpers every other file uses.
   CR is our single global object ("Chola Raja"). Every file hangs
   its stuff off CR so we never pollute the page with 50 globals.
   ============================================================ */
window.CR = window.CR || {};

CR.VIEW_W = 400;   // the game is drawn in a 400x225 box and then scaled up.
CR.VIEW_H = 225;   // small numbers = old-school chunky look + fast on phones.

/* --- numbers ------------------------------------------------ */

// keep a number inside a range: clamp(5, 0, 3) -> 3
CR.clamp = function (v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); };

// blend from a to b. t=0 gives a, t=1 gives b, 0.5 gives halfway.
CR.lerp = function (a, b, t) { return a + (b - a) * t; };

// move "a" towards "b" but never by more than "step" (no overshooting).
CR.approach = function (a, b, step) {
  if (a < b) return Math.min(a + step, b);
  return Math.max(a - step, b);
};

CR.sign = function (v) { return v < 0 ? -1 : (v > 0 ? 1 : 0); };

/* A seeded random number generator.
   Normal Math.random() gives different results every reload, which would make
   the scenery jump around. Seeding it means "random but always the same". */
CR.rng = function (seed) {
  var s = seed >>> 0 || 1;
  return function () {
    // xorshift32 - a classic tiny random generator
    s ^= s << 13; s >>>= 0;
    s ^= s >> 17;
    s ^= s << 5;  s >>>= 0;
    return s / 4294967296;
  };
};

/* --- rectangles ---------------------------------------------
   Everything solid in this game is a rectangle: {x, y, w, h}.
   x,y is the TOP-LEFT corner. y grows downwards (screen style). */

CR.rect = function (x, y, w, h) { return { x: x, y: y, w: w, h: h }; };

// do two rectangles overlap at all?
CR.overlap = function (a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x &&
         a.y < b.y + b.h && a.y + a.h > b.y;
};

// is a point inside a rectangle?
CR.pointIn = function (px, py, r) {
  return px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h;
};

// straight-line distance between two points
CR.dist = function (ax, ay, bx, by) {
  var dx = bx - ax, dy = by - ay;
  return Math.sqrt(dx * dx + dy * dy);
};

/* --- timing -------------------------------------------------
   A Timer counts down in seconds. Handy for "invulnerable for 1.2s",
   "attack lasts 0.14s" and so on. */
CR.Timer = function () {
  return {
    t: 0,
    set: function (secs) { this.t = secs; },
    tick: function (dt) { if (this.t > 0) { this.t -= dt; if (this.t < 0) this.t = 0; } },
    get active() { return this.t > 0; }
  };
};

/* --- saving -------------------------------------------------
   The save file is one small blob in the browser's localStorage.
   No server, no account, nothing leaves the device. */
CR.SAVE_KEY = 'cholaraja.save.v1';

CR.loadSave = function () {
  try {
    var raw = localStorage.getItem(CR.SAVE_KEY);
    if (!raw) return null;
    var s = JSON.parse(raw);
    if (typeof s.level !== 'number') return null;
    return s;
  } catch (e) { return null; }
};

CR.writeSave = function (data) {
  try { localStorage.setItem(CR.SAVE_KEY, JSON.stringify(data)); } catch (e) {}
};

CR.clearSave = function () {
  try { localStorage.removeItem(CR.SAVE_KEY); } catch (e) {}
};

/* --- settings (mute, control scheme) ------------------------ */
CR.SETTINGS_KEY = 'cholaraja.settings.v1';

CR.loadSettings = function () {
  try {
    var s = JSON.parse(localStorage.getItem(CR.SETTINGS_KEY) || '{}');
    return { muted: !!s.muted, scheme: s.scheme || 'auto' };
  } catch (e) { return { muted: false, scheme: 'auto' }; }
};

CR.writeSettings = function (s) {
  try { localStorage.setItem(CR.SETTINGS_KEY, JSON.stringify(s)); } catch (e) {}
};
</script>
<script>/* ---- js/input.js ---- */
/* ============================================================
   input.js - keyboard, mouse and touch, boiled down to a handful
   of true/false flags the rest of the game can read.

   Keyboard:  Arrows / WASD move, Space jump, Shift run,
              Z (or J / Ctrl / F) attack, Esc or P pause, M mute.
   Touch:     joystick bottom-left, JUMP and SWORD buttons bottom-right.
   ============================================================ */
(function () {
  var I = {
    // held-down state, read freely every frame
    left: false, right: false, up: false, down: false,
    jump: false, run: false, attack: false,

    // "was it pressed THIS frame" - true for exactly one frame
    jumpPressed: false, attackPressed: false, upPressed: false,
    pausePressed: false, anyPressed: false, mutePressed: false,

    mode: 'key',            // 'key' or 'touch' - whichever was used last
    pointer: { x: 0, y: 0, down: false, clicked: false },
    touches: [],            // live touch points, in 480x270 game coordinates

    _prev: {}, _keys: {}, _canvas: null,
    _stick: null            // active joystick touch, if any
  };

  // Which physical keys map to which game action.
  var KEYMAP = {
    ArrowLeft: 'left', KeyA: 'left',
    ArrowRight: 'right', KeyD: 'right',
    ArrowUp: 'up', KeyW: 'up',
    ArrowDown: 'down', KeyS: 'down',
    Space: 'jump',
    ShiftLeft: 'run', ShiftRight: 'run',
    KeyZ: 'attack', KeyJ: 'attack', ControlLeft: 'attack', KeyF: 'attack',
    Enter: 'confirm', NumpadEnter: 'confirm',
    Escape: 'pause', KeyP: 'pause',
    KeyM: 'mute'
  };

  /* Turn a real browser pixel position into a position inside our
     480x270 game picture, so a tap on a button lands where it looks. */
  I.toGame = function (clientX, clientY) {
    var d = CR.display;
    if (d && d.turned) {
      /* The picture is rotated a quarter turn, so a finger has to be
         rotated back the same amount before we can say where it landed.
         A quarter turn clockwise sends (u,v) to (-v,u), so going back
         from the screen: u = dy, v = -dx. */
      var dx = clientX - d.cx, dy = clientY - d.cy;
      return {
        x: (dy + d.cssW / 2) / d.cssW * CR.VIEW_W,
        y: (-dx + d.cssH / 2) / d.cssH * CR.VIEW_H
      };
    }
    var r = I._canvas.getBoundingClientRect();
    return {
      x: (clientX - r.left) / r.width * CR.VIEW_W,
      y: (clientY - r.top) / r.height * CR.VIEW_H
    };
  };

  /* --- on-screen touch button layout (also used by ui.js to draw them) --- */
  /* Everything is tucked into the two bottom corners, well clear of the
     middle of the screen where the fighting happens. */
  I.layout = {
    stick:  { x: 44, y: CR.VIEW_H - 43, r: 28 },   // joystick home position + radius
    jump:   { x: CR.VIEW_W - 34, y: CR.VIEW_H - 29, r: 21 },
    attack: { x: CR.VIEW_W - 82, y: CR.VIEW_H - 47, r: 21 },
    run:    { x: CR.VIEW_W - 28, y: CR.VIEW_H - 77, r: 15 }
  };

  function inCircle(p, c, pad) {
    var dx = p.x - c.x, dy = p.y - c.y;
    return dx * dx + dy * dy <= (c.r + (pad || 10)) * (c.r + (pad || 10));
  }

  I.init = function (canvas) {
    I._canvas = canvas;

    /* ---------- keyboard ---------- */
    window.addEventListener('keydown', function (e) {
      var act = KEYMAP[e.code];
      // stop the page scrolling when arrows or space are used
      if (act || e.code === 'Space') e.preventDefault();
      if (!act) return;
      I.mode = 'key';
      I._keys[act] = true;
    });

    window.addEventListener('keyup', function (e) {
      var act = KEYMAP[e.code];
      if (act) I._keys[act] = false;
    });

    // if the player alt-tabs away, drop every key so we don't run forever
    window.addEventListener('blur', function () { I._keys = {}; I._stick = null; I.touches = []; });

    /* ---------- mouse (menus only) ---------- */
    canvas.addEventListener('mousemove', function (e) {
      var p = I.toGame(e.clientX, e.clientY);
      I.pointer.x = p.x; I.pointer.y = p.y;
    });
    canvas.addEventListener('mousedown', function (e) {
      var p = I.toGame(e.clientX, e.clientY);
      I.pointer.x = p.x; I.pointer.y = p.y;
      I.pointer.down = true; I.pointer.clicked = true;
      I.mode = 'key';
    });
    window.addEventListener('mouseup', function () { I.pointer.down = false; });

    /* ---------- touch ---------- */
    function readTouches(e) {
      I.mode = 'touch';
      I.touches = [];
      for (var i = 0; i < e.touches.length; i++) {
        var t = e.touches[i];
        var p = I.toGame(t.clientX, t.clientY);
        p.id = t.identifier;
        I.touches.push(p);
      }
    }

    canvas.addEventListener('touchstart', function (e) {
      e.preventDefault();
      readTouches(e);
      // a fresh touch also counts as a menu click, wherever it landed
      if (I.touches.length) {
        I.pointer.x = I.touches[I.touches.length - 1].x;
        I.pointer.y = I.touches[I.touches.length - 1].y;
        I.pointer.clicked = true;
        I.pointer.down = true;
      }
    }, { passive: false });

    canvas.addEventListener('touchmove', function (e) { e.preventDefault(); readTouches(e); }, { passive: false });
    canvas.addEventListener('touchend', function (e) { e.preventDefault(); readTouches(e); I.pointer.down = I.touches.length > 0; }, { passive: false });
    canvas.addEventListener('touchcancel', function (e) { e.preventDefault(); readTouches(e); I.pointer.down = false; }, { passive: false });
  };

  /* Called once at the top of every frame: turns raw keys and touches
     into the tidy flags above, and works out what was newly pressed. */
  I.poll = function () {
    var prev = I._prev;
    var s = { left: false, right: false, up: false, down: false, jump: false, run: false, attack: false, pause: false, mute: false, confirm: false };

    // keyboard contribution
    for (var k in I._keys) if (I._keys[k]) s[k] = true;

    // touch contribution
    if (I.mode === 'touch') {
      var L = I.layout, stick = null;
      for (var i = 0; i < I.touches.length; i++) {
        var t = I.touches[i];
        if (t.x < CR.VIEW_W * 0.5) {
          // left half of the screen drives the joystick
          if (!stick) stick = t;
        } else if (inCircle(t, L.jump)) {
          s.jump = true;
        } else if (inCircle(t, L.attack)) {
          s.attack = true;
        } else if (inCircle(t, L.run)) {
          s.run = true;
        } else {
          // any other tap on the right half swings the sword
          s.attack = true;
        }
      }
      I._stick = stick;
      if (stick) {
        var dx = stick.x - L.stick.x, dy = stick.y - L.stick.y;
        var dead = 8;
        if (dx < -dead) s.left = true;
        if (dx > dead) s.right = true;
        if (dy < -dead * 1.4) { s.up = true; s.jump = true; }   // push up = jump
        if (dy > dead * 1.4) s.down = true;                     // pull down = crawl
        if (Math.abs(dx) > 22) s.run = true;                    // push far = run
      }
    }

    I.left = s.left; I.right = s.right; I.up = s.up; I.down = s.down;
    I.jump = s.jump; I.run = s.run; I.attack = s.attack;

    I.jumpPressed   = s.jump    && !prev.jump;
    I.attackPressed = s.attack  && !prev.attack;
    I.upPressed     = s.up      && !prev.up;
    I.pausePressed  = s.pause   && !prev.pause;
    I.mutePressed   = s.mute    && !prev.mute;
    I.confirmPressed = (s.confirm && !prev.confirm) || (s.jump && !prev.jump);
    I.anyPressed = I.confirmPressed || I.attackPressed || I.pointer.clicked;

    I._prev = s;
  };

  // Called at the END of a frame - clears one-shot flags like clicks.
  I.endFrame = function () { I.pointer.clicked = false; };

  // True when the device is a touch device (used to pick default controls).
  I.isTouchDevice = function () {
    return ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
  };

  CR.Input = I;
})();
</script>
<script>/* ---- js/audio.js ---- */
/* ============================================================
   audio.js - every sound in this game is generated by maths.

   There are no .mp3 or .wav files anywhere. The browser's Web Audio
   API lets us build tones from scratch, so the whole soundtrack costs
   zero download and can never hit a copyright problem.

   The music uses Mayamalavagowla, a very old South Indian raga - that
   is the scale that makes it sound Tamil rather than generic fantasy.
   ============================================================ */
(function () {
  var A = {
    ctx: null,
    master: null,
    musicGain: null,
    sfxGain: null,
    muted: false,
    ready: false
  };

  // Semitone steps of the notes we are allowed to use.
  var RAGA_MAYAMALAVAGOWLA = [0, 1, 4, 5, 7, 8, 11, 12];  // solemn, ancient, a little tense
  var RAGA_MOHANAM         = [0, 2, 4, 7, 9, 12, 14, 16]; // bright and happy - used for the ending

  // Turn "note number in the scale" into an actual frequency in Hz.
  function noteHz(scale, degree, octave, root) {
    var n = scale[((degree % scale.length) + scale.length) % scale.length];
    var extra = Math.floor(degree / scale.length) * 12;
    return (root || 146.83) * Math.pow(2, (n + extra + (octave || 0) * 12) / 12);
  }

  /* The audio engine is only allowed to start after the player has
     touched or clicked something - every browser insists on this. */
  A.start = function () {
    if (A.ctx) { if (A.ctx.state === 'suspended') A.ctx.resume(); return; }
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    A.ctx = new Ctx();

    A.master = A.ctx.createGain();
    A.master.gain.value = A.muted ? 0 : 0.9;
    A.master.connect(A.ctx.destination);

    A.musicGain = A.ctx.createGain();
    A.musicGain.gain.value = 0.34;
    A.musicGain.connect(A.master);

    A.sfxGain = A.ctx.createGain();
    A.sfxGain.gain.value = 0.55;
    A.sfxGain.connect(A.master);

    A.ready = true;
  };

  A.setMuted = function (m) {
    A.muted = m;
    if (A.master) A.master.gain.setTargetAtTime(m ? 0 : 0.9, A.ctx.currentTime, 0.05);
  };

  /* ---------- tiny building blocks ---------- */

  // one plain tone with a volume envelope
  function tone(opts) {
    if (!A.ready) return;
    var t = A.ctx.currentTime + (opts.delay || 0);
    var osc = A.ctx.createOscillator();
    var g = A.ctx.createGain();
    osc.type = opts.type || 'sine';
    osc.frequency.setValueAtTime(opts.f0, t);
    if (opts.f1) osc.frequency.exponentialRampToValueAtTime(Math.max(20, opts.f1), t + opts.dur);

    var peak = opts.gain === undefined ? 0.3 : opts.gain;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + (opts.attack || 0.005));
    g.gain.exponentialRampToValueAtTime(0.0001, t + opts.dur);

    var out = g;
    if (opts.filter) {
      var f = A.ctx.createBiquadFilter();
      f.type = opts.filter;
      f.frequency.value = opts.cutoff || 1200;
      f.Q.value = opts.q || 1;
      g.connect(f); out = f;
    }
    osc.connect(g);
    out.connect(opts.bus || A.sfxGain);
    osc.start(t);
    osc.stop(t + opts.dur + 0.05);
  }

  // a burst of hiss - used for sand, cloth, breaking wood, cymbals
  function noise(opts) {
    if (!A.ready) return;
    var t = A.ctx.currentTime + (opts.delay || 0);
    var len = Math.max(0.02, opts.dur);
    var buf = A.ctx.createBuffer(1, Math.ceil(A.ctx.sampleRate * len), A.ctx.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

    var src = A.ctx.createBufferSource();
    src.buffer = buf;

    var f = A.ctx.createBiquadFilter();
    f.type = opts.filter || 'bandpass';
    f.frequency.setValueAtTime(opts.cutoff || 1400, t);
    if (opts.cutoff1) f.frequency.exponentialRampToValueAtTime(opts.cutoff1, t + len);
    f.Q.value = opts.q || 1;

    var g = A.ctx.createGain();
    g.gain.setValueAtTime(opts.gain === undefined ? 0.3 : opts.gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + len);

    src.connect(f); f.connect(g); g.connect(opts.bus || A.sfxGain);
    src.start(t); src.stop(t + len + 0.02);
  }

  /* A cartoon voice. Two "formant" filters on a buzzy tone is roughly how
     a human vowel is shaped, so this reads as a shouted word rather than a beep. */
  var VOWELS = { a: [730, 1090], o: [570, 840], i: [270, 2290], e: [530, 1840], u: [300, 870] };

  function say(syllables, baseHz, opts) {
    if (!A.ready) return;
    opts = opts || {};
    var time = A.ctx.currentTime + (opts.delay || 0);
    for (var i = 0; i < syllables.length; i++) {
      var syl = syllables[i];
      var form = VOWELS[syl.v] || VOWELS.a;
      var dur = syl.d || 0.16;

      var osc = A.ctx.createOscillator();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(baseHz * (syl.p || 1), time);
      osc.frequency.linearRampToValueAtTime(baseHz * (syl.p2 || syl.p || 1), time + dur);

      var g = A.ctx.createGain();
      var vol = 0.5 * (opts.gain || 1);
      g.gain.setValueAtTime(0.0001, time);
      g.gain.exponentialRampToValueAtTime(vol, time + 0.03);
      g.gain.setValueAtTime(vol, time + dur * 0.6);
      g.gain.exponentialRampToValueAtTime(0.0001, time + dur);

      var f1 = A.ctx.createBiquadFilter();
      f1.type = 'bandpass'; f1.frequency.value = form[0]; f1.Q.value = 6;
      var f2 = A.ctx.createBiquadFilter();
      f2.type = 'bandpass'; f2.frequency.value = form[1]; f2.Q.value = 8;

      var mix = A.ctx.createGain(); mix.gain.value = 0.9;
      osc.connect(g);
      g.connect(f1); g.connect(f2);
      f1.connect(mix); f2.connect(mix);
      mix.connect(A.sfxGain);

      osc.start(time); osc.stop(time + dur + 0.03);
      time += dur * 0.92;
    }
  }

  /* ---------- sound effects ---------- */
  A.sfx = {
    jump:     function () { tone({ type: 'triangle', f0: 300, f1: 520, dur: 0.12, gain: 0.16 }); },
    land:     function () { noise({ cutoff: 320, cutoff1: 120, dur: 0.09, gain: 0.22, filter: 'lowpass' }); },
    step:     function () { noise({ cutoff: 900, dur: 0.045, gain: 0.05 }); },
    swing:    function () { noise({ cutoff: 2600, cutoff1: 700, dur: 0.14, gain: 0.2, q: 0.8 }); },
    clang:    function () { tone({ type: 'square', f0: 1750, f1: 900, dur: 0.22, gain: 0.16, filter: 'bandpass', cutoff: 2400, q: 4 });
                            noise({ cutoff: 3200, dur: 0.18, gain: 0.12 }); },
    hitFlesh: function () { tone({ type: 'sine', f0: 180, f1: 60, dur: 0.16, gain: 0.3 });
                            noise({ cutoff: 700, dur: 0.1, gain: 0.18, filter: 'lowpass' }); },
    barrel:   function () { noise({ cutoff: 1500, cutoff1: 260, dur: 0.3, gain: 0.32, filter: 'lowpass' });
                            tone({ type: 'square', f0: 220, f1: 70, dur: 0.2, gain: 0.12 }); },
    spike:    function () { tone({ type: 'sawtooth', f0: 900, f1: 200, dur: 0.13, gain: 0.14, filter: 'lowpass', cutoff: 1800 }); },
    gate:     function () { tone({ type: 'sawtooth', f0: 90, f1: 150, dur: 0.7, gain: 0.14, filter: 'lowpass', cutoff: 500 });
                            noise({ cutoff: 400, dur: 0.7, gain: 0.1, filter: 'lowpass' }); },
    lever:    function () { tone({ type: 'square', f0: 520, f1: 320, dur: 0.1, gain: 0.14 }); },
    pickup:   function () { tone({ type: 'triangle', f0: 660, dur: 0.1, gain: 0.2 });
                            tone({ type: 'triangle', f0: 990, dur: 0.16, gain: 0.18, delay: 0.08 }); },
    heart:    function () { tone({ type: 'sine', f0: 520, dur: 0.12, gain: 0.2 });
                            tone({ type: 'sine', f0: 780, dur: 0.2, gain: 0.16, delay: 0.1 }); },
    hurt:     function () { say([{ v: 'a', d: 0.14, p: 1.15, p2: 0.9 }], 210, { gain: 0.8 });
                            tone({ type: 'sawtooth', f0: 260, f1: 120, dur: 0.14, gain: 0.1 }); },
    // "Ayyo!" - what you shout in Tamil when things go wrong.
    ayyo:     function () { say([{ v: 'a', d: 0.16, p: 1.25, p2: 1.1 }, { v: 'o', d: 0.34, p: 1.0, p2: 0.55 }], 200, { gain: 1 }); },
    // A guard spotting you - "Yaar angae?!" (who is there?!)
    alert:    function () { say([{ v: 'a', d: 0.13, p: 0.95, p2: 1.15 }, { v: 'a', d: 0.12, p: 1.2 }, { v: 'e', d: 0.2, p: 1.35, p2: 1.5 }], 150, { gain: 0.9 }); },
    guardDie: function () { say([{ v: 'u', d: 0.2, p: 1.0, p2: 0.4 }], 140, { gain: 0.8 }); },
    roar:     function () { say([{ v: 'o', d: 0.5, p: 0.55, p2: 0.35 }], 90, { gain: 1.2 });
                            noise({ cutoff: 220, dur: 0.6, gain: 0.2, filter: 'lowpass' }); },
    slam:     function () { tone({ type: 'sine', f0: 120, f1: 35, dur: 0.4, gain: 0.5 });
                            noise({ cutoff: 260, dur: 0.35, gain: 0.3, filter: 'lowpass' }); },
    page:     function () { noise({ cutoff: 2400, cutoff1: 900, dur: 0.16, gain: 0.12 }); },
    menu:     function () { tone({ type: 'triangle', f0: 440, dur: 0.07, gain: 0.15 }); },
    cheer:    function () { for (var i = 0; i < 7; i++) noise({ cutoff: 900 + Math.random() * 1400, dur: 0.5, gain: 0.06, delay: i * 0.06 }); }
  };

  /* ---------- the music sequencer ----------
     Every frame we look a fraction of a second into the future and book
     the notes that are about to happen. That keeps the rhythm rock steady
     even if the drawing stutters. */
  var music = {
    on: false,
    name: null,
    pending: null,
    track: null,
    step: 0,
    nextAt: 0,
    tempo: 0.5,
    drone: null,
    droneGain: null
  };

  // Each track: which scale, how fast, what the drums do, and the melody line.
  var TRACKS = {
    intro:   { scale: RAGA_MAYAMALAVAGOWLA, root: 130.81, tempo: 0.42, mel: [0, 2, 1, 0, -1, 0, 2, 3, 2, 1, 0, -2, 0, 1, 0, -1], drums: 0.22, lead: 0.16 },
    menu:    { scale: RAGA_MAYAMALAVAGOWLA, root: 146.83, tempo: 0.46, mel: [0, 2, 1, 4, 2, 1, 0, -1, 0, 2, 4, 3, 2, 1, 0, 0], drums: 0.12, lead: 0.13 },
    level1:  { scale: RAGA_MAYAMALAVAGOWLA, root: 146.83, tempo: 0.38, mel: [0, 2, 4, 2, 3, 1, 0, 2, 4, 5, 4, 2, 1, 0, -1, 0], drums: 0.30, lead: 0.14 },
    level2:  { scale: RAGA_MAYAMALAVAGOWLA, root: 146.83, tempo: 0.30, mel: [0, 4, 3, 4, 5, 4, 2, 4, 6, 5, 4, 2, 3, 1, 0, 2], drums: 0.42, lead: 0.16 },
    level3:  { scale: RAGA_MAYAMALAVAGOWLA, root: 130.81, tempo: 0.23, mel: [0, 1, 4, 1, 5, 4, 1, 0, 3, 4, 6, 4, 3, 1, 0, -1], drums: 0.55, lead: 0.20 },
    boss:    { scale: RAGA_MAYAMALAVAGOWLA, root: 110.00, tempo: 0.19, mel: [0, 0, 1, 0, 4, 3, 1, 0, 0, 1, 5, 4, 3, 1, 0, 0], drums: 0.70, lead: 0.22 },
    victory: { scale: RAGA_MOHANAM, root: 174.61, tempo: 0.26, mel: [0, 1, 2, 3, 4, 3, 2, 4, 5, 4, 3, 2, 1, 2, 3, 4], drums: 0.50, lead: 0.20 }
  };

  function startDrone(root) {
    stopDrone();
    if (!A.ready) return;
    var g = A.ctx.createGain();
    g.gain.value = 0.0001;
    g.gain.setTargetAtTime(0.09, A.ctx.currentTime, 0.6);

    var lp = A.ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 700;

    var oscs = [];
    // the tanpura idea: the root note, the fifth above it, and the octave
    var parts = [[root / 2, 1], [root * 1.4983, 0.55], [root, 0.5]];
    for (var i = 0; i < parts.length; i++) {
      var o = A.ctx.createOscillator();
      o.type = 'sawtooth';
      o.frequency.value = parts[i][0];
      o.detune.value = Math.random() * 8 - 4;
      var og = A.ctx.createGain();
      og.gain.value = 0.12 * parts[i][1];
      o.connect(og); og.connect(lp);
      o.start();
      oscs.push(o);
    }
    lp.connect(g); g.connect(A.musicGain);
    music.drone = oscs; music.droneGain = g;
  }

  function stopDrone() {
    if (!music.drone) return;
    var list = music.drone;
    music.droneGain.gain.setTargetAtTime(0.0001, A.ctx.currentTime, 0.25);
    setTimeout(function () {
      for (var i = 0; i < list.length; i++) { try { list[i].stop(); } catch (e) {} }
    }, 900);
    music.drone = null; music.droneGain = null;
  }

  // mridangam-ish drum: "tha" is a pitched thump, "ki" is a dry tick
  function drumTha(at, vol) {
    var o = A.ctx.createOscillator(), g = A.ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(190, at);
    o.frequency.exponentialRampToValueAtTime(70, at + 0.16);
    g.gain.setValueAtTime(vol, at);
    g.gain.exponentialRampToValueAtTime(0.0001, at + 0.2);
    o.connect(g); g.connect(A.musicGain);
    o.start(at); o.stop(at + 0.24);
  }

  function drumKi(at, vol) {
    var len = 0.06;
    var buf = A.ctx.createBuffer(1, Math.ceil(A.ctx.sampleRate * len), A.ctx.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    var src = A.ctx.createBufferSource(); src.buffer = buf;
    var f = A.ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 2600; f.Q.value = 2;
    var g = A.ctx.createGain(); g.gain.value = vol;
    src.connect(f); f.connect(g); g.connect(A.musicGain);
    src.start(at); src.stop(at + len);
  }

  // plucked string, standing in for a veena
  function pluck(at, hz, vol, dur) {
    var o = A.ctx.createOscillator(), g = A.ctx.createGain(), f = A.ctx.createBiquadFilter();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(hz, at);
    f.type = 'lowpass';
    f.frequency.setValueAtTime(hz * 6, at);
    f.frequency.exponentialRampToValueAtTime(hz * 1.4, at + dur);
    f.Q.value = 2;
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(vol, at + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    o.connect(f); f.connect(g); g.connect(A.musicGain);
    o.start(at); o.stop(at + dur + 0.05);
  }

  A.playMusic = function (name) {
    if (!A.ready) { music.pending = name; return; }
    if (music.on && music.name === name) return;
    var tr = TRACKS[name];
    if (!tr) return;
    music.name = name;
    music.track = tr;
    music.on = true;
    music.step = 0;
    music.tempo = tr.tempo;
    music.nextAt = A.ctx.currentTime + 0.1;
    startDrone(tr.root);
  };

  A.stopMusic = function () {
    music.on = false; music.name = null; music.pending = null;
    if (A.ready) stopDrone();
  };

  // called every frame from the game loop
  A.update = function () {
    if (!A.ready) return;
    if (music.pending) { var p = music.pending; music.pending = null; A.playMusic(p); }
    if (!music.on) return;

    var tr = music.track;
    var lookahead = A.ctx.currentTime + 0.2;
    var guard = 0;
    while (music.nextAt < lookahead && guard++ < 32) {
      var at = music.nextAt;
      var s = music.step % 16;

      // drums: strong beat every 4 steps, dry ticks in between
      if (s % 4 === 0) drumTha(at, tr.drums * (s === 0 ? 1 : 0.7));
      if (s % 2 === 1) drumKi(at, tr.drums * 0.3);
      if (tr.drums > 0.4 && s % 8 === 6) drumTha(at, tr.drums * 0.5);

      // melody
      var deg = tr.mel[s];
      if (deg !== undefined && deg !== null) {
        pluck(at, noteHz(tr.scale, deg, 0, tr.root) * 2, tr.lead, music.tempo * 2.2);
        if (s % 8 === 0) pluck(at, noteHz(tr.scale, deg, -1, tr.root), tr.lead * 0.7, music.tempo * 3);
      }

      music.nextAt += music.tempo;
      music.step++;
    }
  };

  CR.Audio = A;
})();
</script>
<script>/* ---- js/art.js ---- */
/* ============================================================
   art.js - every pixel you see is drawn here, by code.

   There is not a single image file in this project. Characters are
   little jointed puppets (a head, a body, two arms, two legs) whose
   joints are rotated by maths each frame, and the scenery is built
   from paths - hills, palm trees, gopuram towers, fort walls.

   Why do it this way? No downloads, no licences, nothing to load,
   and it stays razor sharp on a big screen and tiny on a phone.
   ============================================================ */
(function () {
  var Art = {};

  /* ---------- colour palettes ----------
     One palette per level. Changing these six-or-so colours changes
     the entire mood of a level, which is the cheapest art trick there is. */
  Art.PALETTES = {
    grove: {                       // Level 1 - morning, green, hopeful
      skyTop: '#2e6f7a', skyBot: '#8fc38a',
      sun: '#ffeab0',
      far: '#4c7f6d', mid: '#356152', near: '#1f3f36',
      groundTop: '#5d8a44', groundFace: '#3c5a2c', groundDeep: '#25391c',
      stone: '#7d8a6a', stoneDark: '#525d44',
      accent: '#e0b040', haze: 'rgba(180,220,190,0.20)'
    },
    fort: {                        // Level 2 - late afternoon, sand and stone
      skyTop: '#4a3358', skyBot: '#e29a52',
      sun: '#ffd79a',
      far: '#9a6b46', mid: '#734c33', near: '#42291c',
      groundTop: '#b98b57', groundFace: '#8a6238', groundDeep: '#513920',
      stone: '#9a8462', stoneDark: '#5f513a',
      accent: '#f0c460', haze: 'rgba(240,190,130,0.18)'
    },
    hall: {                        // Level 3 - inside the Pandya palace, night, firelight
      skyTop: '#0a0a14', skyBot: '#1a1220',
      sun: '#ffb347',
      far: '#241a2b', mid: '#191222', near: '#0d0912',
      groundTop: '#3a2c3f', groundFace: '#241a28', groundDeep: '#120c16',
      stone: '#43354a', stoneDark: '#241b29',
      accent: '#ff9a3c', haze: 'rgba(255,140,50,0.10)'
    }
  };

  /* ---------- character colours ---------- */
  var SKIN = '#9c6440', SKIN_DARK = '#7a4b2e';
  var HAIR = '#1b1310';

  Art.HERO = {
    skin: SKIN, skinDark: SKIN_DARK, hair: HAIR,
    cloth: '#f2e6c9',     // white-gold dhoti
    sash: '#b4302a',      // Chola red
    gold: '#e8bd4c',
    trim: '#8c1f1a'
  };

  Art.GUARD = {
    skin: SKIN, skinDark: SKIN_DARK, hair: HAIR,
    cloth: '#2f6b63',     // Pandya teal
    sash: '#1d443f',
    gold: '#c9a24a',
    metal: '#9aa3ac',
    trim: '#123330'
  };

  // The Chola king's own men - ochre and cream, tiger colours
  Art.CHOLA = {
    skin: SKIN, skinDark: SKIN_DARK, hair: HAIR,
    cloth: '#e8dcc0', sash: '#a8451e', gold: '#d8b24e', metal: '#a8b0b8', trim: '#7a2f14'
  };

  Art.CAPTAIN = {
    skin: SKIN, skinDark: SKIN_DARK, hair: HAIR,
    cloth: '#4a3f78', sash: '#2b2450', gold: '#d8b24e', metal: '#b9c2cb', trim: '#1d1836'
  };

  Art.BOSS = {
    skin: '#8a5230', skinDark: '#6a3c22', hair: '#140e0b',
    cloth: '#5c1f2a', sash: '#38101a', gold: '#d9a441', metal: '#8d949c', trim: '#240a10'
  };

  Art.PRINCESS = {
    skin: '#a56c46', skinDark: '#83502f', hair: '#160f0c',
    cloth: '#c8447a', sash: '#8e2452', gold: '#f0cd66'
  };

  /* ---------- small drawing helpers ---------- */

  function limb(ctx, x, y, l1, l2, a1, a2, w, colA, colB) {
    // a1 is the angle of the upper part, a2 of the lower part.
    // 0 radians points straight down, positive turns forwards.
    var kx = x + Math.sin(a1) * l1, ky = y + Math.cos(a1) * l1;
    var ex = kx + Math.sin(a2) * l2, ey = ky + Math.cos(a2) * l2;
    ctx.lineCap = 'round';
    ctx.lineWidth = w;
    ctx.strokeStyle = colA;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(kx, ky); ctx.stroke();
    ctx.strokeStyle = colB || colA;
    ctx.lineWidth = w * 0.86;
    ctx.beginPath(); ctx.moveTo(kx, ky); ctx.lineTo(ex, ey); ctx.stroke();
    return { x: ex, y: ey, kx: kx, ky: ky };
  }

  // a small bare foot at the end of a leg, pointing the way the shin points
  function foot(ctx, end, angle, col) {
    ctx.save();
    ctx.translate(end.x, end.y);
    ctx.rotate(angle * 0.35);
    ctx.fillStyle = col;
    Art.roundRect(ctx, -1.4, -0.9, 4.4, 2.2, 1.1);
    ctx.fill();
    ctx.restore();
  }

  function ellipse(ctx, x, y, rx, ry, col) {
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  Art.roundRect = function (ctx, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  };

  /* ============================================================
     THE HUMAN PUPPET
     Everything is drawn relative to (0,0) = the ground between the feet.
     Up is negative y. h = how tall this person is in pixels.
     ============================================================ */
  Art.drawPerson = function (ctx, opts) {
    var col = opts.colors || Art.HERO;
    /* A "tint" paints the whole figure in one colour. We use it to stamp a
       soft dark copy just behind each fighter, which lifts them off the
       scenery without needing an outline around every shape. */
    if (opts.tint) {
      col = { skin: opts.tint, skinDark: opts.tint, hair: opts.tint, cloth: opts.tint,
              sash: opts.tint, gold: opts.tint, metal: opts.tint, trim: opts.tint };
    }
    var h = opts.height || 30;
    var t = opts.t || 0;             // animation clock, in seconds
    var anim = opts.anim || 'idle';
    var face = opts.facing || 1;
    var weapon = opts.weapon || 'none';   // none | dagger | sword | spear | club
    var s = h / 30;                  // scale everything off a 30px-tall reference

    ctx.save();
    ctx.translate(opts.x, opts.y);
    ctx.scale(face * s, s);          // flipping x makes them face the other way

    // default pose numbers, then each animation bends them
    var hipY = -13, chestY = -22, headY = -26.5;
    var lean = 0, bob = 0;
    var armA = [0, 0], armB = [0, 0];      // [back arm, front arm] upper/lower angles
    var legA = [0, 0], legB = [0, 0];
    var swordAngle = -0.5, crouch = 0;

    if (anim === 'idle') {
      bob = Math.sin(t * 2.2) * 0.35;
      armA = [0.18, 0.30]; armB = [-0.18, -0.05];
      legA = [0.06, 0.08]; legB = [-0.06, -0.02];
      lean = 0.02;
    } else if (anim === 'walk' || anim === 'run') {
      var sp = anim === 'run' ? 11 : 7.2;
      var amp = anim === 'run' ? 1.05 : 0.62;
      var ph = t * sp;
      bob = Math.abs(Math.sin(ph)) * (anim === 'run' ? -1.1 : -0.6);
      legA = [Math.sin(ph) * amp, Math.sin(ph) * amp + Math.max(0, Math.sin(ph)) * 0.5];
      legB = [Math.sin(ph + Math.PI) * amp, Math.sin(ph + Math.PI) * amp + Math.max(0, Math.sin(ph + Math.PI)) * 0.5];
      armA = [Math.sin(ph + Math.PI) * amp * 0.8, Math.sin(ph + Math.PI) * amp * 0.8 - 0.35];
      armB = [Math.sin(ph) * amp * 0.8, Math.sin(ph) * amp * 0.8 - 0.35];
      lean = anim === 'run' ? 0.22 : 0.08;
    } else if (anim === 'jump') {
      legA = [0.7, 1.15]; legB = [-0.35, -0.15];
      armA = [-1.3, -1.7]; armB = [-1.0, -1.5];
      lean = 0.12;
    } else if (anim === 'fall') {
      legA = [0.45, 0.8]; legB = [-0.5, -0.3];
      armA = [-2.1, -2.4]; armB = [-1.9, -2.2];
      lean = -0.05;
    } else if (anim === 'crawl') {
      crouch = 9; hipY = -5; chestY = -9.5; headY = -12;
      var cp = t * 6;
      legA = [1.35 + Math.sin(cp) * 0.35, 2.2]; legB = [1.35 + Math.sin(cp + Math.PI) * 0.35, 2.2];
      armA = [1.5 + Math.sin(cp + Math.PI) * 0.4, 2.1]; armB = [1.5 + Math.sin(cp) * 0.4, 2.1];
      lean = 1.15;
    } else if (anim === 'attack') {
      // p goes 0 -> 1 across the swing
      var p = CR.clamp(opts.attackP || 0, 0, 1);
      var swing = p < 0.32 ? -1.5 + p * 1.2 : CR.lerp(-1.1, 1.5, (p - 0.32) / 0.68);
      armB = [swing, swing + 0.35];
      armA = [0.5, 0.9];
      swordAngle = swing + 0.25;
      lean = 0.12 + p * 0.18;
      legA = [0.55, 0.75]; legB = [-0.5, -0.2];
    } else if (anim === 'hurt') {
      lean = -0.4;
      armA = [-0.9, -1.4]; armB = [-1.1, -1.6];
      legA = [0.3, 0.5]; legB = [-0.5, -0.7];
    } else if (anim === 'dead') {
      ctx.rotate(-1.45);
      ctx.translate(-2, -3);
      lean = 0;
      armA = [1.4, 1.6]; armB = [1.1, 1.4];
      legA = [1.2, 1.5]; legB = [1.4, 1.7];
    } else if (anim === 'hang') {
      armA = [-2.85, -2.95]; armB = [-2.85, -2.95];
      legA = [0.12, 0.35]; legB = [-0.1, 0.1];
      hipY = -12;
    } else if (anim === 'wallrun') {
      var wp = t * 14;
      legA = [Math.sin(wp) * 1.1 + 0.4, Math.sin(wp) * 1.1 + 1.0];
      legB = [Math.sin(wp + Math.PI) * 1.1 + 0.4, Math.sin(wp + Math.PI) * 1.1 + 1.0];
      armA = [-2.4, -2.7]; armB = [-2.6, -2.9];
      lean = 0.35;
    } else if (anim === 'swing') {
      armA = [-2.9, -3.0]; armB = [-2.9, -3.0];
      legA = [0.5, 0.9]; legB = [0.15, 0.4];
      lean = 0.1;
    } else if (anim === 'cheer') {
      var cy = Math.sin(t * 5) * 1.4;
      bob = cy;
      armA = [-2.7, -3.0]; armB = [-2.7, -3.0];
      legA = [0.1, 0.2]; legB = [-0.1, -0.2];
    } else if (anim === 'sleep') {
      // slumped against the wall, chin on chest
      hipY = -7; chestY = -14; headY = -18.5;
      armA = [1.9, 2.4]; armB = [1.6, 2.2];
      legA = [1.35, 2.3]; legB = [1.15, 2.2];
      lean = 0.45 + Math.sin(t * 1.3) * 0.05;
    }

    hipY += bob; chestY += bob; headY += bob;
    ctx.rotate(lean * 0.35);

    var lw = 3.6;

    /* --- back arm and back leg first, in shadow, so they sit behind --- */
    var backFoot = limb(ctx, 0, hipY, 6.5, 6.5, legA[0], legA[1], lw, col.skinDark, col.skinDark);
    foot(ctx, backFoot, legA[1], col.skinDark);
    var backHand = limb(ctx, 0, chestY + 1, 5.5, 5.5, armA[0], armA[1], lw * 0.82, col.skinDark, col.skinDark);

    /* --- torso --- */
    ctx.save();
    ctx.translate(0, chestY);
    ctx.rotate(lean * 0.5);
    ctx.fillStyle = col.skin;
    Art.roundRect(ctx, -4.4, -1.5, 8.8, (hipY - chestY) + 3.5, 3);
    ctx.fill();
    // a hint of shading down the back edge
    ctx.fillStyle = col.skinDark;
    Art.roundRect(ctx, -4.4, -1.5, 2.4, (hipY - chestY) + 3.5, 2.4);
    ctx.fill();
    // sash across the chest
    ctx.strokeStyle = col.sash;
    ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.moveTo(-3.4, 1.2); ctx.lineTo(3.4, 5.4); ctx.stroke();
    ctx.restore();

    /* --- dhoti (the wrapped cloth) --- */
    ctx.fillStyle = col.cloth;
    ctx.beginPath();
    ctx.moveTo(-4.8, hipY - 1.5);
    ctx.lineTo(4.8, hipY - 1.5);
    ctx.lineTo(4.0 + (anim === 'crawl' ? 2 : 0), hipY + 7.5);
    ctx.lineTo(-4.0, hipY + 7.0);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = col.gold;
    ctx.fillRect(-4.8, hipY - 1.9, 9.6, 1.4);   // gold waistband

    /* --- head --- */
    ctx.save();
    ctx.translate(0, headY);
    ctx.rotate(lean * 0.3);
    // neck
    ctx.fillStyle = col.skinDark;
    ctx.fillRect(-1.4, 1.5, 2.8, 3);
    ellipse(ctx, 0.3, 0, 3.7, 4.0, col.skin);
    // hair, tied in a knot at the back like the period sculptures
    ctx.fillStyle = col.hair;
    ctx.beginPath();
    ctx.ellipse(-0.2, -1.2, 3.8, 3.2, 0, Math.PI * 0.95, Math.PI * 2.15);
    ctx.fill();
    ellipse(ctx, -3.0, -1.4, 1.9, 1.9, col.hair);
    // eye and brow
    ctx.fillStyle = '#14100e';
    ctx.fillRect(1.7, -0.7, 1.1, 1.2);
    ctx.fillRect(1.3, -2.0, 2.0, 0.7);
    if (opts.crown) {
      ctx.fillStyle = col.gold;
      ctx.beginPath();
      ctx.moveTo(-2.8, -2.6); ctx.lineTo(2.8, -2.6); ctx.lineTo(2.2, -4.6);
      ctx.lineTo(1.0, -3.4); ctx.lineTo(0, -5.2); ctx.lineTo(-1.0, -3.4); ctx.lineTo(-2.2, -4.6);
      ctx.closePath(); ctx.fill();
    }
    if (opts.helmet) {
      ctx.fillStyle = col.metal || '#9aa3ac';
      ctx.beginPath();
      ctx.ellipse(0, -1.6, 3.6, 3.0, 0, Math.PI, Math.PI * 2);
      ctx.fill();
      ctx.fillRect(-3.6, -1.9, 7.2, 1.0);
      if (opts.plume) {
        ctx.fillStyle = col.sash;
        ctx.beginPath();
        ctx.moveTo(0, -4.4); ctx.quadraticCurveTo(-1.5, -8.5, -3.5, -9.5);
        ctx.quadraticCurveTo(-1.2, -7.2, -1.0, -4.4);
        ctx.closePath(); ctx.fill();
      }
    }
    if (opts.moustache) {
      ctx.strokeStyle = col.hair;
      ctx.lineWidth = 0.9;
      ctx.beginPath();
      ctx.moveTo(0.6, 1.4); ctx.quadraticCurveTo(2.6, 1.0, 3.4, 2.2);
      ctx.stroke();
    }
    ctx.restore();

    /* --- front leg and front arm, on top --- */
    var frontFoot = limb(ctx, 0, hipY, 6.5, 6.5, legB[0], legB[1], lw, col.skin, col.skin);
    foot(ctx, frontFoot, legB[1], col.skinDark);
    var hand = limb(ctx, 0, chestY + 1, 5.5, 5.5, armB[0], armB[1], lw * 0.82, col.skin, col.skin);

    /* --- what they are holding ----------
       A resting weapon sits at a fixed angle rather than following the
       arm, otherwise a spear ends up pointing at the floor. */
    if (weapon !== 'none') {
      var rest = weapon === 'spear' ? -0.10 : 0.55;
      ctx.save();
      ctx.translate(hand.x, hand.y);
      ctx.rotate(anim === 'attack' ? swordAngle : rest);
      Art.drawWeapon(ctx, weapon, col, opts.tint);
      ctx.restore();
    }

    if (opts.shield) {
      ctx.save();
      ctx.translate(backHand.x, backHand.y);
      Art.drawShield(ctx, col, opts.tint);
      ctx.restore();
    }

    ctx.restore();
  };

  Art.drawWeapon = function (ctx, weapon, col, tint) {
    col = col || Art.HERO;
    var grip  = tint || '#6b4a2a';
    var blade = tint || '#e3e9ef';
    var gold  = tint || col.gold || '#d8b24e';
    var wood  = tint || '#7a5230';
    var dark  = tint || '#4a2f1a';
    var shine = tint || 'rgba(255,255,255,0.65)';

    if (weapon === 'dagger') {
      ctx.fillStyle = grip; ctx.fillRect(-0.7, -1.5, 1.4, 3);
      ctx.fillStyle = blade;
      ctx.beginPath();
      ctx.moveTo(-1.0, -1.5); ctx.lineTo(1.0, -1.5); ctx.lineTo(0.5, -8.5);
      ctx.lineTo(0, -9.5); ctx.lineTo(-0.5, -8.5);
      ctx.closePath(); ctx.fill();
    } else if (weapon === 'sword') {
      ctx.fillStyle = grip; ctx.fillRect(-0.8, -1.5, 1.6, 3.5);
      ctx.fillStyle = gold; ctx.fillRect(-2.6, -2.6, 5.2, 1.4);          // crossguard
      ctx.fillStyle = blade;
      ctx.beginPath();
      ctx.moveTo(-1.2, -2.6); ctx.lineTo(1.2, -2.6); ctx.lineTo(0.9, -14);
      ctx.lineTo(0, -16); ctx.lineTo(-0.9, -14);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = shine; ctx.lineWidth = 0.4;
      ctx.beginPath(); ctx.moveTo(0, -3.2); ctx.lineTo(0, -14); ctx.stroke();
    } else if (weapon === 'spear') {
      ctx.fillStyle = grip; ctx.fillRect(-0.6, -12, 1.2, 20);
      ctx.fillStyle = blade;
      ctx.beginPath();
      ctx.moveTo(-1.4, -12); ctx.lineTo(1.4, -12); ctx.lineTo(0, -17);
      ctx.closePath(); ctx.fill();
    } else if (weapon === 'club') {
      ctx.fillStyle = grip; ctx.fillRect(-0.9, -6, 1.8, 8);
      ctx.fillStyle = wood;
      Art.roundRect(ctx, -2.6, -14, 5.2, 9, 2.4);
      ctx.fill();
      ctx.fillStyle = dark;
      for (var i = 0; i < 3; i++) ctx.fillRect(-2.6, -12.5 + i * 2.8, 5.2, 0.9);
    }
  };

  // Pandya soldiers carry the twin-carp emblem of their kingdom.
  Art.drawShield = function (ctx, col, tint) {
    if (tint) col = { metal: tint, gold: tint };
    ctx.fillStyle = col.metal || '#9aa3ac';
    ctx.beginPath();
    ctx.ellipse(0, 0, 3.6, 4.6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = col.gold || '#c9a24a'; ctx.lineWidth = 0.7;
    ctx.stroke();
    ctx.fillStyle = col.gold || '#c9a24a';
    for (var i = 0; i < 2; i++) {
      var yy = -1.3 + i * 2.6;
      ctx.beginPath();
      ctx.moveTo(-1.6, yy); ctx.quadraticCurveTo(0, yy - 1.1, 1.6, yy);
      ctx.quadraticCurveTo(0, yy + 1.1, -1.6, yy);
      ctx.fill();
    }
  };

  /* The captive princess, seen inside the cage in the last level. */
  Art.drawPrincess = function (ctx, x, y, t, freed, h) {
    var col = Art.PRINCESS;
    ctx.save();
    ctx.translate(x, y);
    var s = (h || 30) / 30 * 0.95;
    ctx.scale(s, s);
    // sari
    ctx.fillStyle = col.cloth;
    ctx.beginPath();
    ctx.moveTo(-5, 0); ctx.lineTo(5, 0); ctx.lineTo(3.2, -17); ctx.lineTo(-3.2, -17);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = col.gold;
    ctx.fillRect(-5, -2, 10, 1.4);
    ctx.fillRect(-3.4, -17, 6.8, 1.2);
    // arms
    ctx.strokeStyle = col.skin; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
    var a = freed ? -2.5 + Math.sin(t * 5) * 0.3 : -0.4;
    ctx.beginPath(); ctx.moveTo(-2.5, -19); ctx.lineTo(-2.5 + Math.sin(a) * 7, -19 + Math.cos(a) * 7); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(2.5, -19); ctx.lineTo(2.5 + Math.sin(-a) * 7, -19 + Math.cos(-a) * 7); ctx.stroke();
    // torso + head
    ctx.fillStyle = col.skin;
    Art.roundRect(ctx, -3.2, -22, 6.4, 6, 2.2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, -25.5, 3.2, 3.4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = col.hair;
    ctx.beginPath(); ctx.ellipse(0, -26.4, 3.3, 3.0, 0, Math.PI * 0.9, Math.PI * 2.2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, -21.5, 2.0, 4.6, 0, 0, Math.PI * 2); ctx.fill();   // long plait
    ctx.fillStyle = col.gold;
    ctx.beginPath(); ctx.arc(0, -28.6, 1.4, Math.PI, 0); ctx.fill();
    ctx.restore();
  };

  /* ============================================================
     SCENERY
     ============================================================ */

  // A gopuram - the stepped temple gateway tower you see all over Tamil Nadu.
  Art.gopuram = function (ctx, x, baseY, w, h, col, detail) {
    var tiers = 6;
    ctx.fillStyle = col;
    for (var i = 0; i < tiers; i++) {
      var f = i / tiers;
      var tw = w * (1 - f * 0.45);
      var ty = baseY - (h / tiers) * (i + 1);
      var th = h / tiers;
      ctx.fillRect(x - tw / 2, ty, tw, th * 0.92);
      if (detail) {
        ctx.fillStyle = 'rgba(0,0,0,0.16)';
        ctx.fillRect(x - tw / 2, ty + th * 0.72, tw, th * 0.2);
        ctx.fillStyle = col;
      }
    }
    // the barrel-shaped crown on top
    ctx.beginPath();
    ctx.ellipse(x, baseY - h, w * 0.30, h * 0.075, 0, Math.PI, Math.PI * 2);
    ctx.fill();
    // the finials
    for (var k = -1; k <= 1; k++) {
      ctx.beginPath();
      ctx.arc(x + k * w * 0.2, baseY - h - h * 0.055, w * 0.035, 0, Math.PI * 2);
      ctx.fill();
    }
  };

  Art.palm = function (ctx, x, baseY, h, col) {
    ctx.strokeStyle = col; ctx.lineWidth = h * 0.055; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x, baseY);
    ctx.quadraticCurveTo(x + h * 0.09, baseY - h * 0.55, x + h * 0.14, baseY - h);
    ctx.stroke();
    var tipX = x + h * 0.14, tipY = baseY - h;
    ctx.lineWidth = h * 0.035;
    for (var i = 0; i < 7; i++) {
      var a = -2.55 + i * 0.53;
      ctx.beginPath();
      ctx.moveTo(tipX, tipY);
      ctx.quadraticCurveTo(tipX + Math.cos(a) * h * 0.22, tipY + Math.sin(a) * h * 0.22,
                           tipX + Math.cos(a) * h * 0.34, tipY + Math.sin(a) * h * 0.34 + h * 0.08);
      ctx.stroke();
    }
  };

  Art.banyan = function (ctx, x, baseY, h, col) {
    ctx.fillStyle = col;
    ctx.fillRect(x - h * 0.05, baseY - h * 0.6, h * 0.1, h * 0.6);
    for (var i = 0; i < 6; i++) {
      var a = i / 6 * Math.PI * 2;
      ctx.beginPath();
      ctx.ellipse(x + Math.cos(a) * h * 0.22, baseY - h * 0.68 + Math.sin(a) * h * 0.12,
                  h * 0.22, h * 0.16, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    // the hanging roots a banyan is known for
    ctx.strokeStyle = col; ctx.lineWidth = h * 0.012;
    for (var j = 0; j < 5; j++) {
      var rx = x - h * 0.28 + j * h * 0.14;
      ctx.beginPath(); ctx.moveTo(rx, baseY - h * 0.6); ctx.lineTo(rx + h * 0.02, baseY - h * 0.2); ctx.stroke();
    }
  };

  Art.fortWall = function (ctx, x, baseY, w, h, col, colDark) {
    ctx.fillStyle = col;
    ctx.fillRect(x, baseY - h, w, h);
    ctx.fillStyle = colDark;
    // battlements along the top
    for (var i = 0; i < w; i += 12) ctx.fillRect(x + i, baseY - h - 5, 7, 5);
    // stone courses
    for (var y = baseY - h + 6; y < baseY; y += 7) ctx.fillRect(x, y, w, 1);
  };

  /* Decorative inscription marks. These are ornamental strokes in the
     spirit of a stone inscription - deliberately not real letters, so we
     never carve nonsense into a wall. */
  Art.inscription = function (ctx, x, y, w, rows, col, seed) {
    var rnd = CR.rng(seed || 7);
    ctx.strokeStyle = col;
    ctx.lineWidth = 0.6;
    ctx.lineCap = 'round';
    for (var r = 0; r < rows; r++) {
      var cx = x, cy = y + r * 5;
      while (cx < x + w - 3) {
        var gw = 2 + rnd() * 2;
        ctx.beginPath();
        ctx.arc(cx + gw / 2, cy, gw / 2, Math.PI * (0.15 + rnd() * 0.4), Math.PI * (1.3 + rnd() * 0.6));
        ctx.stroke();
        if (rnd() > 0.5) {
          ctx.beginPath(); ctx.moveTo(cx + gw / 2, cy - 1.6); ctx.lineTo(cx + gw / 2, cy + 1.6); ctx.stroke();
        }
        cx += gw + 1.4;
      }
    }
  };

  // A kolam: the looping rice-flour pattern drawn on Tamil doorsteps.
  Art.kolam = function (ctx, x, y, r, col) {
    ctx.strokeStyle = col;
    ctx.lineWidth = 0.6;
    for (var i = 0; i < 4; i++) {
      var a = i / 4 * Math.PI * 2;
      ctx.beginPath();
      ctx.ellipse(x + Math.cos(a) * r * 0.45, y + Math.sin(a) * r * 0.45, r * 0.5, r * 0.28, a, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(x, y, r * 0.16, 0, Math.PI * 2); ctx.stroke();
  };

  // A dancing-figure statue in a wall niche - a nod to Chola bronzes.
  Art.statue = function (ctx, x, baseY, h, col, glow) {
    ctx.save();
    ctx.translate(x, baseY);
    var s = h / 30;
    ctx.scale(s, s);
    ctx.fillStyle = glow || col;
    // ring of fire
    ctx.strokeStyle = glow || col;
    ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(0, -16, 13, 0, Math.PI * 2); ctx.stroke();
    // the figure: one leg raised, four arms
    ctx.strokeStyle = col; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-2, -4); ctx.lineTo(-2, -8); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-2, -14); ctx.lineTo(-2, -8); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-2, -12); ctx.lineTo(4, -9); ctx.lineTo(7, -12); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-2, -20); ctx.lineTo(-9, -17); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-2, -20); ctx.lineTo(6, -22); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-2, -19); ctx.lineTo(-8, -24); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-2, -19); ctx.lineTo(5, -26); ctx.stroke();
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(-2, -24, 2.6, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  };

  /* A burning torch. flicker is a number that wobbles over time. */
  Art.torch = function (ctx, x, y, t, palette) {
    ctx.fillStyle = '#4a3320';
    ctx.fillRect(x - 1, y, 2, 9);
    ctx.fillStyle = '#2a2118';
    Art.roundRect(ctx, x - 2.6, y - 3, 5.2, 4, 1.4); ctx.fill();
    var f = 1 + Math.sin(t * 11 + x) * 0.18 + Math.sin(t * 23 + x * 2) * 0.09;
    var g = ctx.createRadialGradient(x, y - 5, 0, x, y - 5, 11 * f);
    g.addColorStop(0, 'rgba(255,220,140,0.85)');
    g.addColorStop(0.4, 'rgba(255,150,50,0.35)');
    g.addColorStop(1, 'rgba(255,110,20,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y - 5, 11 * f, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffcf6a';
    ctx.beginPath();
    ctx.moveTo(x - 1.8, y - 2.5);
    ctx.quadraticCurveTo(x - 0.6, y - 6 * f, x, y - 8.5 * f);
    ctx.quadraticCurveTo(x + 0.8, y - 6 * f, x + 1.8, y - 2.5);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff2c0';
    ctx.beginPath();
    ctx.moveTo(x - 0.9, y - 2.5);
    ctx.quadraticCurveTo(x, y - 4.5 * f, x, y - 5.6 * f);
    ctx.quadraticCurveTo(x + 0.5, y - 4.5 * f, x + 0.9, y - 2.5);
    ctx.closePath(); ctx.fill();
  };

  /* ============================================================
     PARALLAX BACKDROPS
     Each layer is painted once into an off-screen picture, then that
     picture is repeated across the screen at a different speed. Distant
     layers move slowly, near ones move fast - that is what makes it
     feel deep.
     ============================================================ */
  var LAYER_W = 480, LAYER_H = 270;   // each strip is painted at this size, then squeezed to fit the view

  function makeLayer(w, h, paint) {
    var c = document.createElement('canvas');
    var s = 2;                       // draw the strip at 2x so it stays sharp
    c.width = w * s; c.height = h * s;
    var g = c.getContext('2d');
    g.scale(s, s);
    paint(g, w, h);
    return c;
  }

  Art.buildBackdrop = function (paletteName, seed) {
    var P = Art.PALETTES[paletteName];
    var rnd = CR.rng(seed || 1234);
    var layers = [];

    if (paletteName === 'hall') {
      // Level 3 is indoors: no sky at all, just a deep dark hall.
      layers.push({ speed: 0, y: 0, img: makeLayer(LAYER_W, LAYER_H, function (g) {
        var grad = g.createLinearGradient(0, 0, 0, LAYER_H);
        grad.addColorStop(0, '#070510');
        grad.addColorStop(0.6, '#140d1c');
        grad.addColorStop(1, '#0b0712');
        g.fillStyle = grad;
        g.fillRect(0, 0, LAYER_W, LAYER_H);
      })});
      // rows of pillars instead of hills
      layers.push({ speed: 0.15, y: 0, img: makeLayer(LAYER_W, LAYER_H, function (g) {
        g.fillStyle = P.far;
        for (var x = 10; x < LAYER_W; x += 78) {
          g.fillRect(x, 40, 20, 200);
          g.fillRect(x - 4, 34, 28, 8);
          g.fillRect(x - 3, 232, 26, 8);
        }
        g.fillStyle = 'rgba(0,0,0,0.35)';
        g.fillRect(0, 0, LAYER_W, 40);
      })});
      layers.push({ speed: 0.42, y: 0, img: makeLayer(LAYER_W, LAYER_H, function (g) {
        g.fillStyle = P.mid;
        for (var x = 40; x < LAYER_W; x += 120) {
          g.fillRect(x, 20, 30, 230);
          g.fillRect(x - 7, 12, 44, 12);
          Art.inscription(g, x + 3, 70, 24, 5, 'rgba(255,160,80,0.20)', x * 7 + 3);
        }
        // arched openings between the pillars
        g.strokeStyle = 'rgba(255,150,60,0.10)';
        g.lineWidth = 3;
        for (var a = 100; a < LAYER_W; a += 120) {
          g.beginPath(); g.arc(a, 90, 30, Math.PI, 0); g.stroke();
        }
      })});
      return { layers: layers, palette: P, name: paletteName };
    }

    // ---- sky + sun ----
    layers.push({ speed: 0, y: 0, img: makeLayer(LAYER_W, LAYER_H, function (g) {
      var grad = g.createLinearGradient(0, 0, 0, LAYER_H);
      grad.addColorStop(0, P.skyTop);
      grad.addColorStop(1, P.skyBot);
      g.fillStyle = grad;
      g.fillRect(0, 0, LAYER_W, LAYER_H);
      var sg = g.createRadialGradient(360, 62, 2, 360, 62, 60);
      sg.addColorStop(0, P.sun);
      sg.addColorStop(1, 'rgba(255,220,150,0)');
      g.fillStyle = sg;
      g.beginPath(); g.arc(360, 62, 60, 0, Math.PI * 2); g.fill();
      // a few soft clouds
      g.fillStyle = 'rgba(255,255,255,0.13)';
      for (var i = 0; i < 5; i++) {
        var cx = rnd() * LAYER_W, cy = 24 + rnd() * 60;
        for (var k = 0; k < 4; k++) {
          g.beginPath();
          g.ellipse(cx + k * 11 - 16, cy + Math.sin(k) * 3, 15 - k * 1.5, 5, 0, 0, Math.PI * 2);
          g.fill();
        }
      }
    })});

    // ---- far hills + a distant gopuram ----
    layers.push({ speed: 0.14, y: 0, img: makeLayer(LAYER_W, LAYER_H, function (g) {
      g.fillStyle = P.far;
      g.beginPath();
      g.moveTo(0, 200);
      for (var x = 0; x <= LAYER_W; x += 24) {
        g.lineTo(x, 168 + Math.sin(x * 0.017 + 1.2) * 22 + Math.sin(x * 0.041) * 9);
      }
      g.lineTo(LAYER_W, LAYER_H); g.lineTo(0, LAYER_H);
      g.closePath(); g.fill();
      Art.gopuram(g, 118, 178, 40, 78, P.far, false);
      Art.gopuram(g, 336, 182, 30, 56, P.far, false);
    })});

    // ---- middle band: trees or walls ----
    layers.push({ speed: 0.34, y: 0, img: makeLayer(LAYER_W, LAYER_H, function (g) {
      if (paletteName === 'grove') {
        for (var i = 0; i < 9; i++) {
          var x = 12 + i * 54 + rnd() * 18;
          if (rnd() > 0.55) Art.banyan(g, x, 214, 58 + rnd() * 22, P.mid);
          else Art.palm(g, x, 214, 62 + rnd() * 26, P.mid);
        }
      } else {
        Art.fortWall(g, 0, 216, LAYER_W, 62, P.mid, P.near);
        for (var t = 0; t < 4; t++) {
          var tx = 40 + t * 120;
          g.fillStyle = P.mid;
          g.fillRect(tx, 130, 34, 86);
          g.fillStyle = P.near;
          for (var b = 0; b < 34; b += 11) g.fillRect(tx + b, 124, 6, 6);
        }
      }
      g.fillStyle = P.haze;
      g.fillRect(0, 0, LAYER_W, LAYER_H);
    })});

    // ---- near band, just behind the action ----
    layers.push({ speed: 0.62, y: 0, img: makeLayer(LAYER_W, LAYER_H, function (g) {
      g.fillStyle = P.near;
      if (paletteName === 'grove') {
        for (var i = 0; i < 6; i++) Art.palm(g, i * 88 + 20, 250, 46 + rnd() * 18, P.near);
        g.beginPath();
        g.moveTo(0, 246);
        for (var x = 0; x <= LAYER_W; x += 16) g.lineTo(x, 240 + Math.sin(x * 0.06) * 5);
        g.lineTo(LAYER_W, LAYER_H); g.lineTo(0, LAYER_H);
        g.closePath(); g.fill();
      } else {
        for (var d = 0; d < LAYER_W; d += 60) {
          g.beginPath();
          g.moveTo(d, LAYER_H);
          g.quadraticCurveTo(d + 30, 232, d + 60, LAYER_H);
          g.closePath(); g.fill();
        }
      }
    })});

    return { layers: layers, palette: P, name: paletteName };
  };

  Art.drawBackdrop = function (ctx, backdrop, camX, camY) {
    for (var i = 0; i < backdrop.layers.length; i++) {
      var L = backdrop.layers[i];
      var off = -(camX * L.speed) % LAYER_W;
      if (off > 0) off -= LAYER_W;
      var y = -camY * L.speed * 0.25;
      for (var x = off; x < CR.VIEW_W; x += LAYER_W) {
        ctx.drawImage(L.img, x, y, LAYER_W, CR.VIEW_H);
      }
    }
  };

  /* ---------- text ----------
     The canvas is drawn at a higher internal resolution than 480x270,
     so ordinary canvas text comes out crisp instead of blocky. */
  Art.FONT_UI = '600 9px "Trebuchet MS", "Segoe UI", system-ui, sans-serif';
  Art.FONT_SMALL = '600 7.5px "Trebuchet MS", "Segoe UI", system-ui, sans-serif';
  Art.FONT_BODY = '500 9px Georgia, "Times New Roman", serif';
  Art.FONT_TITLE = '700 34px Georgia, "Times New Roman", serif';
  Art.FONT_SUB = '600 11px Georgia, "Times New Roman", serif';

  Art.text = function (ctx, str, x, y, opts) {
    opts = opts || {};
    ctx.font = opts.font || Art.FONT_UI;
    ctx.textAlign = opts.align || 'left';
    ctx.textBaseline = opts.baseline || 'alphabetic';
    if (opts.shadow !== false) {
      ctx.fillStyle = opts.shadowColor || 'rgba(0,0,0,0.65)';
      ctx.fillText(str, x + (opts.shadowOff || 1), y + (opts.shadowOff || 1));
    }
    ctx.fillStyle = opts.color || '#f4e6c4';
    ctx.fillText(str, x, y);
  };

  // Break a long sentence into lines that fit inside maxW.
  Art.wrap = function (ctx, str, maxW, font) {
    ctx.font = font || Art.FONT_BODY;
    var words = str.split(' '), lines = [], line = '';
    for (var i = 0; i < words.length; i++) {
      var test = line ? line + ' ' + words[i] : words[i];
      if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = words[i]; }
      else line = test;
    }
    if (line) lines.push(line);
    return lines;
  };

  CR.Art = Art;
})();
</script>
<script>/* ---- js/world.js ---- */
/* ============================================================
   world.js - the level made real: solid ground, moving traps,
   the camera, and everything that is painted behind the actors.

   A level is just lists of rectangles and props (see levels.js).
   This file turns those lists into something you can stand on.
   ============================================================ */
(function () {
  var World = {};

  World.solids = [];
  World.oneway = [];
  World.bucket = {};       // solids sorted into columns, so collision stays fast
  var BUCKET = 128;

  World.reset = function (def) {
    World.def = def;
    World.w = def.w;
    World.h = def.h;
    World.solids = [];
    World.oneway = [];
    World.bucket = {};
    World.time = 0;

    var i;
    for (i = 0; i < (def.solids || []).length; i++) {
      var s = def.solids[i];
      World.addSolid(CR.rect(s[0], s[1], s[2], s[3]), s[4] || 'earth');
    }
    for (i = 0; i < (def.oneway || []).length; i++) {
      var o = def.oneway[i];
      World.oneway.push(CR.rect(o[0], o[1], o[2], 4));
    }

    /* ---- hazards and props ---- */
    World.spikes = [];
    for (i = 0; i < (def.spikes || []).length; i++) {
      var sp = def.spikes[i];
      World.spikes.push({ x: sp[0], y: sp[1], w: sp[2] });
    }

    // Retracting spike traps: they pop out of the floor on a timer, exactly
    // like the ones you have to sprint between in Prince of Persia.
    World.traps = [];
    for (i = 0; i < (def.traps || []).length; i++) {
      var tr = def.traps[i];
      World.traps.push({ x: tr[0], y: tr[1], period: tr[2] || 2.2, phase: tr[3] || 0, out: 0 });
    }

    World.barrels = [];
    for (i = 0; i < (def.barrels || []).length; i++) {
      World.barrels.push({ x: def.barrels[i][0], y: def.barrels[i][1], hp: 1, broken: 0, bits: null });
    }

    World.ropes = [];
    for (i = 0; i < (def.ropes || []).length; i++) {
      var rp = def.ropes[i];
      World.ropes.push({ x: rp[0], y: rp[1], len: rp[2] || 42, a: 0.5, va: 0, rider: null });
    }

    World.gates = [];
    for (i = 0; i < (def.gates || []).length; i++) {
      var gt = def.gates[i];
      World.gates.push({ x: gt[0], y: gt[1], h: gt[2], open: 0, timer: 0 });
    }

    World.levers = [];
    for (i = 0; i < (def.levers || []).length; i++) {
      var lv = def.levers[i];
      World.levers.push({ x: lv[0], y: lv[1], gate: lv[2], secs: lv[3] || 7, pulled: 0 });
    }

    World.pickups = [];
    for (i = 0; i < (def.pickups || []).length; i++) {
      var pk = def.pickups[i];
      World.pickups.push({ x: pk[0], y: pk[1], kind: pk[2], taken: false, bob: Math.random() * 6 });
    }

    World.torches = (def.torches || []).slice();
    World.decor = (def.decor || []).slice();
    World.signs = (def.signs || []).map(function (s) { return { x: s[0], text: s[1], shown: false }; });
    World.checkpoints = (def.checkpoints || []).slice();
    World.exit = def.exit ? { x: def.exit[0], y: def.exit[1], open: false } : null;
    World.cage = def.cage ? { x: def.cage[0], y: def.cage[1], open: false } : null;

    World.backdrop = CR.Art.buildBackdrop(def.palette, def.id * 977 + 13);
    World.palette = CR.Art.PALETTES[def.palette];

    World.camera = { x: 0, y: 0, shake: 0 };
    World.particles = [];
  };

  World.addSolid = function (r, kind) {
    r.kind = kind || 'earth';
    World.solids.push(r);
    var b0 = Math.floor(r.x / BUCKET), b1 = Math.floor((r.x + r.w) / BUCKET);
    for (var b = b0; b <= b1; b++) {
      (World.bucket[b] = World.bucket[b] || []).push(r);
    }
  };

  // Every solid rectangle that could possibly touch this area.
  World.nearby = function (r) {
    var out = [], seen = {};
    var b0 = Math.floor((r.x - 2) / BUCKET), b1 = Math.floor((r.x + r.w + 2) / BUCKET);
    for (var b = b0; b <= b1; b++) {
      var list = World.bucket[b];
      if (!list) continue;
      for (var i = 0; i < list.length; i++) {
        var s = list[i];
        if (seen[s.x + ':' + s.y + ':' + s.w]) continue;
        seen[s.x + ':' + s.y + ':' + s.w] = 1;
        out.push(s);
      }
    }
    return out;
  };

  World.solidOverlap = function (r) {
    var list = World.nearby(r);
    for (var i = 0; i < list.length; i++) if (CR.overlap(r, list[i])) return list[i];
    return null;
  };

  // Closed gates count as walls too.
  World.gateBlocking = function (r) {
    for (var i = 0; i < World.gates.length; i++) {
      var g = World.gates[i];
      if (g.open >= 0.98) continue;
      var gr = CR.rect(g.x, g.y + g.h * g.open, 8, g.h * (1 - g.open));
      if (CR.overlap(r, gr)) return gr;
    }
    return null;
  };

  World.blocked = function (r) {
    return World.solidOverlap(r) || World.gateBlocking(r);
  };

  /* Move a box through the world, stopping when it hits something.
     We move in small steps so nothing can tunnel through a thin wall
     at high speed, and we handle x and y separately so sliding along
     a floor or wall feels natural. */
  World.moveBox = function (box, dx, dy, opts) {
    opts = opts || {};
    var res = { hitX: false, hitY: false, onGround: false, ceiling: false };
    var steps = Math.max(1, Math.ceil(Math.max(Math.abs(dx), Math.abs(dy)) / 5));
    var sx = dx / steps, sy = dy / steps;

    for (var s = 0; s < steps; s++) {
      // --- horizontal ---
      if (sx !== 0) {
        box.x += sx;
        var hit = World.blocked(box);
        if (hit) {
          box.x = sx > 0 ? hit.x - box.w - 0.001 : hit.x + hit.w + 0.001;
          res.hitX = true;
          sx = 0;
        }
      }
      // --- vertical ---
      if (sy !== 0) {
        var prevBottom = box.y + box.h;
        box.y += sy;
        var hitY = World.blocked(box);
        if (!hitY && sy > 0 && !opts.ignoreOneway) {
          // one-way platforms: only solid when you are landing on top of them
          for (var i = 0; i < World.oneway.length; i++) {
            var p = World.oneway[i];
            if (CR.overlap(box, p) && prevBottom <= p.y + 1.5) { hitY = p; break; }
          }
        }
        if (hitY) {
          if (sy > 0) { box.y = hitY.y - box.h - 0.001; res.onGround = true; }
          else { box.y = hitY.y + hitY.h + 0.001; res.ceiling = true; }
          res.hitY = true;
          sy = 0;
        }
      }
      if (sx === 0 && sy === 0) break;
    }
    return res;
  };

  // Is there ground directly under this box?
  World.groundBelow = function (box, reach) {
    var probe = CR.rect(box.x + 1, box.y + box.h, box.w - 2, reach || 2);
    if (World.blocked(probe)) return true;
    for (var i = 0; i < World.oneway.length; i++) {
      var p = World.oneway[i];
      if (CR.overlap(probe, p) && box.y + box.h <= p.y + 2) return true;
    }
    return false;
  };

  /* ---------- update ---------- */
  World.update = function (dt, player) {
    World.time += dt;

    // spike traps breathe in and out
    for (var i = 0; i < World.traps.length; i++) {
      var tr = World.traps[i];
      var ph = ((World.time + tr.phase) % tr.period) / tr.period;
      // out for the first 40% of the cycle, with a fast snap up
      var target = ph < 0.36 ? 1 : 0;
      var wasOut = tr.out;
      tr.out = CR.approach(tr.out, target, dt * (target ? 9 : 3.5));
      if (wasOut < 0.5 && tr.out >= 0.5) CR.Audio.sfx.spike();
    }

    // gates slide back down when their timer runs out
    for (i = 0; i < World.gates.length; i++) {
      var g = World.gates[i];
      if (g.timer > 0) {
        g.timer -= dt;
        g.open = CR.approach(g.open, 1, dt * 1.6);
      } else {
        g.open = CR.approach(g.open, 0, dt * 1.2);
      }
    }

    // levers reset with their gate
    for (i = 0; i < World.levers.length; i++) {
      var lv = World.levers[i];
      var gg = World.gates[lv.gate];
      lv.pulled = gg && gg.timer > 0 ? 1 : 0;
    }

    // ropes swing like a pendulum
    for (i = 0; i < World.ropes.length; i++) {
      var rp = World.ropes[i];
      if (rp.rider) continue;                 // the player drives it while holding on
      rp.va += -Math.sin(rp.a) * 5.2 * dt;
      rp.va *= 0.995;
      rp.a += rp.va * dt;
    }

    // barrel debris
    for (i = World.particles.length - 1; i >= 0; i--) {
      var p = World.particles[i];
      p.vy += 460 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.life -= dt;
      p.rot += p.vr * dt;
      if (p.life <= 0) World.particles.splice(i, 1);
    }

    if (World.camera.shake > 0) World.camera.shake = Math.max(0, World.camera.shake - dt * 3);
  };

  World.puff = function (x, y, n, col, spread) {
    for (var i = 0; i < n; i++) {
      World.particles.push({
        x: x, y: y,
        vx: (Math.random() - 0.5) * (spread || 90),
        vy: -Math.random() * 110 - 20,
        life: 0.4 + Math.random() * 0.5,
        rot: Math.random() * 6, vr: (Math.random() - 0.5) * 14,
        size: 1 + Math.random() * 2.4,
        col: col || '#8a6a3a'
      });
    }
  };

  /* ---------- camera ----------
     Old Prince of Persia keeps you a little back from the middle so you can
     see what is coming. We do the same: the camera aims ahead of the way
     you are facing, and eases towards that spot instead of snapping. */
  World.updateCamera = function (dt, player, snap) {
    var cam = World.camera;
    var targetX = player.x + player.w / 2 + player.facing * 40 - CR.VIEW_W / 2;
    var targetY = (player.y + player.h) - CR.VIEW_H * 0.74;

    targetX = CR.clamp(targetX, 0, Math.max(0, World.w - CR.VIEW_W));
    targetY = CR.clamp(targetY, 0, Math.max(0, World.h - CR.VIEW_H));

    if (snap) { cam.x = targetX; cam.y = targetY; return; }
    cam.x = CR.lerp(cam.x, targetX, Math.min(1, dt * 3.2));
    cam.y = CR.lerp(cam.y, targetY, Math.min(1, dt * 4.5));
  };

  World.camOffset = function () {
    var cam = World.camera;
    var sx = 0, sy = 0;
    if (cam.shake > 0) {
      sx = (Math.random() - 0.5) * cam.shake * 5;
      sy = (Math.random() - 0.5) * cam.shake * 5;
    }
    return { x: Math.round(cam.x + sx), y: Math.round(cam.y + sy) };
  };

  /* ============================================================
     DRAWING THE WORLD
     ============================================================ */

  World.drawBack = function (ctx, cam) {
    CR.Art.drawBackdrop(ctx, World.backdrop, cam.x, cam.y);
  };

  function visible(cam, x, w) {
    return x + w > cam.x - 20 && x < cam.x + CR.VIEW_W + 20;
  }

  World.drawTerrain = function (ctx, cam) {
    var P = World.palette;
    var i;

    // --- decor that sits behind the ground: statues, inscriptions ---
    for (i = 0; i < World.decor.length; i++) {
      var d = World.decor[i];
      if (!visible(cam, d[1] - 30, 60)) continue;
      ctx.save();
      ctx.translate(-cam.x, -cam.y);
      if (d[0] === 'statue') CR.Art.statue(ctx, d[1], d[2], d[3] || 34, P.stoneDark, P.accent);
      else if (d[0] === 'inscription') CR.Art.inscription(ctx, d[1], d[2], d[3] || 40, d[4] || 4, 'rgba(255,255,255,0.16)', d[1] | 0);
      else if (d[0] === 'kolam') CR.Art.kolam(ctx, d[1], d[2], d[3] || 8, 'rgba(255,255,255,0.22)');
      else if (d[0] === 'gopuram') CR.Art.gopuram(ctx, d[1], d[2], d[3] || 50, d[4] || 90, P.stoneDark, true);
      ctx.restore();
    }

    // --- solid ground and walls ---
    ctx.save();
    ctx.translate(-cam.x, -cam.y);
    for (i = 0; i < World.solids.length; i++) {
      var s = World.solids[i];
      if (!visible(cam, s.x, s.w)) continue;

      if (s.kind === 'stone') {
        ctx.fillStyle = P.stone;
        ctx.fillRect(s.x, s.y, s.w, s.h);
        ctx.fillStyle = P.stoneDark;
        for (var y = s.y + 6; y < s.y + s.h; y += 8) ctx.fillRect(s.x, y, s.w, 1.2);
        for (var x = s.x + 10; x < s.x + s.w; x += 20) ctx.fillRect(x, s.y, 1.2, s.h);
        ctx.fillStyle = 'rgba(255,255,255,0.13)';
        ctx.fillRect(s.x, s.y, s.w, 1.6);
      } else {
        ctx.fillStyle = P.groundDeep;
        ctx.fillRect(s.x, s.y, s.w, s.h);
        ctx.fillStyle = P.groundFace;
        ctx.fillRect(s.x, s.y, s.w, Math.min(s.h, 14));
        ctx.fillStyle = P.groundTop;
        ctx.fillRect(s.x, s.y, s.w, 4);
        // scruffy edge so it does not read as a plain box
        ctx.fillStyle = P.groundTop;
        for (var gx = s.x; gx < s.x + s.w; gx += 6) {
          var bump = ((gx * 37) % 11) / 11;
          ctx.fillRect(gx, s.y - (bump > 0.6 ? 1.5 : 0), 6, 2);
        }
        ctx.fillStyle = 'rgba(0,0,0,0.18)';
        for (var dy = s.y + 18; dy < s.y + s.h; dy += 12) ctx.fillRect(s.x, dy, s.w, 1);
      }
    }

    // --- one-way wooden platforms ---
    for (i = 0; i < World.oneway.length; i++) {
      var p = World.oneway[i];
      if (!visible(cam, p.x, p.w)) continue;
      ctx.fillStyle = '#6b4a2a';
      ctx.fillRect(p.x, p.y, p.w, 4);
      ctx.fillStyle = '#8a6338';
      ctx.fillRect(p.x, p.y, p.w, 1.5);
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      for (var px = p.x + 5; px < p.x + p.w; px += 12) ctx.fillRect(px, p.y, 1, 4);
    }
    ctx.restore();
  };

  World.drawProps = function (ctx, cam, t) {
    var P = World.palette;
    ctx.save();
    ctx.translate(-cam.x, -cam.y);
    var i;

    // --- static spikes ---
    for (i = 0; i < World.spikes.length; i++) {
      var sp = World.spikes[i];
      if (!visible(cam, sp.x, sp.w)) continue;
      drawSpikeRow(ctx, sp.x, sp.y, sp.w, 1);
    }

    // --- retracting spike traps ---
    for (i = 0; i < World.traps.length; i++) {
      var tr = World.traps[i];
      if (!visible(cam, tr.x, 16)) continue;
      ctx.fillStyle = '#2a2620';
      ctx.fillRect(tr.x, tr.y - 1, 16, 3);
      if (tr.out > 0.02) drawSpikeRow(ctx, tr.x, tr.y, 16, tr.out);
    }

    // --- gates ---
    for (i = 0; i < World.gates.length; i++) {
      var g = World.gates[i];
      if (!visible(cam, g.x, 10)) continue;
      var top = g.y + g.h * g.open;
      ctx.fillStyle = '#5a5f66';
      ctx.fillRect(g.x, top, 8, g.h * (1 - g.open));
      ctx.fillStyle = '#3d4147';
      for (var by = top + 4; by < g.y + g.h; by += 7) ctx.fillRect(g.x, by, 8, 1.4);
      ctx.fillStyle = '#7a808a';
      ctx.fillRect(g.x - 1, g.y - 3, 10, 3);
      // spiked bottom edge
      ctx.fillStyle = '#8e959e';
      for (var sx = 0; sx < 8; sx += 2.6) {
        ctx.beginPath();
        ctx.moveTo(g.x + sx, g.y + g.h);
        ctx.lineTo(g.x + sx + 1.3, g.y + g.h + 2.6);
        ctx.lineTo(g.x + sx + 2.6, g.y + g.h);
        ctx.closePath(); ctx.fill();
      }
    }

    // --- levers ---
    for (i = 0; i < World.levers.length; i++) {
      var lv = World.levers[i];
      if (!visible(cam, lv.x, 8)) continue;
      ctx.fillStyle = '#4a4038';
      ctx.fillRect(lv.x - 2, lv.y - 2, 5, 12);
      ctx.strokeStyle = lv.pulled ? '#c0563a' : '#d8b24e';
      ctx.lineWidth = 1.8; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(lv.x + 0.5, lv.y);
      ctx.lineTo(lv.x + 0.5 + (lv.pulled ? 5 : -5), lv.y - 7);
      ctx.stroke();
      if (!lv.pulled) {
        var pulse = 0.5 + Math.sin(t * 5) * 0.3;
        ctx.fillStyle = 'rgba(255,220,120,' + (pulse * 0.4) + ')';
        ctx.beginPath(); ctx.arc(lv.x + 0.5, lv.y - 3, 7, 0, Math.PI * 2); ctx.fill();
      }
    }

    // --- ropes ---
    for (i = 0; i < World.ropes.length; i++) {
      var rp = World.ropes[i];
      if (!visible(cam, rp.x - 40, 80)) continue;
      var ex = rp.x + Math.sin(rp.a) * rp.len;
      var ey = rp.y + Math.cos(rp.a) * rp.len;
      ctx.strokeStyle = '#8a6a40';
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(rp.x, rp.y);
      ctx.quadraticCurveTo((rp.x + ex) / 2 + Math.sin(rp.a) * 2, (rp.y + ey) / 2, ex, ey);
      ctx.stroke();
      ctx.fillStyle = '#6b4a2a';
      ctx.beginPath(); ctx.arc(ex, ey, 2.2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#4a4038';
      ctx.fillRect(rp.x - 4, rp.y - 3, 8, 3);
    }

    // --- barrels ---
    for (i = 0; i < World.barrels.length; i++) {
      var b = World.barrels[i];
      if (b.broken || !visible(cam, b.x, 14)) continue;
      ctx.fillStyle = '#7a5230';
      CR.Art.roundRect(ctx, b.x, b.y, 14, 18, 3); ctx.fill();
      ctx.fillStyle = '#5c3d22';
      ctx.fillRect(b.x, b.y + 4, 14, 2);
      ctx.fillRect(b.x, b.y + 12, 14, 2);
      ctx.fillStyle = 'rgba(255,255,255,0.10)';
      ctx.fillRect(b.x + 2, b.y + 1, 3, 16);
    }

    // --- pickups ---
    for (i = 0; i < World.pickups.length; i++) {
      var pk = World.pickups[i];
      if (pk.taken || !visible(cam, pk.x, 16)) continue;
      var by = pk.y + Math.sin(t * 3 + pk.bob) * 2;
      var glow = ctx.createRadialGradient(pk.x + 5, by, 0, pk.x + 5, by, 14);
      glow.addColorStop(0, 'rgba(255,230,150,0.45)');
      glow.addColorStop(1, 'rgba(255,220,120,0)');
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.arc(pk.x + 5, by, 14, 0, Math.PI * 2); ctx.fill();
      if (pk.kind === 'sword') {
        ctx.save();
        ctx.translate(pk.x + 5, by + 8);
        ctx.rotate(-0.35);
        CR.Art.drawWeapon(ctx, 'sword', CR.Art.HERO);
        ctx.restore();
      } else {
        drawHeart(ctx, pk.x + 1, by, 9, '#d94a4a');
      }
    }

    // --- torches ---
    for (i = 0; i < World.torches.length; i++) {
      var tc = World.torches[i];
      if (!visible(cam, tc[0] - 12, 24)) continue;
      CR.Art.torch(ctx, tc[0], tc[1], t, P);
    }

    // --- the door out of the level ---
    if (World.exit && visible(cam, World.exit.x - 4, 30)) {
      var e = World.exit;
      ctx.fillStyle = '#241a12';
      CR.Art.roundRect(ctx, e.x, e.y - 34, 22, 34, 10); ctx.fill();
      ctx.fillStyle = e.open ? '#ffcf6a' : '#3c2a1c';
      CR.Art.roundRect(ctx, e.x + 2.5, e.y - 31, 17, 31, 8); ctx.fill();
      if (e.open) {
        var eg = ctx.createRadialGradient(e.x + 11, e.y - 16, 1, e.x + 11, e.y - 16, 26);
        eg.addColorStop(0, 'rgba(255,215,130,0.55)');
        eg.addColorStop(1, 'rgba(255,200,100,0)');
        ctx.fillStyle = eg;
        ctx.beginPath(); ctx.arc(e.x + 11, e.y - 16, 26, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.strokeStyle = '#6b5334'; ctx.lineWidth = 1.4;
        ctx.beginPath(); ctx.moveTo(e.x + 4, e.y - 16); ctx.lineTo(e.x + 18, e.y - 16); ctx.stroke();
        ctx.fillStyle = '#c9a24a';
        ctx.beginPath(); ctx.arc(e.x + 11, e.y - 16, 2.4, 0, Math.PI * 2); ctx.fill();
      }
      CR.Art.kolam(ctx, e.x + 11, e.y + 5, 7, 'rgba(255,255,255,0.25)');
    }

    // --- the cage in the last level ---
    if (World.cage && visible(cam, World.cage.x - 10, 50)) {
      var c = World.cage;
      CR.Art.drawPrincess(ctx, c.x + 16, c.y, t, c.open);
      if (!c.open) {
        ctx.strokeStyle = '#8e959e';
        ctx.lineWidth = 1.6;
        for (var bx = 0; bx <= 32; bx += 5.4) {
          ctx.beginPath(); ctx.moveTo(c.x + bx, c.y - 44); ctx.lineTo(c.x + bx, c.y); ctx.stroke();
        }
        ctx.lineWidth = 2.2;
        ctx.beginPath(); ctx.moveTo(c.x - 2, c.y - 44); ctx.lineTo(c.x + 34, c.y - 44); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(c.x - 2, c.y); ctx.lineTo(c.x + 34, c.y); ctx.stroke();
        ctx.fillStyle = '#d8b24e';
        ctx.beginPath(); ctx.arc(c.x + 16, c.y - 20, 2.6, 0, Math.PI * 2); ctx.fill();
      }
    }

    // --- debris ---
    for (i = 0; i < World.particles.length; i++) {
      var pt = World.particles[i];
      ctx.save();
      ctx.translate(pt.x, pt.y);
      ctx.rotate(pt.rot);
      ctx.globalAlpha = Math.min(1, pt.life * 2.2);
      ctx.fillStyle = pt.col;
      ctx.fillRect(-pt.size / 2, -pt.size / 2, pt.size, pt.size);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  };

  // A warm dark vignette, plus firelight in the palace level.
  World.drawAtmosphere = function (ctx, cam) {
    var P = World.palette;
    if (World.def.palette === 'hall') {
      ctx.fillStyle = 'rgba(6,4,10,0.55)';
      ctx.fillRect(0, 0, CR.VIEW_W, CR.VIEW_H);
      // punch light back in around each torch
      ctx.globalCompositeOperation = 'lighter';
      for (var i = 0; i < World.torches.length; i++) {
        var tc = World.torches[i];
        var sx = tc[0] - cam.x, sy = tc[1] - cam.y - 5;
        if (sx < -60 || sx > CR.VIEW_W + 60) continue;
        var g = ctx.createRadialGradient(sx, sy, 2, sx, sy, 62);
        g.addColorStop(0, 'rgba(255,170,70,0.30)');
        g.addColorStop(1, 'rgba(255,120,30,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(sx, sy, 62, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalCompositeOperation = 'source-over';
    }
    var v = ctx.createRadialGradient(CR.VIEW_W / 2, CR.VIEW_H / 2, CR.VIEW_H * 0.35,
                                     CR.VIEW_W / 2, CR.VIEW_H / 2, CR.VIEW_W * 0.72);
    v.addColorStop(0, 'rgba(0,0,0,0)');
    v.addColorStop(1, 'rgba(0,0,0,0.42)');
    ctx.fillStyle = v;
    ctx.fillRect(0, 0, CR.VIEW_W, CR.VIEW_H);
  };

  function drawSpikeRow(ctx, x, y, w, out) {
    var hgt = 8 * out;
    ctx.fillStyle = '#b9c2cb';
