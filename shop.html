<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop | Bazaarin</title>
    <meta name="description" content="Browse secondhand laptops and mobiles on Bazaarin.">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/samarkan" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <svg class="logo-icon-svg" width="32" height="32" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                                        <circle cx="50" cy="50" r="22" stroke="#F59E0B" stroke-width="6" fill="none"/>
                    <path d="M34 34 L 66 66 M 34 66 L 66 34" stroke="#F59E0B" stroke-width="6" stroke-linecap="round"/>
                    <circle cx="50" cy="20" r="6" fill="#F59E0B"/><circle cx="50" cy="80" r="6" fill="#F59E0B"/>
                    <circle cx="20" cy="50" r="6" fill="#F59E0B"/><circle cx="80" cy="50" r="6" fill="#F59E0B"/>
                </svg>
                <h1 class="logo-text">bazaar<span class="logo-in">in</span></h1>
            </a>
            <div class="search-bar">
                <input type="text" id="searchInput" class="search-input-product" placeholder="Search laptops, phones...">
                <input type="text" id="locationInput" class="search-input-location" placeholder="Location...">
                <button class="search-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </button>
            </div>
            <div class="nav-links">
                <a href="index.html" class="nav-link">Back to Home</a>
                <a href="sell.html" class="nav-link">Sell</a>
                <a href="signin.html" id="signInBtn" class="btn-primary">Sign In</a>
                <div class="dropdown">
                    <button class="kebab-menu" onclick="toggleMenu()">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
                    </button>
                    <div class="dropdown-content" id="myDropdown">
                        <a href="#">Customer Service</a>
                        <a href="seller.html" id="dashboardLink" class="hidden">Seller Dashboard</a>
                        <a href="#" id="logoutLink">Logout</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container product-page-container">
        <!-- Categories -->
        <section class="categories">
            <h3 class="section-title">Browse by Category</h3>
            <div class="category-grid" id="categoryFilter">
                <button class="category-card active" data-category="all">
                    All Devices
                </button>
                <button class="category-card" data-category="Laptops">
                    Laptops
                </button>
                <button class="category-card" data-category="Mobiles">
                    Mobiles
                </button>

            </div>
        </section>

        <!-- Product Grid -->
        <section class="products-section">
            <div class="section-header">
                <h3 class="section-title">Trending Now</h3>
                <div class="section-header-controls">
                    <button id="nearMeBtn" class="btn-secondary" type="button">📍 Use My Location</button>
                    <div class="sort-dropdown">
                        <select id="sortSelect">
                            <option value="newest">Newest Arrivals</option>
                            <option value="price-low">Price: Low to High</option>
                            <option value="price-high">Price: High to Low</option>
                            <option value="nearest">Nearest First</option>
                        </select>
                    </div>
                </div>
            </div>
            <p id="proximityStatus" class="proximity-status hidden"></p>
            <div class="product-grid" id="productGrid">
                <!-- Products will be injected here by shop.js -->
            </div>
            <div id="noResults" class="no-results hidden">
                <p>No products found matching your criteria.</p>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-content">
            <div class="logo">
                <svg class="logo-icon-svg" width="24" height="24" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                                        <circle cx="50" cy="50" r="22" stroke="#F59E0B" stroke-width="6" fill="none"/>
                    <path d="M34 34 L 66 66 M 34 66 L 66 34" stroke="#F59E0B" stroke-width="6" stroke-linecap="round"/>
                    <circle cx="50" cy="20" r="6" fill="#F59E0B"/><circle cx="50" cy="80" r="6" fill="#F59E0B"/>
                    <circle cx="20" cy="50" r="6" fill="#F59E0B"/><circle cx="80" cy="50" r="6" fill="#F59E0B"/>
                </svg>
                <h2 class="logo-text" style="font-size: 1.8rem;">bazaar<span class="logo-in">in</span></h2>
            </div>
            <p>&copy; 2026 bazaarin. Build for India.</p>
        </div>
    </footer>

    <script src="data.js"></script>
    <script src="utils.js"></script>
    <script src="geo.js"></script>
    <script src="deviceArt.js"></script>
    <script src="autocomplete.js"></script>
    <script src="auth.js"></script>
    <script src="compare.js"></script>
    <script src="shop.js"></script>
</body>
</html>
